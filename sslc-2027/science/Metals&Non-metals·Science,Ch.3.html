<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Metals and Non-metals — Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --paper-tint:#eceff9; --ink:#181c2a; --ink-soft:#5b6178; --ink-faint:#8c92a8; --line:#e2e5f2;
  --primary:#6c5ce0; --primary-dim:#8778e8; --primary-soft:#ece9fb;
  --push:#1f2937; --push-soft:#c6c9d1; --pull:#1d7f63; --pull-soft:#e1f3ec;
  --amber:#1f2937; --amber-soft:#c6c9d1;
  --glass:rgba(255,255,255,.7); --glass-strong:rgba(255,255,255,.9); --glass-line:rgba(255,255,255,.85);
  --sidebar-bg-top:#252c40; --sidebar-bg-bottom:#161b29; --sidebar-line:rgba(255,255,255,.08); --sidebar-text:#c6cbdd; --sidebar-text-dim:#7d84a0;
  --shadow: 0 26px 60px -34px rgba(30,32,70,.38), 0 3px 10px rgba(30,32,70,.07);
  --shadow-sm: 0 10px 24px -16px rgba(30,32,70,.3);
  --radius:22px; --radius-sm:14px;
  --font-display:'Newsreader', serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body{
  font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(900px 520px at 90% -8%, rgba(108,92,224,.10), transparent 60%),
    radial-gradient(760px 460px at -6% 18%, rgba(108,92,224,.06), transparent 55%),
    radial-gradient(680px 420px at 30% 112%, rgba(29,127,99,.06), transparent 55%),
    var(--paper-tint);
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button{font-family:inherit;}
::selection{background:var(--primary-soft);}
:focus-visible{outline:2.5px solid var(--primary); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

.shell{display:grid; grid-template-columns:264px 1fr; min-height:100vh;}
.rail{position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; padding:26px 18px; border-right:1px solid var(--sidebar-line); background:linear-gradient(190deg, var(--sidebar-bg-top), var(--sidebar-bg-bottom) 75%);}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px; border-bottom:1px solid var(--sidebar-line); margin-bottom:18px;}
.brand-mark{width:42px;height:42px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));background:#fff;border-radius:50%;}
.brand-text b{display:block; font-family:var(--font-display); font-size:16.5px; font-weight:600; color:#fff; line-height:1.15; letter-spacing:.01em;}
.brand-text span{display:block; font-size:10.5px; color:var(--sidebar-text-dim); margin-top:2px; letter-spacing:.03em; text-transform:uppercase;}
.route{position:relative; padding-left:6px;}
.route::before{content:""; position:absolute; left:19px; top:8px; bottom:8px; width:1.5px; background:var(--sidebar-line);}
.wp{position:relative; display:flex; align-items:flex-start; gap:12px; width:100%; background:transparent; border:none; text-align:left; cursor:pointer; padding:9px 10px; border-radius:12px; margin:1px 0; color:var(--sidebar-text); font-size:13.6px; font-weight:600; line-height:1.35; transition:background .15s ease, color .15s ease;}
.wp:hover{background:rgba(255,255,255,.07); color:#fff;}
.wp .wp-dot{position:relative; z-index:1; flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.06); border:1.5px solid var(--sidebar-line); display:flex; align-items:center; justify-content:center; font-size:13px; margin-top:1px;}
.wp.active{background:var(--primary); color:#fff; box-shadow:0 10px 24px -12px rgba(108,92,224,.7);}
.wp.active .wp-dot{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.4);}
.wp small{display:block; font-weight:500; font-size:11px; opacity:.75; margin-top:1px;}
.wp-quiz{margin-top:16px; padding-top:16px; border-top:1px solid var(--sidebar-line);}
.mobile-bar{display:none;}
.content{padding:44px 48px 90px; min-width:0;}
.content-inner{max-width:760px; margin:0 auto; animation:rise .38s cubic-bezier(.2,.8,.2,1);}
@keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.kicker{font-family:var(--font-mono); font-size:11.5px; color:var(--primary); letter-spacing:.03em; margin-bottom:10px;}
h1.page-title{font-family:var(--font-display); font-weight:600; font-size:clamp(26px,3.6vw,36px); margin:0 0 12px; letter-spacing:-.2px; color:var(--ink);}
p.lede{color:var(--ink-soft); font-size:16px; line-height:1.68; margin:0 0 30px; max-width:640px;}
.glass{background:var(--glass); backdrop-filter:blur(18px) saturate(160%); border:1px solid var(--glass-line); border-radius:var(--radius); box-shadow:var(--shadow);}
.block{margin:0 0 30px;}
.block:last-child{margin-bottom:0;}
.block-h{display:flex; align-items:baseline; gap:10px; font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--ink); margin:0 0 13px;}
.block-h .idx{font-family:var(--font-mono); font-size:11.5px; font-weight:500; color:var(--ink-faint);}
.block p{font-size:15px; line-height:1.7; color:var(--ink-soft); margin:0 0 10px;}
.block p:last-child{margin-bottom:0;}
.block p b, .block p strong{color:var(--ink); font-weight:650;}
.term-card{padding:20px 22px; margin:10px 0; border-radius:16px; background:linear-gradient(160deg, rgba(255,255,255,.85), rgba(234,237,251,.65)); border:1px solid var(--glass-line); box-shadow:var(--shadow-sm);}
.term-card .lab{font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--primary); margin-bottom:8px;}
.term-card p{font-family:var(--font-display); font-size:17.5px; font-weight:500; line-height:1.5; color:var(--ink); font-style:italic;}
.callout{padding:18px 20px; border-radius:16px; margin:12px 0; border:1px solid var(--amber-soft); background:var(--amber-soft);}
.callout .lab{font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
.callout p{color:var(--ink); font-size:14.5px; margin:0;}
.callout.extra{background:var(--primary-soft); border-color:#d9d3f7;}
.callout.extra .lab{color:var(--primary);}
.callout.extra p{color:var(--ink-soft);}
.place-pair{display:flex; align-items:center; gap:14px; margin:18px 0 22px; flex-wrap:wrap;}
.place-box{flex:1; min-width:150px; padding:18px 20px; border-radius:16px; text-align:center;}
.place-box.origin{background:var(--push-soft); border:1px solid #e7e9f0;}
.place-box.dest{background:var(--pull-soft); border:1px solid #c7e6da;}
.place-box .lab{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px;}
.place-box.origin .lab{color:var(--push);} .place-box.dest .lab{color:var(--pull);}
.place-box .val{font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink);}
.place-arrow{flex:0 0 auto; font-size:22px; color:var(--ink-faint);}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0;}
.stat-pill{padding:16px; border-radius:16px; background:var(--glass); border:1px solid var(--glass-line); text-align:center;}
.stat-pill .num{font-family:var(--font-mono); font-size:22px; font-weight:600; color:var(--primary);}
.stat-pill .lab{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--paper); margin:14px 0;}
table.data{width:100%; border-collapse:collapse; min-width:460px; font-size:13.5px;}
table.data th{text-align:left; background:var(--paper-tint); color:var(--ink-soft); font-size:10.8px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.data td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.5; color:var(--ink-soft);}
table.data tr:last-child td{border-bottom:none;}
table.data td.n{font-weight:650; color:var(--ink); white-space:nowrap;}
.chipset{display:flex; flex-wrap:wrap; gap:7px;}
.chip{background:var(--paper-tint); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.ledger{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.ledger-row{display:flex; gap:12px; align-items:flex-start; padding:13px 15px; border-radius:14px; background:var(--paper); border:1px solid var(--line);}
.ledger-badge{flex:0 0 auto; width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; margin-top:1px;}
.ledger-row.pos .ledger-badge{background:var(--pull-soft); color:var(--pull);}
.ledger-row.neg .ledger-badge{background:var(--push-soft); color:var(--push);}
.ledger-row p{margin:0; font-size:14px; line-height:1.55; color:var(--ink-soft);}
.ledger-row b{color:var(--ink);}
.ledger-heading{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin:22px 0 8px; color:var(--ink-faint);}
.ledger-heading:first-child{margin-top:0;}
.ledger-heading.pos{color:var(--pull);} .ledger-heading.neg{color:var(--push);}
.tree{margin:18px 0;}
.tree-root{display:inline-block; padding:11px 20px; border-radius:12px; background:var(--primary); color:#fff; font-family:var(--font-display); font-weight:600; font-size:15px; margin-bottom:4px;}
.tree-kids{position:relative; padding-left:26px; margin-top:6px; border-left:1.5px solid var(--line);}
.tree-kid{position:relative; margin:14px 0 14px 14px; padding:14px 16px; border-radius:14px; background:var(--paper); border:1px solid var(--line);}
.tree-kid::before{content:""; position:absolute; left:-14px; top:18px; width:14px; height:1.5px; background:var(--line);}
.tree-kid h5{margin:0 0 5px; font-size:14.5px; font-weight:700; color:var(--ink);}
.tree-kid p{margin:0; font-size:13.3px; color:var(--ink-soft); line-height:1.55;}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:16px 0;}
.flow-chip{padding:10px 15px; border-radius:12px; background:var(--paper); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink);}
.flow-chip.warn{background:var(--push-soft); border-color:#e7e9f0; color:var(--push);}
.flow-chip.good{background:var(--pull-soft); border-color:#c7e6da; color:var(--pull);}
.flow-arrow{color:var(--ink-faint); font-size:15px;}
.timeline{position:relative; margin:20px 0; padding-left:8px;}
.tl-step{position:relative; padding-left:44px; padding-bottom:26px;}
.tl-step:last-child{padding-bottom:0;}
.tl-step::before{content:""; position:absolute; left:15px; top:30px; bottom:-4px; width:1.5px; background:var(--line);}
.tl-step:last-child::before{display:none;}
.tl-num{position:absolute; left:0; top:0; width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:13px;}
.tl-step h5{margin:2px 0 6px; font-family:var(--font-display); font-size:16.5px; font-weight:600; color:var(--ink);}
.tl-step p{font-size:14.6px; line-height:1.65; color:var(--ink-soft); margin:0;}
.tl-step .chipset{margin-top:8px;}
.flip-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin:16px 0;}
.flip-card{perspective:1200px; height:150px; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--glass-line); box-shadow:var(--shadow-sm);}
.flip-front{background:linear-gradient(160deg,#fff,var(--primary-soft));}
.flip-front .t{font-family:var(--font-display); font-weight:600; font-size:16.5px; color:var(--ink);}
.flip-front .hint{margin-top:8px; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
.flip-back{background:var(--ink); color:#fff; transform:rotateY(180deg);}
.flip-back p{margin:0; font-size:12.6px; line-height:1.5; color:#dfe3ee;}
.radial{position:relative; width:100%; max-width:540px; aspect-ratio:1/1; margin:34px auto 22px;}
.radial-ring{position:absolute; inset:16%; border:1.5px dashed var(--line); border-radius:50%;}
.radial-hub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:148px; height:148px; border-radius:50%; background:linear-gradient(160deg, var(--primary), #222d63); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--font-display); font-size:18.5px; font-weight:600; box-shadow:0 22px 42px -18px rgba(30,41,70,.55); padding:8px; z-index:2;}
.radial-node{position:absolute; width:184px; transform:translate(-50%,-50%); z-index:1;}
.radial-node .card{background:var(--glass); backdrop-filter:blur(16px) saturate(160%); border:1px solid var(--glass-line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow-sm);}
.radial-node .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px;}
.radial-node h5{display:flex; align-items:center; margin:0 0 8px; font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--ink);}
.radial-node .chipset{gap:5px;}
.radial-node .chip{font-size:10.8px; padding:3px 9px;}
@media (max-width:760px){
  .radial{max-width:none; height:auto; aspect-ratio:auto;}
  .radial-ring{display:none;}
  .radial-hub{position:static; transform:none; margin:0 auto 14px; width:100%; max-width:220px; border-radius:20px; height:auto; padding:16px;}
  .radial-node{position:static; width:100%; transform:none; margin-bottom:12px;}
}
.finale{background:linear-gradient(165deg, var(--ink), #232c3d); border-radius:20px; padding:26px 28px; margin-top:10px; color:#fff;}
.finale b{display:block; font-family:var(--font-display); font-size:18px; font-weight:600; margin-bottom:6px;}
.finale span{font-size:13.5px; color:#b7bfcf; line-height:1.6;}
.chain{font-family:var(--font-display); font-style:italic; font-size:15.5px; color:var(--ink); border-left:3px solid var(--amber); padding-left:16px; margin:14px 0;}
.quiz-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
.qz-progress{display:flex; gap:5px; flex:1; min-width:160px;}
.qz-progress span{flex:1; height:4px; border-radius:4px; background:var(--line);}
.qz-progress span.done{background:var(--pull);} .qz-progress span.current{background:var(--primary);}
.qz-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.qz-card{padding:32px 30px 28px;}
.qz-text{font-family:var(--font-display); font-weight:600; font-size:clamp(19px,2.6vw,23px); margin:0 0 20px; line-height:1.4; color:var(--ink);}
.qz-choice{display:block; width:100%; text-align:left; background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; font-size:15px; color:var(--ink); transition:all .16s ease; font-family:inherit;}
.qz-choice:hover:not(:disabled){border-color:var(--primary);}
.qz-choice:disabled{cursor:default;}
.qz-choice .let{font-family:var(--font-mono); font-weight:700; color:var(--primary); margin-right:10px;}
.qz-choice.correct{background:var(--pull-soft); border-color:var(--pull);} .qz-choice.correct .let{color:var(--pull);}
.qz-choice.wrong{background:var(--push-soft); border-color:var(--push);} .qz-choice.wrong .let{color:var(--push);}
.qz-feedback{margin-top:6px; padding:13px 16px; border-radius:12px; font-size:14.5px; font-weight:600;}
.qz-feedback.ok{background:var(--pull-soft); color:var(--pull);} .qz-feedback.no{background:var(--push-soft); color:var(--push);}
.qz-btnrow{display:flex; gap:12px; flex-wrap:wrap; margin-top:22px;}
.btn{display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-weight:650; font-size:14.5px; padding:12px 22px; border-radius:12px; transition:transform .15s ease, box-shadow .15s ease;}
.btn-primary{background:linear-gradient(155deg, var(--primary-dim), var(--primary)); color:#fff; box-shadow:0 12px 24px -12px rgba(51,65,143,.65);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
.btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.qz-mastery{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:22px 0;}
.qz-stat{background:var(--paper-tint); border:1px solid var(--line); border-radius:14px; padding:18px;}
.qz-stat .num{font-family:var(--font-display); font-size:30px; font-weight:600; color:var(--ink);}
.qz-stat .lab{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.qz-badge{display:inline-flex; align-items:center; gap:7px; background:var(--primary); color:#fff; font-weight:700; font-size:13px; padding:8px 16px; border-radius:999px; margin-top:4px;}
.qz-review{list-style:none; padding:0; margin:18px 0; display:flex; flex-direction:column; gap:10px;}
.qz-review li{font-size:14px; color:var(--ink); display:flex; gap:9px; align-items:flex-start; line-height:1.5;}
.qz-review li .ic{flex:0 0 auto; font-weight:700;}
.qz-review li.ok .ic{color:var(--pull);} .qz-review li.bad .ic{color:var(--push);}
.qz-review li b{color:var(--ink);}
@media (max-width:960px){
  .shell{grid-template-columns:1fr;}
  .rail{position:fixed; inset:0 20% 0 0; transform:translateX(-100%); transition:transform .25s ease; z-index:40; box-shadow:0 0 60px rgba(0,0,0,.25);}
  .shell.rail-open .rail{transform:translateX(0);}
  .shell.rail-open::after{content:""; position:fixed; inset:0; background:rgba(20,24,34,.35); z-index:30;}
  .mobile-bar{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--glass-strong); backdrop-filter:blur(20px); position:sticky; top:0; z-index:20;}
  .mobile-bar button{background:var(--paper); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; font-size:16px; cursor:pointer;}
  .mobile-bar b{font-family:var(--font-display); font-size:15.5px;}
  .content{padding:26px 18px 70px;}
}
@media (max-width:640px){.qz-card{padding:24px 20px 22px;}}
.qa-list{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.qa{border-radius:14px; background:var(--paper); border:1px solid var(--line); overflow:hidden;}
.qa summary{cursor:pointer; list-style:none; padding:14px 16px 14px 44px; position:relative; font-size:14.5px; font-weight:650; color:var(--ink); line-height:1.45;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary::before{content:"+"; position:absolute; left:14px; top:13px; width:22px; height:22px; border-radius:7px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700;}
.qa[open] summary::before{content:"−";}
.qa[open] summary{border-bottom:1px solid var(--line);}
.qa-body{padding:14px 16px 16px; background:var(--paper-tint);}
.qa-body p{margin:0 0 10px !important; font-size:14.2px; line-height:1.65; color:var(--ink-soft);}
.qa-body p:last-child{margin-bottom:0 !important;}

.tug{position:relative;display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--glass-line);box-shadow:var(--shadow);margin:20px 0;}
.tug-side{flex:1;padding:24px 22px 22px;min-width:0;}
.tug-side.push-side{background:linear-gradient(165deg,#fff,var(--push-soft));}
.tug-side.pull-side{background:linear-gradient(165deg,#ecf8f1,var(--pull-soft));}
.tug-side h4{margin:0 0 4px;font-family:var(--font-display);font-size:18px;font-weight:600;}
.tug-side.push-side h4{color:var(--push);} .tug-side.pull-side h4{color:var(--pull);}
.tug-side .cap{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.tug-side p{font-size:14px;line-height:1.6;margin:0 0 8px;color:var(--ink-soft);}
.tug-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-shadow:0 14px 30px -12px rgba(22,27,34,.55);border:4px solid var(--paper);}
@media (min-width:641px){.tug-side.push-side{padding-right:44px;}.tug-side.pull-side{padding-left:44px;}}
@media (max-width:640px){.tug{flex-direction:column;}.tug-badge{position:static;transform:none;margin:-14px auto;}}
.bars{display:flex;flex-direction:column;gap:12px;margin:16px 0;}
.bar-row{display:grid;grid-template-columns:130px 1fr 96px;align-items:center;gap:10px;}
.bar-row .name{font-size:13.5px;font-weight:600;}
.bar-track{height:12px;background:var(--paper-tint);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-dim),var(--primary));}
.bar-row .val{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);text-align:right;}

/* ===== Chapter additions (same theme) ===== */
.eq{margin:12px 0; padding:14px 18px; border-radius:14px; background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--primary); overflow-x:auto;}
.eq-main{font-size:17px; font-weight:600; color:var(--ink); white-space:nowrap; line-height:2;}
.eq-main sub{font-size:.68em;}
.eq-note{font-size:12.6px; color:var(--ink-faint); margin-top:4px; line-height:1.5;}
.st{font-size:.7em; color:var(--ink-faint); font-weight:500; margin-left:1px;}
.arr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 10px; line-height:1.1; min-width:34px;}
.arr i{font-style:normal; font-size:10.5px; color:var(--primary); font-weight:700; white-space:nowrap; padding:0 4px;}
.arr b{font-size:20px; color:var(--ink-soft); font-weight:400;}
.fig{margin:18px 0; padding:16px 16px 12px; border-radius:18px; background:linear-gradient(160deg,#fff,var(--paper-tint)); border:1px solid var(--line); box-shadow:var(--shadow-sm);}
.fig svg{width:100%; height:auto; display:block; max-height:320px;}
.fig figcaption{font-size:12.8px; color:var(--ink-soft); margin-top:8px; text-align:center; line-height:1.5;}
.act{padding:18px 20px; border-radius:16px; margin:14px 0; background:var(--pull-soft); border:1px solid #c7e6da;}
.act .lab{font-size:11px; font-weight:700; color:var(--pull); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;}
.act ol{margin:0; padding-left:20px;}
.act li{font-size:14.3px; line-height:1.6; color:var(--ink); margin-bottom:4px;}
.act .obs{margin-top:10px; padding-top:10px; border-top:1px dashed #b9dccd; font-size:14px; color:var(--ink-soft); line-height:1.6;}
.act .obs b{color:var(--pull);}
.sign-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0;}
.sign{padding:16px; border-radius:16px; background:var(--glass); border:1px solid var(--glass-line); box-shadow:var(--shadow-sm);}
.sign .ic{font-size:26px;}
.sign h5{margin:6px 0 4px; font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink);}
.sign p{margin:0; font-size:12.8px; line-height:1.5; color:var(--ink-soft);}
.pattern{display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:14px 16px; border-radius:14px; background:var(--paper); border:1px solid var(--line); margin:12px 0;}
.pattern .mol{display:inline-flex; gap:2px; padding:4px; border-radius:999px; background:var(--paper-tint);}
.atom{width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);}
.pattern .op{color:var(--ink-faint); font-weight:700; font-size:16px;}
.pattern .cap{flex-basis:100%; font-size:12.8px; color:var(--ink-soft); margin-top:2px;}
/* balancer */
.bal{padding:22px; border-radius:var(--radius); background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow); margin:18px 0;}
.bal-tabs{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px;}
.bal-tab{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.bal-tab.on{background:var(--primary); border-color:var(--primary); color:#fff;}
.bal-eq{display:flex; align-items:center; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px 0 18px;}
.sp{display:flex; align-items:center; gap:6px; padding:6px 10px 6px 6px; border-radius:14px; background:var(--paper); border:1px solid var(--line);}
.coef{display:flex; flex-direction:column; align-items:center;}
.coef button{width:28px; height:20px; border:none; background:var(--primary-soft); color:var(--primary); font-weight:700; cursor:pointer; border-radius:6px; font-size:11px; line-height:1;}
.coef span{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--primary); padding:1px 0;}
.sp .fm{font-size:19px; font-weight:650; color:var(--ink);}
.sp .fm sub{font-size:.66em;}
.bal-op{font-size:18px; color:var(--ink-faint); font-weight:700;}
.bal-rows{display:flex; flex-direction:column; gap:8px;}
.bal-row{display:grid; grid-template-columns:52px 1fr 1fr 34px; gap:10px; align-items:center; padding:9px 12px; border-radius:12px; background:var(--paper); border:1px solid var(--line);}
.bal-row .el{font-weight:700; color:var(--ink);}
.dots{display:flex; flex-wrap:wrap; gap:3px; align-items:center; font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}
.dots i{width:11px; height:11px; border-radius:50%; display:inline-block;}
.dots em{font-style:normal; margin-left:6px;}
.bal-row .ok{font-weight:700; text-align:center;}
.bal-row.good{border-color:#c7e6da; background:var(--pull-soft);} .bal-row.good .ok{color:var(--pull);}
.bal-row.bad .ok{color:#b42318;}
.bal-head{display:grid; grid-template-columns:52px 1fr 1fr 34px; gap:10px; padding:0 12px; font-size:10.8px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint);}
.bal-status{margin-top:14px; padding:13px 16px; border-radius:12px; font-size:14.3px; font-weight:600; background:var(--paper-tint); color:var(--ink-soft);}
.bal-status.win{background:var(--pull-soft); color:var(--pull);}
.bal-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.bal-actions .btn{padding:9px 16px; font-size:13.5px;}
@media (max-width:640px){.bal{padding:16px;} .bal-row,.bal-head{grid-template-columns:40px 1fr 1fr 26px; gap:6px;}}

/* ===== Metals & Non-metals additions (same theme) ===== */
.act .caution{font-size:13px; font-weight:600; color:#8a4b00; background:#fff4d6; border:1px solid #f0dca0; border-radius:10px; padding:8px 12px; margin:0 0 10px;}
.dot-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0;}
.dotcard{padding:16px; border-radius:16px; background:var(--glass); border:1px solid var(--glass-line); box-shadow:var(--shadow-sm); text-align:center;}
.dotcard .dsym{font-family:var(--font-display); font-size:30px; font-weight:600; color:var(--ink); letter-spacing:1px;}
.dotcard .d, .dotcard .dd{color:#e0a526; font-weight:800;}
.dotcard p{margin:6px 0 0 !important; font-size:12.5px !important;}
.metallurgy{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
.mband{display:grid; grid-template-columns:minmax(150px,220px) 1fr; align-items:center; gap:14px; padding:12px 16px; border-radius:14px; border:1px solid var(--line);}
.mband .mm{font-family:var(--font-mono); font-weight:600; font-size:14px; color:var(--ink);}
.mband .mt b{display:block; font-size:14px; color:var(--ink);} .mband .mt span{font-size:13px; color:var(--ink-soft);}
.mband.hi{background:#fde8e8; border-color:#f5c2c2;} .mband.mid{background:#fff4d6; border-color:#f0dca0;} .mband.lo{background:var(--pull-soft); border-color:#c7e6da;}
@media (max-width:640px){.mband{grid-template-columns:1fr; gap:4px;}}
/* ladder */
.ladder{display:flex; flex-direction:column; gap:5px; margin:16px 0; padding:18px; border-radius:var(--radius); background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow);}
.rung{display:grid; grid-template-columns:44px 120px 1fr; align-items:center; gap:10px;}
.rung .sy{font-family:var(--font-mono); font-weight:700; font-size:15px; color:#fff; border-radius:9px; text-align:center; padding:5px 0;}
.rung .nm{font-size:13.5px; font-weight:600; color:var(--ink);}
.rung .tr{height:10px; border-radius:999px; background:var(--paper-tint); overflow:hidden; border:1px solid var(--line);}
.rung .tr i{display:block; height:100%; border-radius:999px;}
.rung.h .sy{background:#fff !important; color:var(--ink-soft); border:1.5px dashed var(--ink-faint);}
.rung.h .nm{color:var(--ink-faint); font-style:italic;}
.ladder-ends{display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint); margin:2px 0 8px;}
@media (max-width:520px){.rung{grid-template-columns:40px 92px 1fr;}}
/* predictor */
.pred{padding:22px; border-radius:var(--radius); background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow); margin:16px 0;}
.pred h6{margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint);}
.pick{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px;}
.pick button{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.pick button.on{background:var(--primary); border-color:var(--primary); color:#fff;}
.pick button sub{font-size:.7em;}
.pres{border-radius:16px; padding:16px 18px; border:1px solid var(--line); background:var(--paper);}
.pres.yes{background:var(--pull-soft); border-color:#c7e6da;} .pres.no{background:var(--paper-tint);}
.pres .verdict{font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink); margin-bottom:6px;}
.pres.yes .verdict{color:var(--pull);}
.pres p{margin:6px 0 0 !important; font-size:14px !important; color:var(--ink-soft) !important;}
.pres .eq{margin:10px 0 2px;}
/* explorer */
.xgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin:14px 0;}
.xtile{border:1px solid var(--line); background:var(--paper); border-radius:14px; padding:8px 4px; cursor:pointer; text-align:center; transition:transform .15s ease;}
.xtile:hover{transform:translateY(-2px);}
.xtile b{display:block; font-family:var(--font-mono); font-size:18px; color:var(--ink);}
.xtile span{font-size:10px; color:var(--ink-soft);}
.xtile .lv{display:flex; justify-content:center; gap:2px; margin-top:4px;}
.xtile .lv i{width:6px; height:6px; border-radius:50%; background:var(--line);}
.xtile .lv i.f{background:#e0a526;}
.xtile.on{background:var(--primary); border-color:var(--primary);}
.xtile.on b, .xtile.on span{color:#fff;}
.xcard{padding:20px 22px; border-radius:var(--radius); background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow);}
.xcard h4{margin:0 0 2px; font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--ink);}
.xcard .sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
.xrow{display:grid; grid-template-columns:130px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.55;}
.xrow .k{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--primary); padding-top:2px;}
.xrow .v{color:var(--ink-soft);}
@media (max-width:520px){.xrow{grid-template-columns:1fr; gap:2px;}}
/* carat */
.carat{padding:22px; border-radius:var(--radius); background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow); margin:16px 0;}
.carat-top{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.carat-top .big{font-family:var(--font-display); font-size:34px; font-weight:600; color:var(--ink);}
.carat-top .pct{font-family:var(--font-mono); font-size:20px; font-weight:600; color:#b7791f;}
.carat input[type=range]{width:100%; margin:14px 0 6px; accent-color:var(--primary);}
.parts{display:grid; grid-template-columns:repeat(12,1fr); gap:5px; margin:12px 0;}
.parts i{aspect-ratio:1/1; border-radius:6px; background:#d6d3d1;}
.parts i.g{background:linear-gradient(150deg,#fde68a,#e0a526);}
.carat-note{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
.legend{display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap;}
.legend span::before{content:""; display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:#d6d3d1;}
.legend span.g::before{background:#e0a526;}
/* pillar */
.pillar{display:grid; grid-template-columns:90px 1fr; gap:18px; align-items:center;}
.pillar-art svg{width:90px; height:auto;}
@media (max-width:520px){.pillar{grid-template-columns:1fr;} .pillar-art{display:none;}}
.radial-hub{font-size:17px;}
</style>
</head>

function chips(arr, cls){
  cls = cls || '';
  return '<div class="chipset">' + arr.map(function(c){ return '<span class="chip '+cls+'">'+c+'</span>'; }).join('') + '</div>';
}
function flipGrid(terms){
  return '<div class="flip-grid">' + terms.map(function(t){
    return '<div class="flip-card"><div class="flip-inner"><div class="flip-face flip-front"><div class="t">'+t.term+'</div><div class="hint">tap to reveal</div></div><div class="flip-face flip-back"><p>'+t.def+'</p></div></div></div>';
  }).join('') + '</div>';
}
var RADIAL_OFFSETS = [[0,-222],[134,-134],[190,0],[134,134],[0,222],[-134,134],[-190,0],[-134,-134]];
function radialMap(hub, nodes){
  var html = '<div class="radial"><div class="radial-ring"></div><div class="radial-hub">'+hub+'</div>';
  nodes.forEach(function(n, i){
    var off = RADIAL_OFFSETS[i % RADIAL_OFFSETS.length];
    html += '<div class="radial-node" style="left:calc(50% + '+off[0]+'px); top:calc(50% + '+off[1]+'px);"><div class="card"><h5><span class="dot" style="background:'+n.color+'"></span>'+n.label+'</h5>'+n.body+'</div></div>';
  });
  return html + '</div>';
}

/* ---------- chemistry text helpers ---------- */
function c(s){ return s.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>'); }
function arr(cond){ return '<span class="arr">'+(cond?'<i>'+cond+'</i>':'<i>&nbsp;</i>')+'<b>⟶</b></span>'; }
function eq(s, note){
  var h = c(s).replace(/\((s|l|g|aq)\)/g,'<span class="st">($1)</span>')
              .replace(/->\{([^}]*)\}/g, function(m,k){ return arr(k); })
              .replace(/->/g, arr(''));
  return '<div class="eq"><div class="eq-main">'+h+'</div>'+(note?'<div class="eq-note">'+note+'</div>':'')+'</div>';
}
function atom(l,col){ return '<span class="atom" style="background:'+col+'">'+l+'</span>'; }
function mol(){ return '<span class="mol">'+Array.prototype.slice.call(arguments).join('')+'</span>'; }
function op(t){ return '<span class="op">'+t+'</span>'; }
function act(title, steps, obs){
  return '<div class="act"><div class="lab">Activity · '+title+'</div><ol>'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'+(obs?'<div class="obs"><b>What you see:</b> '+obs+'</div>':'')+'</div>';
}
function tug(lt, lc, lp, rt, rc, rp, badge){
  return '<div class="tug"><div class="tug-side push-side"><h4>'+lt+'</h4><div class="cap">'+lc+'</div>'+lp.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div><div class="tug-badge">'+(badge||'vs')+'</div><div class="tug-side pull-side"><h4>'+rt+'</h4><div class="cap">'+rc+'</div>'+rp.map(function(p){return '<p>'+p+'</p>';}).join('')+'</div></div>';
}

/* ---------- SVG illustration helpers ---------- */
var GL = '#5b6178';
function svg(vb, inner){ return '<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, sans-serif">'+inner+'</svg>'; }
function fig(s, cap){ return '<figure class="fig">'+s+'<figcaption>'+cap+'</figcaption></figure>'; }
function T(x,y,t,a,col,sz,w){ return '<text x="'+x+'" y="'+y+'" font-size="'+(sz||11.5)+'" font-weight="'+(w||500)+'" fill="'+(col||'#5b6178')+'" text-anchor="'+(a||'start')+'">'+t+'</text>'; }
function L(x1,y1,x2,y2,col,w,dash){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(col||'#8c92a8')+'" stroke-width="'+(w||1)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round"/>'; }
function bench(y){ return '<rect x="8" y="'+y+'" width="384" height="9" rx="4" fill="#d8cbb3"/>'; }
function flame(cx, baseY, s){
  s = s||1; var h=34*s, w=11*s, h2=20*s, w2=6*s;
  return '<path d="M'+cx+' '+(baseY-h)+' C'+(cx+w)+' '+(baseY-h*0.45)+' '+(cx+w)+' '+baseY+' '+cx+' '+baseY+' C'+(cx-w)+' '+baseY+' '+(cx-w)+' '+(baseY-h*0.45)+' '+cx+' '+(baseY-h)+'Z" fill="#f59e0b"/>'+
         '<path d="M'+cx+' '+(baseY-h2)+' C'+(cx+w2)+' '+(baseY-h2*0.45)+' '+(cx+w2)+' '+baseY+' '+cx+' '+baseY+' C'+(cx-w2)+' '+baseY+' '+(cx-w2)+' '+(baseY-h2*0.45)+' '+cx+' '+(baseY-h2)+'Z" fill="#fde68a"/>';
}
function burner(cx, by){
  return '<rect x="'+(cx-22)+'" y="'+(by-8)+'" width="44" height="8" rx="3" fill="#6b7280"/><rect x="'+(cx-6)+'" y="'+(by-58)+'" width="12" height="50" rx="2" fill="#9ca3af"/>'+flame(cx, by-58, 1);
}
function tube(x,y,w,h,liq,lvl,ppt){
  var r=w/2, by=y+h-r, arc=' A'+r+' '+r+' 0 0 0 '+(x+w)+' '+by, s='';
  if(liq) s+='<path d="M'+x+' '+lvl+' L'+x+' '+by+arc+' L'+(x+w)+' '+lvl+' Z" fill="'+liq+'"/>';
  if(ppt) s+='<path d="M'+x+' '+(by-ppt.h)+' L'+x+' '+by+arc+' L'+(x+w)+' '+(by-ppt.h)+' Z" fill="'+ppt.c+'"/>';
  s+='<path d="M'+x+' '+y+' L'+x+' '+by+arc+' L'+(x+w)+' '+y+'" fill="none" stroke="'+GL+'" stroke-width="2"/>';
  s+=L(x-3,y,x+w+3,y,GL,2);
  return s;
}
function bubbles(pts, col){ return pts.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(p[2]||3)+'" fill="none" stroke="'+(col||'#5b6178')+'" stroke-width="1.2"/>'; }).join(''); }
function heatedTube(solid, fumes, fumeCol){
  var g='<g transform="translate(200,112) rotate(-30)">'+tube(-12,-92,24,112,null,0,{h:12,c:solid})+'</g>';
  var f='';
  if(fumes){ f+='<g fill="'+fumeCol+'" opacity=".55"><circle cx="146" cy="22" r="9"/><circle cx="132" cy="14" r="11"/><circle cx="116" cy="10" r="8"/><circle cx="138" cy="4" r="7"/></g>'; }
  else { f+='<path d="M148 28 q-8 -6 -2 -12 t-4 -12 M138 30 q-8 -6 -2 -12 t-4 -12" fill="none" stroke="#8c92a8" stroke-width="1.4"/>'; }
  return bench(226)+burner(210,226)+L(270,50,193,70,'#6b7280',3)+L(272,58,195,77,'#6b7280',3)+g+f;
}
