81c2a\"/><circle cx=\"341.0\" cy=\"300.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"329.0\" cy=\"329.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"300.0\" cy=\"341.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"271.0\" cy=\"329.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"259.0\" cy=\"300.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"271.0\" cy=\"271.0\" r=\"3.6\" fill=\"#181c2a\"/><text x=\"331.98\" y=\"268.02\" font-size=\"14\" font-weight=\"700\" fill=\"#e0a526\" text-anchor=\"middle\">2+</text><path d=\"M253 255 l-5 0 l0 90 l5 0 M347 255 l5 0 l0 90 l-5 0\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.4\"/><circle cx=\"500\" cy=\"300\" r=\"28\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"500\" cy=\"300\" r=\"41\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"500\" cy=\"300\" r=\"54\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"500\" cy=\"300\" r=\"15\" fill=\"#1d7f63\"/><text x=\"500\" y=\"304.5\" font-size=\"12.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Cl</text><circle cx=\"500.0\" cy=\"272.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"500.0\" cy=\"328.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"500.0\" cy=\"259.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"529.0\" cy=\"271.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"541.0\" cy=\"300.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"529.0\" cy=\"329.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"500.0\" cy=\"341.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"471.0\" cy=\"329.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"459.0\" cy=\"300.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"471.0\" cy=\"271.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"500.0\" cy=\"246.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"538.2\" cy=\"261.8\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"554.0\" cy=\"300.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"538.2\" cy=\"338.2\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"500.0\" cy=\"354.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"461.8\" cy=\"338.2\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"446.0\" cy=\"300.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"461.8\" cy=\"261.8\" r=\"4.2\" fill=\"#6c5ce0\" stroke=\"#fff\" stroke-width=\"1\"/><text x=\"542.12\" y=\"257.88\" font-size=\"14\" font-weight=\"700\" fill=\"#1d7f63\" text-anchor=\"middle\">−</text><path d=\"M440 242 l-5 0 l0 116 l5 0 M560 242 l5 0 l0 116 l-5 0\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.4\"/><text x=\"100\" y=\"384\" font-size=\"12\" font-weight=\"700\" fill=\"#1d7f63\" text-anchor=\"middle\">Cl⁻ · 2, 8, 8</text><text x=\"300\" y=\"384\" font-size=\"12\" font-weight=\"700\" fill=\"#e0a526\" text-anchor=\"middle\">Mg²⁺ · 2, 8</text><text x=\"500\" y=\"384\" font-size=\"12\" font-weight=\"700\" fill=\"#1d7f63\" text-anchor=\"middle\">Cl⁻ · 2, 8, 8</text><text x=\"300\" y=\"410\" font-size=\"12\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">One Mg²⁺ ion balances two Cl⁻ ions: the formula is MgCl₂</text></svg><figcaption>Magnesium has two outer electrons to lose, but each chlorine atom needs only one. So one magnesium atom reacts with two chlorine atoms.</figcaption></figure><div class=\"term-card\"><div class=\"lab\">Ionic (electrovalent) compounds</div><p>Compounds formed by the transfer of electrons from a metal to a non-metal are known as ionic compounds or electrovalent compounds.</p></div><div class=\"callout extra\"><div class=\"lab\">Quick check</div><p>In MgCl<sub>2</sub> the cation is <b>Mg²⁺</b> (magnesium ion) and the anion is <b>Cl⁻</b> (chloride ion). Two chloride ions balance the double positive charge of one magnesium ion.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">30</span>Electron-dot structures</div><p>Chemists often show only the outermost electrons as dots around the symbol. These are called <b>electron-dot structures</b> (Lewis structures).</p><div class=\"dot-row\"><div class=\"dotcard\"><div class=\"dsym\">Na<span class=\"d d1\">•</span></div><p>Sodium · 1 valence electron</p></div><div class=\"dotcard\"><div class=\"dsym\">Mg<span class=\"d d1\">•</span><span class=\"d d2\">•</span></div><p>Magnesium · 2 valence electrons</p></div><div class=\"dotcard\"><div class=\"dsym\"><span class=\"dd\">: </span>O<span class=\"dd\"> :</span></div><p>Oxygen · 6 valence electrons</p></div><div class=\"dotcard\"><div class=\"dsym\"><span class=\"dd\">: </span>Cl<span class=\"dd\"> ⁝</span></div><p>Chlorine · 7 valence electrons</p></div></div><p><b>Na₂O:</b> two sodium atoms each give one electron to one oxygen atom: 2Na → 2Na⁺ + 2e⁻ and O + 2e⁻ → O²⁻. Oxygen gets an octet (2, 8) and both sodium ions get the neon arrangement (2, 8).</p><p><b>MgO:</b> one magnesium atom gives both its outer electrons to one oxygen atom: Mg → Mg²⁺ + 2e⁻ and O + 2e⁻ → O²⁻.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Compound</th><th>Electrons transferred</th><th>Cation</th><th>Anion</th></tr></thead><tbody><tr><td class=\"n\">NaCl</td><td>1 (Na → Cl)</td><td>Na⁺</td><td>Cl⁻</td></tr><tr><td class=\"n\">MgCl₂</td><td>2 (1 to each Cl)</td><td>Mg²⁺</td><td>Cl⁻</td></tr><tr><td class=\"n\">Na₂O</td><td>2 (1 from each Na)</td><td>Na⁺</td><td>O²⁻</td></tr><tr><td class=\"n\">MgO</td><td>2 (Mg → O)</td><td>Mg²⁺</td><td>O²⁻</td></tr><tr><td class=\"n\">CaCl₂</td><td>2 (1 to each Cl)</td><td>Ca²⁺</td><td>Cl⁻</td></tr></tbody></table></div></div>"}, "ionicprops": {"icon": "🧂", "label": "Properties of Ionic Compounds", "sub": "Hard, high-melting, conduct when free", "kicker": "Properties of ionic compounds", "html": "<p class=\"lede\">Because ionic compounds are built from oppositely charged ions locked in a rigid pattern, they share a distinctive set of properties. Common salt is the perfect example.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">31</span>Testing some salts</div><div class=\"act\"><div class=\"lab\">Activity · Investigate common salts</div><ol><li>Take samples of sodium chloride, potassium iodide, barium chloride or any other salt and note their physical state.</li><li>Heat a small amount of each on a metal spatula directly in the flame. Do they melt? Do they colour the flame?</li><li>Try to dissolve each sample in water, petrol and kerosene.</li><li>Dip the electrodes of a battery-and-bulb circuit into a solution of each salt.</li></ol><div class=\"obs\"><b>What you see:</b> The salts are <b>solid</b> and difficult to melt; some colour the flame. They <b>dissolve in water</b> but not in petrol or kerosene. Their solutions make the bulb <b>glow</b>.</div></div><figure class=\"fig\"><svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><defs><radialGradient id=\"glow2\"><stop offset=\"0\" stop-color=\"#fde68a\"/><stop offset=\"1\" stop-color=\"#fde68a\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M150 120 L150 40 L182 40 M218 40 L320 40 L320 70 M320 110 L320 140 M250 140 L250 120\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2.2\"/><path d=\"M150 120 L150 112\" stroke=\"#5b6178\"/><rect x=\"300\" y=\"70\" width=\"40\" height=\"40\" rx=\"4\" fill=\"#1f2937\"/><text x=\"320\" y=\"95\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">+ −</text><path d=\"M320 140 L320 150 L250 150 L250 120\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2.2\"/><circle cx=\"200\" cy=\"34\" r=\"36\" fill=\"url(#glow2)\"/><circle cx=\"200\" cy=\"32\" r=\"16\" fill=\"#fff7cc\" stroke=\"#5b6178\" stroke-width=\"2\"/><rect x=\"190\" y=\"44\" width=\"20\" height=\"10\" rx=\"2\" fill=\"#9ca3af\"/><path d=\"M110 100 L110 210 Q110 218 118 218 L282 218 Q290 218 290 210 L290 100\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><path d=\"M112 140 L112 210 Q112 216 118 216 L282 216 Q288 216 288 210 L288 140 Z\" fill=\"#e0f2fe\"/><rect x=\"144\" y=\"112\" width=\"12\" height=\"94\" rx=\"2\" fill=\"#374151\"/><rect x=\"244\" y=\"112\" width=\"12\" height=\"94\" rx=\"2\" fill=\"#374151\"/><circle cx=\"170\" cy=\"160\" r=\"5\" fill=\"#1d7f63\"/><circle cx=\"184\" cy=\"176\" r=\"5\" fill=\"#6c5ce0\"/><circle cx=\"198\" cy=\"192\" r=\"5\" fill=\"#1d7f63\"/><circle cx=\"212\" cy=\"160\" r=\"5\" fill=\"#6c5ce0\"/><circle cx=\"226\" cy=\"176\" r=\"5\" fill=\"#1d7f63\"/><circle cx=\"240\" cy=\"192\" r=\"5\" fill=\"#6c5ce0\"/><text x=\"20\" y=\"160\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Salt solution</text><text x=\"20\" y=\"174\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">(ions free to move)</text><text x=\"232\" y=\"22\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Bulb glows</text><text x=\"346\" y=\"95\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Battery</text><text x=\"124\" y=\"104\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"end\">Electrode</text></svg><figcaption>A solution of an ionic compound conducts electricity because its ions are free to drift towards the electrodes.</figcaption></figure></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">32</span>Four properties</div><div class=\"timeline\"><div class=\"tl-step\"><div class=\"tl-num\">1</div><h5>Physical nature</h5><p>Ionic compounds are <b>solids</b> and are somewhat <b>hard</b>, because of the strong force of attraction between the positive and negative ions. They are generally <b>brittle</b> and break into pieces when pressure is applied.</p></div><div class=\"tl-step\"><div class=\"tl-num\">2</div><h5>Melting and boiling points</h5><p>They have <b>high melting and boiling points</b>, because a considerable amount of energy is needed to break the strong inter-ionic attraction.</p></div><div class=\"tl-step\"><div class=\"tl-num\">3</div><h5>Solubility</h5><p>Generally <b>soluble in water</b> and <b>insoluble in solvents such as kerosene and petrol</b>.</p></div><div class=\"tl-step\"><div class=\"tl-num\">4</div><h5>Conduction of electricity</h5><p>Conduction needs moving charged particles. In <b>water solution</b> the ions move to the opposite electrodes, so the solution conducts. In the <b>solid state</b> the ions are locked in a rigid structure and cannot move, so solids do not conduct. In the <b>molten state</b>, heat overcomes the attraction between ions, they move freely, and the melt conducts.</p></div></div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>State of ionic compound</th><th>Are ions free to move?</th><th>Conducts electricity?</th></tr></thead><tbody><tr><td class=\"n\">Solid</td><td>No, held in a rigid lattice</td><td>❌ No</td></tr><tr><td class=\"n\">Molten (melted)</td><td>Yes</td><td>✅ Yes</td></tr><tr><td class=\"n\">Dissolved in water</td><td>Yes</td><td>✅ Yes</td></tr></tbody></table></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">33</span>How high are the melting points?</div><p>Melting and boiling points of some ionic compounds (in kelvin; subtract 273 for °C):</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Ionic compound</th><th>Melting point (K)</th><th>Boiling point (K)</th></tr></thead><tbody><tr><td class=\"n\">NaCl</td><td>1074</td><td>1686</td></tr><tr><td class=\"n\">LiCl</td><td>887</td><td>1600</td></tr><tr><td class=\"n\">CaCl₂</td><td>1045</td><td>1900</td></tr><tr><td class=\"n\">CaO</td><td>2850</td><td>3120</td></tr><tr><td class=\"n\">MgCl₂</td><td>981</td><td>1685</td></tr></tbody></table></div><div class=\"ledger-heading\">Melting point, kelvin</div><div class=\"bars\"><div class=\"bar-row\"><div class=\"name\">CaO</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:89.1%\"></div></div><div class=\"val\">2,850 K</div></div><div class=\"bar-row\"><div class=\"name\">NaCl</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:33.6%\"></div></div><div class=\"val\">1,074 K</div></div><div class=\"bar-row\"><div class=\"name\">CaCl₂</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:32.7%\"></div></div><div class=\"val\">1,045 K</div></div><div class=\"bar-row\"><div class=\"name\">MgCl₂</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:30.7%\"></div></div><div class=\"val\">981 K</div></div><div class=\"bar-row\"><div class=\"name\">LiCl</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:27.7%\"></div></div><div class=\"val\">887 K</div></div><div class=\"bar-row\"><div class=\"name\">Ice (for scale)</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:8.5%\"></div></div><div class=\"val\">273 K</div></div></div><div class=\"callout extra\"><div class=\"lab\">Why is CaO so high?</div><p>Calcium oxide is built from Ca²⁺ and O²⁻ ions, which carry <b>double</b> charges. The attraction between doubly charged ions is much stronger than between Na⁺ and Cl⁻, so far more energy is needed to pull them apart.</p></div><div class=\"qa-list\"><details class=\"qa\"><summary>(i) Write the electron-dot structures for sodium, oxygen and magnesium. (ii) Show the formation of Na₂O and MgO by the transfer of electrons. (iii) What are the ions present in these compounds?</summary><div class=\"qa-body\"><p>(i) Sodium: Na• (one dot). Magnesium: Mg with two dots. Oxygen: O with six dots.</p><p>(ii) Na₂O: 2Na (2, 8, 1) → 2Na⁺ (2, 8) + 2e⁻; O (2, 6) + 2e⁻ → O²⁻ (2, 8). MgO: Mg (2, 8, 2) → Mg²⁺ (2, 8) + 2e⁻; O (2, 6) + 2e⁻ → O²⁻ (2, 8).</p><p>(iii) Na₂O contains <b>Na⁺</b> and <b>O²⁻</b> ions; MgO contains <b>Mg²⁺</b> and <b>O²⁻</b> ions.</p></div></details><details class=\"qa\"><summary>Why do ionic compounds have high melting points?</summary><div class=\"qa-body\"><p>The ions are held together by strong electrostatic forces of attraction. A large amount of energy is required to overcome these forces and separate the ions, so the melting points are high.</p></div></details></div></div>"}, "extraction": {"icon": "⛏️", "label": "Occurrence & Extraction", "sub": "Ores, roasting, calcination, reduction", "kicker": "Occurrence of metals", "html": "<p class=\"lede\">Metals do not come out of the ground ready to use. Most are locked inside rocks as compounds. Getting them out, cheaply and in pure form, is the science of metallurgy, and the reactivity series tells us exactly which method to use.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">34</span>Minerals, ores and gangue</div><p>The <b>earth's crust</b> is the major source of metals. Sea water also contains soluble salts such as sodium chloride and magnesium chloride.</p><div class=\"term-card\"><div class=\"lab\">Minerals</div><p>The elements or compounds which occur naturally in the earth's crust are known as minerals.</p></div><div class=\"term-card\"><div class=\"lab\">Ores</div><p>Minerals that contain a very high percentage of a particular metal, from which the metal can be profitably extracted, are called ores.</p></div><div class=\"term-card\"><div class=\"lab\">Gangue</div><p>Ores mined from the earth are usually contaminated with large amounts of impurities such as soil and sand. These impurities are called gangue.</p></div><div class=\"callout extra\"><div class=\"lab\">All ores are minerals, but…</div><p>not all minerals are ores. Clay contains aluminium, but extracting aluminium from it is too costly, so clay is a mineral but not an ore of aluminium. Bauxite is the ore.</p></div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Metal</th><th>Common ore</th><th>Formula</th><th>Type</th></tr></thead><tbody><tr><td class=\"n\">Aluminium</td><td>Bauxite</td><td>Al₂O₃·2H₂O</td><td>Oxide</td></tr><tr><td class=\"n\">Iron</td><td>Haematite</td><td>Fe₂O₃</td><td>Oxide</td></tr><tr><td class=\"n\">Zinc</td><td>Zinc blende</td><td>ZnS</td><td>Sulphide</td></tr><tr><td class=\"n\">Zinc</td><td>Calamine</td><td>ZnCO₃</td><td>Carbonate</td></tr><tr><td class=\"n\">Mercury</td><td>Cinnabar</td><td>HgS</td><td>Sulphide</td></tr><tr><td class=\"n\">Copper</td><td>Copper glance</td><td>Cu₂S</td><td>Sulphide</td></tr><tr><td class=\"n\">Lead</td><td>Galena</td><td>PbS</td><td>Sulphide</td></tr><tr><td class=\"n\">Sodium</td><td>Rock salt</td><td>NaCl</td><td>Chloride</td></tr></tbody></table></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">35</span>Where each metal is found</div><p>The <b>least reactive</b> metals at the bottom of the series are often found <b>free</b> (in the native state): gold, silver, platinum and copper. Copper and silver also occur combined as sulphide or oxide ores. The <b>most reactive</b> metals at the top (K, Na, Ca, Mg, Al) are never found free. The metals in the <b>middle</b> (Zn, Fe, Pb) are found mainly as oxides, sulphides or carbonates.</p><p>Many ores are <b>oxides</b>, because oxygen is very reactive and very abundant on earth.</p><div class=\"metallurgy\"><div class=\"mband hi\"><div class=\"mm\">K · Na · Ca · Mg · Al</div><div class=\"mt\"><b>High reactivity</b><span>Electrolysis of molten compounds</span></div></div><div class=\"mband mid\"><div class=\"mm\">Zn · Fe · Pb · Cu</div><div class=\"mt\"><b>Medium reactivity</b><span>Reduction using carbon</span></div></div><div class=\"mband lo\"><div class=\"mm\">Cu · Hg · Ag · Au</div><div class=\"mt\"><b>Low reactivity</b><span>Found native, or obtained by heating alone</span></div></div></div><figure class=\"fig\"><svg viewBox=\"0 0 640 380\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><rect x=\"260.0\" y=\"6\" width=\"120\" height=\"31\" rx=\"10\" fill=\"#181c2a\" stroke=\"#181c2a\" stroke-width=\"1.4\"/><text x=\"320\" y=\"26\" font-size=\"11.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Ore</text><line x1=\"320\" y1=\"37\" x2=\"320\" y2=\"52\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M316 51 L320 58 L324 51 Z\" fill=\"#8c92a8\"/><rect x=\"170.0\" y=\"58\" width=\"300\" height=\"46\" rx=\"10\" fill=\"#ece9fb\" stroke=\"#d9d3f7\" stroke-width=\"1.4\"/><text x=\"320\" y=\"78\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Concentration of ore</text><text x=\"320\" y=\"93\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">(removing the gangue)</text><line x1=\"320\" y1=\"104\" x2=\"320\" y2=\"116\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"110\" y1=\"116\" x2=\"530\" y2=\"116\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"110\" y1=\"116\" x2=\"110\" y2=\"128\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M106 127 L110 134 L114 127 Z\" fill=\"#8c92a8\"/><line x1=\"320\" y1=\"116\" x2=\"320\" y2=\"128\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M316 127 L320 134 L324 127 Z\" fill=\"#8c92a8\"/><line x1=\"530\" y1=\"116\" x2=\"530\" y2=\"128\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M526 127 L530 134 L534 127 Z\" fill=\"#8c92a8\"/><rect x=\"20.0\" y=\"134\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#fde8e8\" stroke=\"#f5c2c2\" stroke-width=\"1.4\"/><text x=\"110\" y=\"154\" font-size=\"11.5\" font-weight=\"700\" fill=\"#b42318\" text-anchor=\"middle\">Highly reactive metals</text><rect x=\"230.0\" y=\"134\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#fff4d6\" stroke=\"#f0dca0\" stroke-width=\"1.4\"/><text x=\"320\" y=\"154\" font-size=\"11.5\" font-weight=\"700\" fill=\"#8a5a00\" text-anchor=\"middle\">Medium reactivity</text><rect x=\"440.0\" y=\"134\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#e1f3ec\" stroke=\"#c7e6da\" stroke-width=\"1.4\"/><text x=\"530\" y=\"154\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1d7f63\" text-anchor=\"middle\">Low reactivity</text><line x1=\"110\" y1=\"165\" x2=\"110\" y2=\"194\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M106 193 L110 200 L114 193 Z\" fill=\"#8c92a8\"/><rect x=\"20.0\" y=\"200\" width=\"180\" height=\"46\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"110\" y=\"220\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Electrolysis of</text><text x=\"110\" y=\"235\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">molten ore</text><line x1=\"110\" y1=\"246\" x2=\"110\" y2=\"338\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M106 337 L110 344 L114 337 Z\" fill=\"#8c92a8\"/><line x1=\"320\" y1=\"165\" x2=\"320\" y2=\"176\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"265\" y1=\"176\" x2=\"375\" y2=\"176\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><line x1=\"265\" y1=\"176\" x2=\"265\" y2=\"184\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M261 183 L265 190 L269 183 Z\" fill=\"#8c92a8\"/><line x1=\"375\" y1=\"176\" x2=\"375\" y2=\"184\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M371 183 L375 190 L379 183 Z\" fill=\"#8c92a8\"/><rect x=\"213.0\" y=\"190\" width=\"104\" height=\"46\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"265\" y=\"210\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Carbonate ore</text><text x=\"265\" y=\"225\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Calcination</text><rect x=\"323.0\" y=\"190\" width=\"104\" height=\"46\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"375\" y=\"210\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Sulphide ore</text><text x=\"375\" y=\"225\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Roasting</text><line x1=\"265\" y1=\"236\" x2=\"265\" y2=\"248\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M261 247 L265 254 L269 247 Z\" fill=\"#8c92a8\"/><line x1=\"375\" y1=\"236\" x2=\"375\" y2=\"248\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M371 247 L375 254 L379 247 Z\" fill=\"#8c92a8\"/><line x1=\"265\" y1=\"254\" x2=\"375\" y2=\"254\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><rect x=\"230.0\" y=\"254\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"320\" y=\"274\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Metal oxide</text><line x1=\"320\" y1=\"285\" x2=\"320\" y2=\"294\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M316 293 L320 300 L324 293 Z\" fill=\"#8c92a8\"/><rect x=\"230.0\" y=\"300\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"320\" y=\"320\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Reduction to metal</text><line x1=\"320\" y1=\"331\" x2=\"320\" y2=\"338\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M316 337 L320 344 L324 337 Z\" fill=\"#8c92a8\"/><line x1=\"530\" y1=\"165\" x2=\"530\" y2=\"194\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M526 193 L530 200 L534 193 Z\" fill=\"#8c92a8\"/><rect x=\"440.0\" y=\"200\" width=\"180\" height=\"46\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"530\" y=\"220\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Sulphide ore</text><text x=\"530\" y=\"235\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">roasted in air</text><line x1=\"530\" y1=\"246\" x2=\"530\" y2=\"294\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M526 293 L530 300 L534 293 Z\" fill=\"#8c92a8\"/><rect x=\"440.0\" y=\"300\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#fff\" stroke=\"#c9cde0\" stroke-width=\"1.4\"/><text x=\"530\" y=\"320\" font-size=\"11.5\" font-weight=\"600\" fill=\"#181c2a\" text-anchor=\"middle\">Metal</text><line x1=\"530\" y1=\"331\" x2=\"530\" y2=\"338\" stroke=\"#8c92a8\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M526 337 L530 344 L534 337 Z\" fill=\"#8c92a8\"/><rect x=\"20.0\" y=\"344\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#181c2a\" stroke=\"#181c2a\" stroke-width=\"1.4\"/><text x=\"110\" y=\"364\" font-size=\"11.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Pure metal</text><rect x=\"230.0\" y=\"344\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#6c5ce0\" stroke=\"#6c5ce0\" stroke-width=\"1.4\"/><text x=\"320\" y=\"364\" font-size=\"11.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Purification (refining)</text><rect x=\"440.0\" y=\"344\" width=\"180\" height=\"31\" rx=\"10\" fill=\"#6c5ce0\" stroke=\"#6c5ce0\" stroke-width=\"1.4\"/><text x=\"530\" y=\"364\" font-size=\"11.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Purification (refining)</text></svg><figcaption>From rock to pure metal: every ore is first cleaned of gangue, then the route depends on how reactive the metal is.</figcaption></figure></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">36</span>Step 1: enrichment of ores</div><p>The gangue must be removed before extraction. The methods used depend on <b>differences between the physical or chemical properties</b> of the gangue and the ore.</p><div class=\"sign-grid\"><div class=\"sign\"><div class=\"ic\">🌊</div><h5>Washing (gravity separation)</h5><p>Running water carries away light sand and soil; heavy ore particles settle.</p></div><div class=\"sign\"><div class=\"ic\">🧲</div><h5>Magnetic separation</h5><p>A magnet pulls out magnetic ore (or magnetic impurities) from the rest.</p></div><div class=\"sign\"><div class=\"ic\">🫧</div><h5>Froth flotation</h5><p>Sulphide ore particles stick to oil froth and float; gangue sinks in water.</p></div><div class=\"sign\"><div class=\"ic\">🧪</div><h5>Leaching</h5><p>A chemical dissolves the ore but not the gangue (used for bauxite and gold).</p></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">37</span>Low in the series: heat alone</div><p>Metals low in the activity series are very unreactive, so their oxides can be reduced to metal <b>by heating alone</b>.</p><p><b>Mercury</b> from cinnabar (HgS): heating in air first converts it to mercuric oxide, which on further heating is reduced to mercury.</p><div class=\"eq\"><div class=\"eq-main\">2HgS<span class=\"st\">(s)</span> + 3O<sub>2</sub><span class=\"st\">(g)</span> <span class=\"arr\"><i>Heat</i><b>⟶</b></span> 2HgO<span class=\"st\">(s)</span> + 2SO<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">2HgO<span class=\"st\">(s)</span> <span class=\"arr\"><i>Heat</i><b>⟶</b></span> 2Hg<span class=\"st\">(l)</span> + O<sub>2</sub><span class=\"st\">(g)</span></div></div><p><b>Copper</b>, found as Cu<sub>2</sub>S, is obtained by just heating in air. Part of the sulphide becomes oxide, which then reacts with the rest of the sulphide.</p><div class=\"eq\"><div class=\"eq-main\">2Cu<sub>2</sub>S<span class=\"st\">(s)</span> + 3O<sub>2</sub><span class=\"st\">(g)</span> <span class=\"arr\"><i>Heat</i><b>⟶</b></span> 2Cu<sub>2</sub>O<span class=\"st\">(s)</span> + 2SO<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">2Cu<sub>2</sub>O<span class=\"st\">(s)</span> + Cu<sub>2</sub>S<span class=\"st\">(s)</span> <span class=\"arr\"><i>Heat</i><b>⟶</b></span> 6Cu<span class=\"st\">(s)</span> + SO<sub>2</sub><span class=\"st\">(g)</span></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">38</span>Middle of the series: roast or calcine, then reduce</div><p>Zinc, iron, lead and copper are moderately reactive and usually occur as <b>sulphides or carbonates</b>. It is easier to obtain a metal from its <b>oxide</b>, so these ores are first converted to oxides.</p><div class=\"tug\"><div class=\"tug-side push-side\"><h4>Roasting</h4><div class=\"cap\">for sulphide ores</div><p>Heat strongly in <b>excess air</b></p><p>2ZnS + 3O<sub>2</sub> → 2ZnO + 2SO<sub>2</sub></p><p>Sulphur leaves as SO₂ gas</p></div><div class=\"tug-badge\">🔥</div><div class=\"tug-side pull-side\"><h4>Calcination</h4><div class=\"cap\">for carbonate ores</div><p>Heat strongly in <b>limited air</b></p><p>ZnCO<sub>3</sub> → ZnO + CO<sub>2</sub></p><p>Carbon dioxide is driven off</p></div></div><div class=\"eq\"><div class=\"eq-main\">2ZnS<span class=\"st\">(s)</span> + 3O<sub>2</sub><span class=\"st\">(g)</span> <span class=\"arr\"><i>Heat</i><b>⟶</b></span> 2ZnO<span class=\"st\">(s)</span> + 2SO<sub>2</sub><span class=\"st\">(g)</span></div><div class=\"eq-note\">Roasting</div></div><div class=\"eq\"><div class=\"eq-main\">ZnCO<sub>3</sub><span class=\"st\">(s)</span> <span class=\"arr\"><i>Heat</i><b>⟶</b></span> ZnO<span class=\"st\">(s)</span> + CO<sub>2</sub><span class=\"st\">(g)</span></div><div class=\"eq-note\">Calcination</div></div><p>The metal oxide is then <b>reduced</b> with a suitable reducing agent such as carbon (coke):</p><div class=\"eq\"><div class=\"eq-main\">ZnO<span class=\"st\">(s)</span> + C<span class=\"st\">(s)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Zn<span class=\"st\">(s)</span> + CO<span class=\"st\">(g)</span></div><div class=\"eq-note\">Zinc oxide is reduced; carbon is oxidised.</div></div><p>Obtaining metals from their compounds is always a <b>reduction</b> process.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">39</span>Displacement as a reducing method: the thermit reaction</div><p>Highly reactive metals such as sodium, calcium and aluminium can also be used as reducing agents, because they displace less reactive metals from their compounds.</p><div class=\"eq\"><div class=\"eq-main\">3MnO<sub>2</sub><span class=\"st\">(s)</span> + 4Al<span class=\"st\">(s)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 3Mn<span class=\"st\">(l)</span> + 2Al<sub>2</sub>O<sub>3</sub><span class=\"st\">(s)</span> + Heat</div><div class=\"eq-note\">Aluminium is oxidised to Al₂O₃; manganese dioxide is reduced to manganese.</div></div><p>These reactions are so exothermic that the metal is produced in the <b>molten</b> state. The reaction of iron(III) oxide with aluminium is used to join railway tracks and repair cracked machine parts. It is called the <b>thermit reaction</b>.</p><div class=\"eq\"><div class=\"eq-main\">Fe<sub>2</sub>O<sub>3</sub><span class=\"st\">(s)</span> + 2Al<span class=\"st\">(s)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2Fe<span class=\"st\">(l)</span> + Al<sub>2</sub>O<sub>3</sub><span class=\"st\">(s)</span> + Heat</div></div><figure class=\"fig\"><svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><path d=\"M150 20 L250 20 L232 92 L168 92 Z\" fill=\"#e5e7eb\" stroke=\"#5b6178\" stroke-width=\"2\"/><path d=\"M156 34 L244 34 L232 82 L168 82 Z\" fill=\"#7c5a43\"/><text x=\"200\" y=\"62\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Fe₂O₃ + Al</text><path d=\"M196 92 C192 120 206 130 200 160\" stroke=\"#f97316\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 92 C192 120 206 130 200 160\" stroke=\"#fde047\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"120\" x2=\"170\" y2=\"110\" stroke=\"#f59e0b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"120\" x2=\"228\" y2=\"106\" stroke=\"#f59e0b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"120\" x2=\"178\" y2=\"136\" stroke=\"#f59e0b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"120\" x2=\"230\" y2=\"132\" stroke=\"#f59e0b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"120\" x2=\"166\" y2=\"122\" stroke=\"#f59e0b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"120\" x2=\"236\" y2=\"120\" stroke=\"#f59e0b\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"160\" width=\"150\" height=\"20\" fill=\"#9ca3af\"/><rect x=\"70\" y=\"180\" width=\"90\" height=\"12\" fill=\"#9ca3af\"/><rect x=\"40\" y=\"192\" width=\"150\" height=\"14\" fill=\"#9ca3af\"/><rect x=\"210\" y=\"160\" width=\"150\" height=\"20\" fill=\"#9ca3af\"/><rect x=\"240\" y=\"180\" width=\"90\" height=\"12\" fill=\"#9ca3af\"/><rect x=\"210\" y=\"192\" width=\"150\" height=\"14\" fill=\"#9ca3af\"/><rect x=\"188\" y=\"158\" width=\"24\" height=\"50\" rx=\"3\" fill=\"#f97316\"/><rect x=\"194\" y=\"164\" width=\"12\" height=\"38\" rx=\"2\" fill=\"#fde047\"/><rect x=\"30\" y=\"206\" width=\"340\" height=\"9\" rx=\"4\" fill=\"#d8cbb3\"/><text x=\"262\" y=\"40\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Crucible with iron(III) oxide</text><text x=\"262\" y=\"54\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">and aluminium powder</text><text x=\"250\" y=\"130\" font-size=\"11.5\" font-weight=\"600\" fill=\"#c2410c\" text-anchor=\"start\">Molten iron pours out</text><text x=\"115\" y=\"150\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Rail</text><text x=\"285\" y=\"150\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Rail</text><text x=\"200\" y=\"226\" font-size=\"11.5\" font-weight=\"600\" fill=\"#c2410c\" text-anchor=\"middle\">Gap welded by molten iron</text></svg><figcaption>The thermit reaction gives out so much heat that the iron formed is molten. It flows into the gap and welds the two rails together.</figcaption></figure></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">40</span>Top of the series: electrolysis</div><p>Metals high in the series cannot be obtained by heating their oxides with carbon, because these metals have <b>more affinity for oxygen than carbon</b> does. They are obtained by <b>electrolytic reduction</b>. Sodium, magnesium and calcium are produced by electrolysis of their <b>molten chlorides</b>.</p><div class=\"place-pair\"><div class=\"place-box origin\"><div class=\"lab\">At cathode (−)</div><div class=\"val\">Na⁺ + e⁻ → Na</div></div><div class=\"place-arrow\">⚡</div><div class=\"place-box dest\"><div class=\"lab\">At anode (+)</div><div class=\"val\">2Cl⁻ → Cl₂ + 2e⁻</div></div></div><p>The metal is deposited at the <b>cathode</b> (negatively charged electrode) and chlorine is liberated at the <b>anode</b> (positively charged electrode). Similarly, <b>aluminium</b> is obtained by the electrolytic reduction of aluminium oxide.</p><div class=\"callout extra\"><div class=\"lab\">Why molten and not dissolved?</div><p>If a solution of sodium chloride in water were electrolysed, the water would react, and hydrogen rather than sodium would be released at the cathode. Melting the salt frees the ions without any water present.</p></div></div>"}, "refining": {"icon": "✨", "label": "Refining of Metals", "sub": "Electrolytic refining and anode mud", "kicker": "Refining of metals", "html": "<p class=\"lede\">The metal produced by reduction is not very pure. Its impurities must be removed before it can be used, for example, in electrical wiring, where even tiny impurities reduce conductivity.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">41</span>Electrolytic refining</div><p>The most widely used method is <b>electrolytic refining</b>. Copper, zinc, tin, nickel, silver, gold and many other metals are refined this way.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Part of the cell</th><th>What is used</th></tr></thead><tbody><tr><td class=\"n\">Anode (+)</td><td>The impure metal (a thick block)</td></tr><tr><td class=\"n\">Cathode (−)</td><td>A thin strip of the pure metal</td></tr><tr><td class=\"n\">Electrolyte</td><td>A solution of a salt of the same metal (for copper: acidified copper sulphate)</td></tr></tbody></table></div><figure class=\"fig\"><svg viewBox=\"0 0 430 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><path d=\"M80 80 L80 214 Q80 222 88 222 L332 222 Q340 222 340 214 L340 80\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><path d=\"M82 100 L82 214 Q82 220 88 220 L332 220 Q338 220 338 214 L338 100 Z\" fill=\"#bfdbfe\"/><rect x=\"124\" y=\"56\" width=\"30\" height=\"140\" rx=\"3\" fill=\"#8a5a3c\"/><circle cx=\"124\" cy=\"207\" r=\"4.5\" fill=\"#4b5563\"/><circle cx=\"130\" cy=\"210\" r=\"4.5\" fill=\"#4b5563\"/><circle cx=\"136\" cy=\"207\" r=\"4.5\" fill=\"#4b5563\"/><circle cx=\"142\" cy=\"210\" r=\"4.5\" fill=\"#4b5563\"/><circle cx=\"148\" cy=\"207\" r=\"4.5\" fill=\"#4b5563\"/><circle cx=\"154\" cy=\"210\" r=\"4.5\" fill=\"#4b5563\"/><rect x=\"268\" y=\"56\" width=\"8\" height=\"140\" rx=\"2\" fill=\"#d97736\"/><path d=\"M139 56 L139 24 L196 24 M224 24 L272 24 L272 56\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><rect x=\"196\" y=\"12\" width=\"28\" height=\"24\" rx=\"3\" fill=\"#1f2937\"/><text x=\"204\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">+</text><text x=\"218\" y=\"28\" font-size=\"11\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">−</text><text x=\"176\" y=\"128\" font-size=\"11\" font-weight=\"700\" fill=\"#1d4ed8\" text-anchor=\"middle\">Cu²⁺</text><line x1=\"186\" y1=\"124\" x2=\"198\" y2=\"124\" stroke=\"#1d4ed8\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><text x=\"206\" y=\"150\" font-size=\"11\" font-weight=\"700\" fill=\"#1d4ed8\" text-anchor=\"middle\">Cu²⁺</text><line x1=\"216\" y1=\"146\" x2=\"228\" y2=\"146\" stroke=\"#1d4ed8\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><text x=\"236\" y=\"128\" font-size=\"11\" font-weight=\"700\" fill=\"#1d4ed8\" text-anchor=\"middle\">Cu²⁺</text><line x1=\"246\" y1=\"124\" x2=\"258\" y2=\"124\" stroke=\"#1d4ed8\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><text x=\"20\" y=\"52\" font-size=\"11.5\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"start\">Anode (+)</text><text x=\"20\" y=\"66\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">impure copper</text><line x1=\"84\" y1=\"60\" x2=\"122\" y2=\"72\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"352\" y=\"52\" font-size=\"11.5\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"start\">Cathode (−)</text><text x=\"352\" y=\"66\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">pure copper</text><line x1=\"350\" y1=\"62\" x2=\"278\" y2=\"72\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"210\" y=\"244\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Acidified copper sulphate solution</text><text x=\"20\" y=\"200\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Anode mud</text><line x1=\"78\" y1=\"200\" x2=\"120\" y2=\"206\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"210\" y=\"50\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Battery</text></svg><figcaption>Electrolytic refining of copper: copper dissolves from the impure anode, travels as Cu²⁺ ions and deposits as pure copper on the cathode. Insoluble impurities fall as anode mud.</figcaption></figure><div class=\"timeline\"><div class=\"tl-step\"><div class=\"tl-num\">1</div><h5>Current is switched on</h5><p>Metal atoms at the anode lose electrons and dissolve into the electrolyte as ions: Cu → Cu²⁺ + 2e⁻.</p></div><div class=\"tl-step\"><div class=\"tl-num\">2</div><h5>Ions travel</h5><p>An equivalent amount of metal ions from the electrolyte moves to the cathode.</p></div><div class=\"tl-step\"><div class=\"tl-num\">3</div><h5>Pure metal deposits</h5><p>At the cathode the ions gain electrons and deposit as pure metal: Cu²⁺ + 2e⁻ → Cu. The cathode grows thicker.</p></div><div class=\"tl-step\"><div class=\"tl-num\">4</div><h5>Impurities separate</h5><p><b>Soluble impurities</b> go into the solution. <b>Insoluble impurities</b> settle at the bottom under the anode as <b>anode mud</b> (often containing valuable silver and gold).</p></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">42</span>Check your understanding</div><div class=\"qa-list\"><details class=\"qa\"><summary>Define (i) mineral (ii) ore (iii) gangue.</summary><div class=\"qa-body\"><p>(i) <b>Mineral</b>: an element or compound that occurs naturally in the earth's crust.</p><p>(ii) <b>Ore</b>: a mineral from which a metal can be extracted profitably.</p><p>(iii) <b>Gangue</b>: the unwanted impurities such as soil and sand present in an ore.</p></div></details><details class=\"qa\"><summary>Name two metals which are found in nature in the free state.</summary><div class=\"qa-body\"><p><b>Gold</b> and <b>silver</b> (also platinum and copper).</p></div></details><details class=\"qa\"><summary>What chemical process is used for obtaining a metal from its oxide?</summary><div class=\"qa-body\"><p><b>Reduction</b>: for example, heating the oxide with carbon (ZnO + C → Zn + CO), using a more reactive metal (thermit reaction), or electrolytic reduction for highly reactive metals.</p></div></details></div></div>"}, "corrosion": {"icon": "🛡️", "label": "Corrosion & Alloys", "sub": "Rusting, prevention, alloys", "kicker": "Corrosion", "html": "<p class=\"lede\">Metals slowly give back what extraction took away: they combine again with oxygen, water and other substances from the air. Understanding the conditions lets us stop it.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">43</span>Three metals, three kinds of damage</div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Metal</th><th>What happens</th><th>Why</th></tr></thead><tbody><tr><td class=\"n\">Silver</td><td>Turns black after some time</td><td>Reacts with sulphur in the air to form a coating of silver sulphide</td></tr><tr><td class=\"n\">Copper</td><td>Loses its shiny brown surface and gets a green coat</td><td>Reacts with moist carbon dioxide in the air to form basic copper carbonate</td></tr><tr><td class=\"n\">Iron</td><td>Gets a brown, flaky coating called rust</td><td>Exposed to moist air for a long time</td></tr></tbody></table></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">44</span>What does iron need to rust?</div><div class=\"act\"><div class=\"lab\">Activity · Three test tubes, three conditions</div><ol><li>Place clean iron nails in each of three test tubes, labelled A, B and C.</li><li>In A, pour some water and cork it.</li><li>In B, pour boiled distilled water, add about 1 mL of oil, and cork it. The oil floats and stops air from dissolving in the water.</li><li>In C, put some anhydrous calcium chloride and cork it. It absorbs any moisture from the air.</li><li>Leave the tubes for a few days and observe.</li></ol><div class=\"obs\"><b>What you see:</b> The nails <b>rust in A</b>, where both air and water are present, but <b>not in B</b> (water but no air) or <b>C</b> (dry air).</div></div><figure class=\"fig\"><svg viewBox=\"0 0 420 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><path d=\"M40 130 L40 182.0 A22.0 22.0 0 0 0 84 182.0 L84 130 Z\" fill=\"#dbeafe\"/><path d=\"M40 44 L40 182.0 A22.0 22.0 0 0 0 84 182.0 L84 44\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"37\" y1=\"44\" x2=\"87\" y2=\"44\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"37\" y=\"30\" width=\"50\" height=\"16\" rx=\"3\" fill=\"#c08a52\"/><rect x=\"50\" y=\"60\" width=\"18\" height=\"5\" rx=\"2\" fill=\"#6b7280\"/><path d=\"M59 65 L65 65 L65 180 L62.0 188 L59 180 Z\" fill=\"#9ca3af\" stroke=\"#6b7280\" stroke-width=\".8\"/><circle cx=\"63.0\" cy=\"78.0\" r=\"2.7\" fill=\"#b45309\"/><circle cx=\"62.6\" cy=\"92.3\" r=\"2.9\" fill=\"#b45309\"/><circle cx=\"59.8\" cy=\"106.6\" r=\"3.3\" fill=\"#b45309\"/><circle cx=\"63.4\" cy=\"120.9\" r=\"3.2\" fill=\"#b45309\"/><circle cx=\"63.5\" cy=\"135.1\" r=\"2.5\" fill=\"#b45309\"/><circle cx=\"61.5\" cy=\"149.4\" r=\"2.1\" fill=\"#b45309\"/><circle cx=\"62.7\" cy=\"163.7\" r=\"2.1\" fill=\"#b45309\"/><path d=\"M188 80 L188 182.0 A22.0 22.0 0 0 0 232 182.0 L232 80 Z\" fill=\"#dbeafe\"/><path d=\"M188 44 L188 182.0 A22.0 22.0 0 0 0 232 182.0 L232 44\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"185\" y1=\"44\" x2=\"235\" y2=\"44\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"190\" y=\"70\" width=\"40\" height=\"11\" fill=\"#fcd34d\" opacity=\".85\"/><rect x=\"185\" y=\"30\" width=\"50\" height=\"16\" rx=\"3\" fill=\"#c08a52\"/><rect x=\"198\" y=\"60\" width=\"18\" height=\"5\" rx=\"2\" fill=\"#6b7280\"/><path d=\"M207 65 L213 65 L213 180 L210.0 188 L207 180 Z\" fill=\"#9ca3af\" stroke=\"#6b7280\" stroke-width=\".8\"/><path d=\"M336 44 L336 182.0 A22.0 22.0 0 0 0 380 182.0 L380 44\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"333\" y1=\"44\" x2=\"383\" y2=\"44\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"333\" y=\"30\" width=\"50\" height=\"16\" rx=\"3\" fill=\"#c08a52\"/><rect x=\"346\" y=\"60\" width=\"18\" height=\"5\" rx=\"2\" fill=\"#6b7280\"/><path d=\"M355 65 L361 65 L361 156 L358.0 164 L355 156 Z\" fill=\"#9ca3af\" stroke=\"#6b7280\" stroke-width=\".8\"/><circle cx=\"344.2\" cy=\"173.4\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"347.2\" cy=\"176.8\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"343.7\" cy=\"168.0\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"346.8\" cy=\"170.6\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"353.6\" cy=\"168.7\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"370.0\" cy=\"184.0\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"346.8\" cy=\"174.6\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"353.1\" cy=\"177.5\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"345.9\" cy=\"190.1\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"373.8\" cy=\"180.1\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"357.5\" cy=\"170.2\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"345.3\" cy=\"176.9\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"350.5\" cy=\"189.6\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"347.2\" cy=\"168.6\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"372.4\" cy=\"181.7\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><circle cx=\"346.7\" cy=\"182.1\" r=\"3.4\" fill=\"#fff\" stroke=\"#9ca3af\"/><text x=\"62\" y=\"226\" font-size=\"14\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">A</text><text x=\"62\" y=\"244\" font-size=\"11.5\" font-weight=\"600\" fill=\"#b45309\" text-anchor=\"middle\">air + water: rusts</text><text x=\"210\" y=\"226\" font-size=\"14\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">B</text><text x=\"210\" y=\"244\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1d7f63\" text-anchor=\"middle\">water, no air: no rust</text><text x=\"358\" y=\"226\" font-size=\"14\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">C</text><text x=\"358\" y=\"244\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1d7f63\" text-anchor=\"middle\">dry air: no rust</text><line x1=\"232\" y1=\"76\" x2=\"258\" y2=\"64\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"260\" y=\"62\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">oil layer</text><text x=\"306\" y=\"150\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"end\">drying</text><text x=\"306\" y=\"164\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"end\">agent</text></svg><figcaption>Only the nail that meets both air and water rusts. Remove either one and rusting stops.</figcaption></figure><div class=\"term-card\"><div class=\"lab\">Conclusion</div><p>Iron rusts only when both air (oxygen) and water (moisture) are present.</p></div><p>Rust is mainly <b>hydrated iron(III) oxide</b>, Fe<sub>2</sub>O<sub>3</sub>·xH<sub>2</sub>O. It is flaky and falls off, exposing fresh iron underneath, which is why rusting keeps going until the iron is eaten through. Salt water (near the sea) speeds rusting up.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">45</span>Preventing corrosion</div><p>The rusting of iron can be prevented by <b>painting, oiling, greasing, galvanising, chrome plating, anodising</b> or <b>making alloys</b>.</p><div class=\"ledger\"><div class=\"ledger-heading pos\">Ways to protect iron</div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Painting</b> — cuts off air and moisture; used for gates, bridges and car bodies.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Oiling and greasing</b> — a water-repelling film for tools and moving machine parts.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Galvanising</b> — coating steel or iron with a thin layer of zinc.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Chrome plating</b> — a shiny chromium layer on taps and bicycle handles.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Anodising</b> — a thick oxide layer, used for aluminium articles.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Alloying</b> — mixing iron with other elements, as in stainless steel.</p></div></div><figure class=\"fig\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><rect x=\"40\" y=\"70\" width=\"320\" height=\"40\" fill=\"#9ca3af\"/><path d=\"M40 56 L190 56 L196 70 L204 70 L210 56 L360 56 L360 70 L210 70 L204 70 L196 70 L40 70 Z\" fill=\"#cbd5e1\" stroke=\"#94a3b8\"/><rect x=\"40\" y=\"56\" width=\"150\" height=\"14\" fill=\"#cbd5e1\"/><rect x=\"210\" y=\"56\" width=\"150\" height=\"14\" fill=\"#cbd5e1\"/><text x=\"200\" y=\"96\" font-size=\"13\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Iron / steel</text><text x=\"110\" y=\"48\" font-size=\"11.5\" font-weight=\"700\" fill=\"#475569\" text-anchor=\"middle\">Zinc coating</text><text x=\"200\" y=\"40\" font-size=\"11\" font-weight=\"600\" fill=\"#b42318\" text-anchor=\"middle\">scratch</text><line x1=\"200\" y1=\"44\" x2=\"200\" y2=\"60\" stroke=\"#b42318\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><text x=\"200\" y=\"134\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1d7f63\" text-anchor=\"middle\">Zinc is more reactive, so it is attacked first and the iron underneath stays safe</text></svg><figcaption>Galvanised iron stays protected even if the zinc layer is scratched, because zinc corrodes in preference to iron.</figcaption></figure><div class=\"callout extra\"><div class=\"lab\">Why does galvanising still work when scratched?</div><p>Zinc is <b>more reactive</b> than iron. When the coating is broken, oxygen and water attack the zinc in preference to the iron, so the zinc corrodes and the iron stays protected.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">46</span>Alloys: better metals by mixing</div><p>Iron is the most widely used metal, but it is <b>never used in its pure state</b>: pure iron is very soft and stretches easily when hot. Mixed with a small amount of <b>carbon (about 0.05 %)</b>, it becomes hard and strong. Mixed with <b>nickel and chromium</b>, it becomes <b>stainless steel</b>, which is hard and does not rust.</p><div class=\"term-card\"><div class=\"lab\">Alloy</div><p>An alloy is a homogeneous mixture of two or more metals, or a metal and a non-metal. It is prepared by first melting the primary metal, then dissolving the other elements in it in definite proportions, and cooling to room temperature.</p></div><div class=\"term-card\"><div class=\"lab\">Amalgam</div><p>If one of the metals in an alloy is mercury, the alloy is known as an amalgam.</p></div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Alloy</th><th>Made of</th><th>Special property</th><th>Uses</th></tr></thead><tbody><tr><td class=\"n\">Steel</td><td>Iron + carbon</td><td>Hard and strong</td><td>Buildings, bridges, rails, ships</td></tr><tr><td class=\"n\">Stainless steel</td><td>Iron + nickel + chromium</td><td>Hard, does not rust</td><td>Utensils, surgical tools, sinks</td></tr><tr><td class=\"n\">Brass</td><td>Copper + zinc</td><td>Harder than copper, golden colour</td><td>Taps, door fittings, musical instruments</td></tr><tr><td class=\"n\">Bronze</td><td>Copper + tin</td><td>Hard, resists corrosion</td><td>Statues, medals, bells</td></tr><tr><td class=\"n\">Solder</td><td>Lead + tin</td><td>Low melting point</td><td>Joining electrical wires</td></tr><tr><td class=\"n\">Amalgam</td><td>Mercury + another metal</td><td>Soft, then sets hard</td><td>Dental fillings (older practice)</td></tr></tbody></table></div><p>The <b>electrical conductivity and melting point of an alloy are lower</b> than those of the pure metals. Brass and bronze are not good conductors, whereas pure copper is used for electrical circuits. Solder has a low melting point, which is exactly why it is used for joining wires.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">47</span>How pure is your gold?</div><p>Pure gold, known as <b>24 carat</b> gold, is very soft and not suitable for jewellery. It is alloyed with <b>silver or copper</b> to make it hard. In India, <b>22 carat</b> gold is generally used for ornaments: 22 parts of pure gold alloyed with 2 parts of copper or silver.</p><div id=\"carat\"></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">48</span>The wonder of ancient Indian metallurgy</div><div class=\"pillar\"><div class=\"pillar-art\"><svg viewBox=\"0 0 90 220\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"34\" y=\"40\" width=\"22\" height=\"168\" rx=\"3\" fill=\"#8b7355\"/><rect x=\"28\" y=\"22\" width=\"34\" height=\"20\" rx=\"4\" fill=\"#7a6248\"/><rect x=\"31\" y=\"8\" width=\"28\" height=\"16\" rx=\"6\" fill=\"#6b5640\"/><rect x=\"18\" y=\"206\" width=\"54\" height=\"10\" rx=\"3\" fill=\"#a08c72\"/><rect x=\"38\" y=\"60\" width=\"4\" height=\"130\" fill=\"#a38a6b\" opacity=\".6\"/></svg></div><div><p>The <b>iron pillar near the Qutub Minar in Delhi</b> was built more than <b>1600 years ago</b> by the iron workers of India. They developed a process which prevented iron from rusting, and scientists from all over the world have examined it for its rust resistance.</p><div class=\"stat-row\"><div class=\"stat-pill\"><div class=\"num\">8 m</div><div class=\"lab\">high</div></div><div class=\"stat-pill\"><div class=\"num\">6 tonnes</div><div class=\"lab\">6000 kg</div></div><div class=\"stat-pill\"><div class=\"num\">1600+</div><div class=\"lab\">years without rusting through</div></div></div></div></div><div class=\"callout extra\"><div class=\"lab\">Going further</div><p>Studies suggest the pillar's iron is rich in phosphorus. Over time this helped form a thin, tight protective film on its surface that keeps out air and moisture, rather like the oxide layer on aluminium.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">49</span>Check your understanding</div><div class=\"qa-list\"><details class=\"qa\"><summary>Metallic oxides of zinc, magnesium and copper were heated with the metals zinc, magnesium and copper. In which cases will displacement take place?</summary><div class=\"qa-body\"><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Metal ↓ / oxide →</th><th>Zinc oxide</th><th>Magnesium oxide</th><th>Copper oxide</th></tr></thead><tbody><tr><td class=\"n\">Zinc</td><td>—</td><td>No reaction</td><td>✅ Displacement</td></tr><tr><td class=\"n\">Magnesium</td><td>✅ Displacement</td><td>—</td><td>✅ Displacement</td></tr><tr><td class=\"n\">Copper</td><td>No reaction</td><td>No reaction</td><td>—</td></tr></tbody></table></div><p>A metal displaces another only if it is higher in the reactivity series: Mg > Zn > Cu.</p></div></details><details class=\"qa\"><summary>Which metals do not corrode easily?</summary><div class=\"qa-body\"><p>Gold, platinum and silver (silver only tarnishes slowly). These are the least reactive metals.</p></div></details><details class=\"qa\"><summary>What are alloys?</summary><div class=\"qa-body\"><p>Homogeneous mixtures of two or more metals, or of a metal and a non-metal, such as brass (Cu + Zn), bronze (Cu + Sn), solder (Pb + Sn) and steel (Fe + C).</p></div></details></div></div>"}, "exercises": {"icon": "✍️", "label": "Chapter Exercises", "sub": "Complete model answers", "kicker": "Exercises", "html": "<p class=\"lede\">The end-of-chapter exercises with complete model answers. Try each one yourself before opening the answer.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">I</span>Multiple choice</div><div class=\"qa-list\"><details class=\"qa\"><summary>1. Which of the following pairs will give displacement reactions? (a) NaCl solution and copper metal (b) MgCl₂ solution and aluminium metal (c) FeSO₄ solution and silver metal (d) AgNO₃ solution and copper metal.</summary><div class=\"qa-body\"><p><b>Answer: (d).</b> Copper is above silver in the reactivity series, so Cu + 2AgNO<sub>3</sub> → Cu(NO<sub>3</sub>)<sub>2</sub> + 2Ag. In (a), (b) and (c) the metal added is less reactive than the metal in the salt.</p></div></details><details class=\"qa\"><summary>2. Which of the following methods is suitable for preventing an iron frying pan from rusting? (a) Applying grease (b) Applying paint (c) Applying a coating of zinc (d) All of the above.</summary><div class=\"qa-body\"><p><b>Answer: (c) applying a coating of zinc.</b> A frying pan is heated strongly and touches food: grease would burn off and paint would peel and contaminate the food. A zinc coating stays in place and protects the iron.</p></div></details><details class=\"qa\"><summary>3. An element reacts with oxygen to give a compound with a high melting point. This compound is also soluble in water. The element is likely to be (a) calcium (b) carbon (c) silicon (d) iron.</summary><div class=\"qa-body\"><p><b>Answer: (a) calcium.</b> Calcium oxide (CaO) is ionic, so it has a very high melting point (2850 K), and it dissolves in water to form calcium hydroxide. Carbon gives a gas, silicon dioxide is insoluble, and iron oxide is insoluble.</p></div></details><details class=\"qa\"><summary>4. Food cans are coated with tin and not with zinc because (a) zinc is costlier than tin (b) zinc has a higher melting point than tin (c) zinc is more reactive than tin (d) zinc is less reactive than tin.</summary><div class=\"qa-body\"><p><b>Answer: (c).</b> Zinc is more reactive and could react with acids present in food, forming harmful compounds. Tin is less reactive and safe.</p></div></details></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">II</span>Short and long answers</div><div class=\"qa-list\"><details class=\"qa\"><summary>5. You are given a hammer, a battery, a bulb, wires and a switch. (a) How could you use them to distinguish between metals and non-metals? (b) Assess the usefulness of these tests.</summary><div class=\"qa-body\"><p>(a) <b>Hammer test</b>: beat the sample. A metal flattens into a sheet (malleable); a non-metal breaks into pieces (brittle). <b>Circuit test</b>: connect battery, bulb, switch and the sample in series. If the bulb glows, the sample conducts electricity and is probably a metal; if not, it is probably a non-metal.</p><p>(b) The tests are useful but not foolproof. <b>Graphite</b>, a non-metal, conducts electricity; <b>sodium</b> and <b>potassium</b> are too soft and reactive to test this way; <b>mercury</b> is a liquid and cannot be hammered. Chemical tests (such as the nature of the oxide) give a more reliable classification.</p></div></details><details class=\"qa\"><summary>6. What are amphoteric oxides? Give two examples.</summary><div class=\"qa-body\"><p>Metal oxides that react with both acids and bases to form salt and water. Examples: <b>aluminium oxide (Al<sub>2</sub>O<sub>3</sub>)</b> and <b>zinc oxide (ZnO)</b>.</p><p>Al<sub>2</sub>O<sub>3</sub> + 6HCl → 2AlCl<sub>3</sub> + 3H<sub>2</sub>O and Al<sub>2</sub>O<sub>3</sub> + 2NaOH → 2NaAlO<sub>2</sub> + H<sub>2</sub>O</p></div></details><details class=\"qa\"><summary>7. Name two metals which will displace hydrogen from dilute acids, and two which will not.</summary><div class=\"qa-body\"><p>Will displace hydrogen: <b>zinc and magnesium</b> (also iron, aluminium). Will not: <b>copper and silver</b> (also gold, mercury), because they lie below hydrogen in the reactivity series.</p></div></details><details class=\"qa\"><summary>8. In the electrolytic refining of a metal M, what would you take as the anode, the cathode and the electrolyte?</summary><div class=\"qa-body\"><p><b>Anode</b>: a block of impure metal M. <b>Cathode</b>: a thin strip of pure metal M. <b>Electrolyte</b>: a solution of a soluble salt of metal M (for copper, acidified copper sulphate).</p></div></details><details class=\"qa\"><summary>9. Sulphur powder was heated on a spatula and the gas evolved was collected in an inverted test tube. (a) What will be the action of the gas on (i) dry litmus paper (ii) moist litmus paper? (b) Write a balanced equation for the reaction.</summary><div class=\"qa-body\"><p>(a) (i) <b>No effect</b> on dry litmus: sulphur dioxide forms an acid only in the presence of water. (ii) It turns <b>moist blue litmus red</b>, because SO<sub>2</sub> + H<sub>2</sub>O → H<sub>2</sub>SO<sub>3</sub> (sulphurous acid).</p><p>(b) S(s) + O<sub>2</sub>(g) → SO<sub>2</sub>(g)</p></div></details><details class=\"qa\"><summary>10. State two ways to prevent the rusting of iron.</summary><div class=\"qa-body\"><p>(i) <b>Painting, oiling or greasing</b>, which keep air and moisture away. (ii) <b>Galvanising</b>, coating with zinc. (Alloying into stainless steel also works.)</p></div></details><details class=\"qa\"><summary>11. What type of oxides are formed when non-metals combine with oxygen?</summary><div class=\"qa-body\"><p><b>Acidic oxides</b> (such as SO<sub>2</sub>, CO<sub>2</sub>, P<sub>2</sub>O<sub>5</sub>), which form acids with water, or <b>neutral oxides</b> (such as CO, N<sub>2</sub>O, H<sub>2</sub>O).</p></div></details><details class=\"qa\"><summary>12. Give reasons: (a) Platinum, gold and silver are used to make jewellery. (b) Sodium, potassium and lithium are stored under oil. (c) Aluminium is highly reactive, yet used to make cooking utensils. (d) Carbonate and sulphide ores are usually converted into oxides during extraction.</summary><div class=\"qa-body\"><p>(a) They are <b>lustrous</b>, highly <b>malleable and ductile</b>, and so <b>unreactive</b> that they do not tarnish or corrode, keeping their shine for years.</p><p>(b) They are so reactive that they react vigorously with oxygen and moisture in the air and can catch fire. Oil keeps air and water away.</p><p>(c) Aluminium quickly forms a thin, tough layer of <b>aluminium oxide</b> that protects it from further reaction. It is also light, a good conductor of heat, and cheap.</p><p>(d) It is much easier to obtain a metal from its <b>oxide</b> (by reduction with carbon) than from its sulphide or carbonate. Roasting and calcination convert the ores into oxides.</p></div></details><details class=\"qa\"><summary>13. Tarnished copper vessels are cleaned with lemon or tamarind juice. Why are these sour substances effective?</summary><div class=\"qa-body\"><p>The green coating on copper is <b>basic copper carbonate</b> (CuCO<sub>3</sub>·Cu(OH)<sub>2</sub>), a basic substance. Lemon and tamarind contain <b>acids</b> (citric acid, tartaric acid) that <b>neutralise</b> this basic layer and dissolve it, uncovering the shiny copper again.</p></div></details><details class=\"qa\"><summary>14. Differentiate between metals and non-metals on the basis of their chemical properties.</summary><div class=\"qa-body\"><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Property</th><th>Metals</th><th>Non-metals</th></tr></thead><tbody><tr><td class=\"n\">Oxides</td><td>Basic (some amphoteric, e.g. Al₂O₃, ZnO)</td><td>Acidic or neutral</td></tr><tr><td class=\"n\">Electrons</td><td>Lose electrons, form positive ions</td><td>Gain electrons, form negative ions</td></tr><tr><td class=\"n\">Dilute acids</td><td>Reactive metals displace hydrogen</td><td>Do not displace hydrogen</td></tr><tr><td class=\"n\">Water</td><td>Many react to give hydroxide or oxide + H₂</td><td>Generally do not react</td></tr><tr><td class=\"n\">Salt solutions</td><td>More reactive metals displace less reactive ones</td><td>Do not displace metals</td></tr><tr><td class=\"n\">With hydrogen</td><td>Most do not react</td><td>React to form covalent hydrides (HCl, H₂S, NH₃)</td></tr><tr><td class=\"n\">Nature</td><td>Reducing agents (give electrons)</td><td>Mostly oxidising agents (take electrons)</td></tr></tbody></table></div></div></details><details class=\"qa\"><summary>15. A man posing as a goldsmith dipped dull gold bangles in a solution. They sparkled like new but lost much weight. What solution did he use?</summary><div class=\"qa-body\"><p>He used <b>aqua regia</b>, a freshly prepared 3 : 1 mixture of concentrated hydrochloric acid and concentrated nitric acid. It dissolves gold, so it removed the dull outer layer and revealed the shiny gold below, but a significant amount of the gold itself dissolved away, reducing the weight.</p></div></details><details class=\"qa\"><summary>16. Give reasons why copper is used to make hot water tanks and not steel.</summary><div class=\"qa-body\"><p>Copper <b>does not react with water, hot water or steam</b>, so it does not corrode. Steel (iron) would react with hot water and steam and <b>rust</b> quickly. Copper is also a <b>better conductor of heat</b>, so the water heats faster.</p></div></details></div></div>"}, "reference": {"icon": "📌", "label": "Quick Reference", "sub": "Summary, key terms, one-page map", "kicker": "Revision", "html": "<p class=\"lede\">Everything important in one place for quick revision.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">50</span>Key points</div><div class=\"ledger\"><div class=\"ledger-heading pos\">Remember</div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Classification</b> — elements are classified as metals and non-metals.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Metals</b> — are lustrous, malleable, ductile, good conductors of heat and electricity, and solid at room temperature except mercury.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Ions</b> — metals form positive ions by losing electrons; non-metals form negative ions by gaining electrons.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Oxides</b> — metals form basic oxides; Al₂O₃ and ZnO are amphoteric. Non-metals form acidic or neutral oxides.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Reactivity</b> — metals differ in their reactivity with water and dilute acids.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Activity series</b> — a list of common metals arranged in decreasing order of reactivity.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Hydrogen</b> — metals above hydrogen displace it from dilute acids; non-metals do not.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Displacement</b> — a more reactive metal displaces a less reactive metal from its salt solution.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Occurrence</b> — metals occur free or as compounds (minerals and ores).</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Metallurgy</b> — the extraction of metals from their ores and refining them for use.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Alloy</b> — a homogeneous mixture of two or more metals, or a metal and a non-metal.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Corrosion</b> — the eating away of metals such as iron by moist air over a long time.</p></div><div class=\"ledger-row pos\"><div class=\"ledger-badge\">+</div><p><b>Non-metals</b> — are neither malleable nor ductile and are bad conductors (graphite conducts). They react with hydrogen to form hydrides.</p></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">51</span>Metal vs non-metal at a glance</div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th></th><th>Metals</th><th>Non-metals</th></tr></thead><tbody><tr><td class=\"n\">Lustre</td><td>Shiny</td><td>Dull (iodine shiny)</td></tr><tr><td class=\"n\">Malleable / ductile</td><td>Yes</td><td>No, brittle</td></tr><tr><td class=\"n\">Conductivity</td><td>Good</td><td>Poor (graphite conducts)</td></tr><tr><td class=\"n\">State</td><td>Solid (Hg liquid)</td><td>Solid / gas (Br₂ liquid)</td></tr><tr><td class=\"n\">Oxide</td><td>Basic / amphoteric</td><td>Acidic / neutral</td></tr><tr><td class=\"n\">Ion</td><td>Cation (+)</td><td>Anion (−)</td></tr><tr><td class=\"n\">With dilute acid</td><td>H₂ from reactive metals</td><td>No H₂</td></tr></tbody></table></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">52</span>Extraction at a glance</div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Reactivity</th><th>Metals</th><th>Method</th><th>Example equation</th></tr></thead><tbody><tr><td class=\"n\">High</td><td>K, Na, Ca, Mg, Al</td><td>Electrolysis of molten compound</td><td>Na⁺ + e⁻ → Na</td></tr><tr><td class=\"n\">Medium</td><td>Zn, Fe, Pb, Cu</td><td>Roast/calcine → reduce with carbon</td><td>ZnO + C → Zn + CO</td></tr><tr><td class=\"n\">Low</td><td>Hg, Cu</td><td>Heating ore in air</td><td>2HgO → 2Hg + O₂</td></tr><tr><td class=\"n\">Very low</td><td>Ag, Au, Pt</td><td>Found native</td><td>—</td></tr></tbody></table></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">53</span>Key terms</div><div class=\"flip-grid\"><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Lustre</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>The shine of a freshly cleaned metal surface.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Malleability</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Ability to be beaten into thin sheets.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Ductility</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Ability to be drawn into thin wires.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Sonorous</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Producing a ringing sound when struck.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Allotropes</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Different forms of the same element, e.g. diamond and graphite.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Amphoteric oxide</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>An oxide that reacts with both acids and bases, e.g. Al₂O₃, ZnO.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Aqua regia</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>3 : 1 conc. HCl and conc. HNO₃; dissolves gold and platinum.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Ionic compound</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Formed by transfer of electrons from a metal to a non-metal.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Ore</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>A mineral from which a metal can be extracted profitably.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Gangue</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Soil, sand and other impurities in an ore.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Roasting</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Heating a sulphide ore in excess air.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Calcination</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Heating a carbonate ore in limited air.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Thermit reaction</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + heat.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Anode mud</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Insoluble impurities that settle below the anode during refining.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Galvanisation</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>Coating iron with zinc to prevent rusting.</p></div></div></div><div class=\"flip-card\"><div class=\"flip-inner\"><div class=\"flip-face flip-front\"><div class=\"t\">Amalgam</div><div class=\"hint\">tap to reveal</div></div><div class=\"flip-face flip-back\"><p>An alloy in which one metal is mercury.</p></div></div></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">54</span>The whole topic in one map</div><div class=\"radial\"><div class=\"radial-ring\"></div><div class=\"radial-hub\">⚙️<br>Metals &amp;<br>Non-metals</div><div class=\"radial-node\" style=\"left:calc(50% + 0px); top:calc(50% + -222px);\"><div class=\"card\"><h5><span class=\"dot\" style=\"background:var(--primary)\"></span>Physical</h5><div class=\"chipset\"><span class=\"chip\">Lustre</span><span class=\"chip\">Malleable</span><span class=\"chip\">Ductile</span><span class=\"chip\">Conductors</span></div></div></div><div class=\"radial-node\" style=\"left:calc(50% + 134px); top:calc(50% + -134px);\"><div class=\"card\"><h5><span class=\"dot\" style=\"background:var(--pull)\"></span>Exceptions</h5><div class=\"chipset\"><span class=\"chip\">Hg</span><span class=\"chip\">Iodine</span><span class= </span></div></div></div></div></div><div class=\"chain\">\"How readily a metal gives up its electrons decides how it reacts, where it is found, how it is extracted, and how quickly it corrodes.\"</div><div class=\"finale\"><b>End of the study guide</b><span>You've covered the physical and chemical properties of metals and non-metals, the reactivity series, ionic compounds, extraction and refining, corrosion and alloys. Go to the Quiz to test what you remember.</span></div>"}};
