/* ============ METALS & NON-METALS TOOLS ============ */
function ladderHTML(){
  var n = SERIES.length, h = '<div class="ladder"><div class="ladder-ends"><span>▲ Most reactive</span><span>Reactivity decreases ▼</span></div>';
  SERIES.forEach(function(s, i){
    var t = i/(n-1), col = 'hsl('+Math.round(4+t*150)+',62%,'+Math.round(48-t*8)+'%)';
    h += '<div class="rung'+(s==='H'?' h':'')+'"><div class="sy" style="background:'+col+'">'+s+'</div><div class="nm">'+LADDER_NAMES[s]+'</div>'+
         '<div class="tr"><i style="width:'+Math.round(100-t*92)+'%;background:'+col+'"></i></div></div>';
  });
  return h + '<div class="ladder-ends" style="margin:8px 0 0"><span></span><span>Least reactive ▼</span></div></div>';
}
var predState = {a:'Zn', b:'Cu'};
function renderPredictor(){
  var host = document.getElementById('predictor'); if(!host) return;
  var metals = Object.keys(PM_NAMES);
  var r = predState.a===predState.b ? null : PRED[predState.a+'|'+predState.b];
  var h = '<div class="pred"><h6>1 · Drop this metal…</h6><div class="pick">'+
    metals.map(function(m){ return '<button data-a="'+m+'" class="'+(m===predState.a?'on':'')+'">'+PM_NAMES[m]+'</button>'; }).join('')+
    '</div><h6>2 · …into this salt solution</h6><div class="pick">'+
    metals.map(function(m){ return '<button data-b="'+m+'" class="'+(m===predState.b?'on':'')+'">'+c(SALTS[m])+'</button>'; }).join('')+'</div>';
  if(!r){
    h += '<div class="pres no"><div class="verdict">Same metal</div><p>A metal placed in a solution of its own salt shows no displacement. Pick two different metals.</p></div>';
  } else {
    h += '<div class="pres '+(r.react?'yes':'no')+'"><div class="verdict">'+(r.react?'✓ Displacement happens':'✗ No reaction')+'</div>'+
      (r.eq ? eq(r.eq) : '')+'<p><b>You would see:</b> '+r.obs+'</p><p><b>Why:</b> '+r.why+'</p></div>';
  }
  host.innerHTML = h + '</div>';
  host.querySelectorAll('[data-a]').forEach(function(b){ b.onclick = function(){ predState.a = b.getAttribute('data-a'); renderPredictor(); }; });
  host.querySelectorAll('[data-b]').forEach(function(b){ b.onclick = function(){ predState.b = b.getAttribute('data-b'); renderPredictor(); }; });
}
var xSel = 'Na';
function renderExplorer(){
  var host = document.getElementById('explorer'); if(!host) return;
  var m = EXPLORER.filter(function(x){ return x.s===xSel; })[0];
  var tiles = EXPLORER.map(function(x){
    var lv=''; for(var k=0;k<5;k++) lv += '<i class="'+(k<x.lvl?'f':'')+'"></i>';
    return '<div class="xtile'+(x.s===xSel?' on':'')+'" data-x="'+x.s+'"><b>'+x.s+'</b><span>'+x.n+'</span><div class="lv">'+lv+'</div></div>';
  }).join('');
  var rows = [['With oxygen',m.oxy],['Cold water',m.cold],['Hot water',m.hot],['Steam',m.steam],['Dilute acids',m.acid],['Found as',m.occ],['Extracted by',m.ext],['Used for',m.use]];
  host.innerHTML = '<div class="xgrid">'+tiles+'</div><div class="xcard"><h4>'+m.n+' ('+m.s+')</h4><div class="sub">Position '+(SERIES.indexOf(m.s)+1)+' of '+SERIES.length+' in the reactivity series · reactivity dots: '+m.lvl+' / 5</div>'+
    rows.map(function(r){ return '<div class="xrow"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>'; }).join('')+'</div>';
  host.querySelectorAll('.xtile').forEach(function(t){ t.onclick = function(){ xSel = t.getAttribute('data-x'); renderExplorer(); }; });
}
function initSeries(){
  var l = document.getElementById('ladder'); if(l) l.innerHTML = ladderHTML();
  renderPredictor(); renderExplorer();
}
function initCarat(){
  var host = document.getElementById('carat'); if(!host) return;
  host.innerHTML = '<div class="carat"><div class="carat-top"><div class="big" id="ctK">22 carat</div><div class="pct" id="ctP"></div></div>'+
    '<input type="range" min="9" max="24" step="1" value="22" id="ctR" aria-label="Carat value">'+
    '<div class="parts" id="ctParts"></div><div class="legend"><span class="g">Pure gold</span><span>Copper or silver</span></div>'+
    '<p class="carat-note" id="ctN"></p></div>';
  var R = document.getElementById('ctR');
  function upd(){
    var k = +R.value, pct = (k/24*100);
    document.getElementById('ctK').textContent = k+' carat';
    document.getElementById('ctP').textContent = pct.toFixed(1)+' % gold';
    var p=''; for(var i=0;i<24;i++) p += '<i class="'+(i<k?'g':'')+'"></i>';
    document.getElementById('ctParts').innerHTML = p;
    var note = k===24 ? 'Pure gold: beautiful but too soft for everyday ornaments; it bends and scratches easily.'
      : k+' parts of pure gold mixed with '+(24-k)+' part'+(24-k>1?'s':'')+' of copper or silver. '+
        (k>=22 ? 'This is the usual choice for Indian jewellery: hard enough to wear, still very rich in gold.' :
         k>=18 ? 'Harder and more scratch-resistant; common for gem-set jewellery.' : 'Much harder and cheaper, but with noticeably less gold.');
    document.getElementById('ctN').textContent = note;
  }
  R.addEventListener('input', upd); upd();
}

var SECTIONS = {"overview": {"icon": "🔩", "label": "Metals Around Us", "sub": "Physical properties of metals", "kicker": "Physical properties · metals", "html": "<p class=\"lede\">Look around: the steel spoon in your kitchen, the copper wire behind the switchboard, the aluminium foil around your lunch, the gold in a pair of earrings. Next to them are things made of non-metals too: the oxygen you breathe, the carbon in pencil lead, the sulphur in a matchstick head. About 118 elements are known, and most of them are metals. This topic shows how to tell the two groups apart, first by how they look and behave, and then by how they react.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">01</span>Two big families of elements</div><p>Elements are broadly classified as <b>metals</b> and <b>non-metals</b> on the basis of their properties. Before learning the rules, think about where you meet each family every day, and why each one suits its job.</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Everyday object</th><th>Element used</th><th>Property that makes it useful</th></tr></thead><tbody><tr><td class=\"n\">Cooking pan</td><td>Aluminium, iron, copper</td><td>Conducts heat well and has a high melting point</td></tr><tr><td class=\"n\">Electric wire</td><td>Copper, aluminium</td><td>Conducts electricity and can be drawn into wires</td></tr><tr><td class=\"n\">Aluminium foil</td><td>Aluminium</td><td>Can be beaten into very thin sheets</td></tr><tr><td class=\"n\">Jewellery</td><td>Gold, silver, platinum</td><td>Shiny and does not tarnish or corrode easily</td></tr><tr><td class=\"n\">School bell</td><td>Brass, iron</td><td>Produces a ringing sound when struck</td></tr><tr><td class=\"n\">Pencil \"lead\"</td><td>Graphite (carbon)</td><td>Soft and slippery layers; leaves a mark</td></tr><tr><td class=\"n\">Breathing, burning</td><td>Oxygen</td><td>A reactive gas that supports burning and life</td></tr><tr><td class=\"n\">Antiseptic tincture</td><td>Iodine</td><td>Kills germs</td></tr></tbody></table></div><div class=\"callout extra\"><div class=\"lab\">Think about it</div><p>Which properties did you use to sort these? Probably shine, hardness, whether it bends or breaks, and whether it carries heat or electricity. Those are exactly the <b>physical properties</b> scientists use first.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">02</span>Metallic lustre: the shine of metals</div><div class=\"act\"><div class=\"lab\">Activity · Look at a clean metal surface</div><ol><li>Take samples of iron, copper, aluminium and magnesium and note how each one looks.</li><li>Rub the surface of each sample with sandpaper and look again.</li></ol><div class=\"obs\"><b>What you see:</b> Freshly cleaned metal surfaces <b>shine</b>. A dull layer on top (usually an oxide) hides this shine until it is rubbed away.</div></div><div class=\"term-card\"><div class=\"lab\">Metallic lustre</div><p>Metals, in their pure state, have a shining surface. This property is called metallic lustre.</p></div><p>Lustre is why metals are used for mirrors, jewellery and decorative work. Silver and aluminium are such good reflectors of light that they are used to coat mirrors.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">03</span>Hardness, malleability and ductility</div><div class=\"act\"><div class=\"lab\">Activity · Try to cut metals with a knife</div><div class=\"caution\">⚠️ Always handle sodium with care, using tongs. Never touch it with bare hands.</div><ol><li>Take small pieces of iron, copper, aluminium and magnesium and try to cut each with a sharp knife.</li><li>Hold a piece of sodium with a pair of tongs, dry it by pressing it between folds of filter paper, place it on a watch-glass and try to cut it.</li></ol><div class=\"obs\"><b>What you see:</b> Iron, copper, aluminium and magnesium cannot be cut easily: metals are generally <b>hard</b>. But sodium cuts like butter. The hardness varies from metal to metal.</div></div><div class=\"act\"><div class=\"lab\">Activity · Hammer a metal</div><ol><li>Take pieces of iron, zinc, lead and copper.</li><li>Place one metal on a block of iron and strike it four or five times with a hammer.</li><li>Repeat with the other metals and record the change in shape.</li></ol><div class=\"obs\"><b>What you see:</b> The metals flatten into thin sheets instead of breaking into pieces.</div></div><div class=\"term-card\"><div class=\"lab\">Malleability</div><p>The property of metals by which they can be beaten into thin sheets is called malleability. Gold and silver are the most malleable metals.</p></div><p>Now think of the metals whose <b>wires</b> you see every day: copper and aluminium in electrical wiring, iron in fencing, tungsten in old bulb filaments, gold and silver in fine jewellery chains.</p><div class=\"term-card\"><div class=\"lab\">Ductility</div><p>The ability of metals to be drawn into thin wires is called ductility. Gold is the most ductile metal.</p></div><div class=\"stat-row\"><div class=\"stat-pill\"><div class=\"num\">1 g</div><div class=\"lab\">of gold</div></div><div class=\"stat-pill\"><div class=\"num\">≈ 2 km</div><div class=\"lab\">of wire can be drawn from it</div></div></div><p>It is because of their malleability and ductility that metals can be given different shapes according to our needs: sheets for roofs and cans, wires for cables, rods for buildings.</p><div class=\"callout extra\"><div class=\"lab\">Why can metals bend without breaking?</div><p>In a metal, the atoms are packed in layers held together by a \"sea\" of shared electrons. When you hammer the metal, the layers simply slide over one another and the electron sea keeps holding them. In a brittle solid, sliding pushes like charges together and the solid cracks.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">04</span>Conduction of heat</div><p>Why are cooking vessels made of metal? Let us test how heat moves through a metal wire.</p><div class=\"act\"><div class=\"lab\">Activity · Does heat travel through a metal?</div><ol><li>Clamp an aluminium or copper wire on a stand.</li><li>Fix a pin to the free end of the wire using wax.</li><li>Heat the wire with a spirit lamp, candle or burner near the clamped end.</li><li>Watch the pin, and check whether the metal wire melts.</li></ol><div class=\"obs\"><b>What you see:</b> After some time the <b>wax melts and the pin falls</b>. Heat has travelled along the wire. The wire itself does <b>not melt</b>.</div></div><figure class=\"fig\"><svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><rect x=\"8\" y=\"202\" width=\"384\" height=\"9\" rx=\"4\" fill=\"#d8cbb3\"/><rect x=\"26\" y=\"194\" width=\"74\" height=\"8\" rx=\"3\" fill=\"#6b7280\"/><rect x=\"56\" y=\"34\" width=\"7\" height=\"160\" rx=\"2\" fill=\"#9ca3af\"/><rect x=\"56\" y=\"63\" width=\"48\" height=\"14\" rx=\"3\" fill=\"#6b7280\"/><line x1=\"104\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"#b87333\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><ellipse cx=\"352\" cy=\"75\" rx=\"8\" ry=\"5\" fill=\"#fef3c7\" stroke=\"#d6b25e\"/><line x1=\"352\" y1=\"79\" x2=\"352\" y2=\"118\" stroke=\"#374151\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"352\" cy=\"120\" r=\"2.6\" fill=\"#374151\"/><rect x=\"122\" y=\"112\" width=\"18\" height=\"90\" rx=\"3\" fill=\"#f5f0e1\" stroke=\"#d8cbb3\"/><path d=\"M131 76.3 C142.55 95.935 142.55 112 131 112 C119.45 112 119.45 95.935 131 76.3Z\" fill=\"#f59e0b\"/><path d=\"M131 91.0 C137.3 102.55 137.3 112 131 112 C124.7 112 124.7 102.55 131 91.0Z\" fill=\"#fde68a\"/><line x1=\"160\" y1=\"56\" x2=\"184\" y2=\"56\" stroke=\"#ef4444\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M184 52 L191 56 L184 60 Z\" fill=\"#ef4444\"/><line x1=\"200\" y1=\"56\" x2=\"224\" y2=\"56\" stroke=\"#ef4444\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M224 52 L231 56 L224 60 Z\" fill=\"#ef4444\"/><line x1=\"240\" y1=\"56\" x2=\"264\" y2=\"56\" stroke=\"#ef4444\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M264 52 L271 56 L264 60 Z\" fill=\"#ef4444\"/><line x1=\"280\" y1=\"56\" x2=\"304\" y2=\"56\" stroke=\"#ef4444\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><path d=\"M304 52 L311 56 L304 60 Z\" fill=\"#ef4444\"/><text x=\"240\" y=\"46\" font-size=\"11.5\" font-weight=\"600\" fill=\"#b42318\" text-anchor=\"middle\">Heat travels along the wire</text><text x=\"230\" y=\"92\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Aluminium or copper wire</text><line x1=\"250\" y1=\"86\" x2=\"250\" y2=\"73\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><line x1=\"360\" y1=\"100\" x2=\"380\" y2=\"150\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"300\" y=\"166\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Wax softens and</text><text x=\"300\" y=\"180\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">the pin drops off</text><text x=\"150\" y=\"160\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Candle</text><text x=\"20\" y=\"28\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Clamp stand</text></svg><figcaption>Heat the wire near the clamp: soon the wax at the far end melts and the pin falls. The heat has travelled through the solid metal, yet the wire itself does not melt.</figcaption></figure><p>So metals are <b>good conductors of heat</b> and have <b>high melting points</b>. The best conductors of heat are <b>silver and copper</b>. <b>Lead and mercury</b> are comparatively poor conductors of heat.</p><div class=\"callout extra\"><div class=\"lab\">Why cooking vessels are metal</div><p>A pan must pass the heat of the flame quickly to the food and must not melt on the stove. Metals do both. The handle, however, is often made of plastic or wood, which conduct heat poorly, so you can hold it.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">05</span>Conduction of electricity</div><div class=\"act\"><div class=\"lab\">Activity · Do metals conduct electricity?</div><ol><li>Set up an electric circuit with a battery, a bulb and a switch, leaving a gap between two terminals A and B.</li><li>Place the metal to be tested between terminals A and B.</li><li>Switch on and see whether the bulb glows.</li></ol><div class=\"obs\"><b>What you see:</b> The bulb <b>glows</b> for every metal sample. Metals are <b>good conductors of electricity</b>.</div></div><figure class=\"fig\"><svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><defs><radialGradient id=\"glow\"><stop offset=\"0\" stop-color=\"#fde68a\"/><stop offset=\"1\" stop-color=\"#fde68a\" stop-opacity=\"0\"/></radialGradient></defs><path d=\"M60 84 L60 40 L182 40 M218 40 L340 40 L340 88 M340 116 L340 160 L262 160 M138 160 L60 160 L60 132\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2.2\"/><rect x=\"44\" y=\"84\" width=\"32\" height=\"48\" rx=\"4\" fill=\"#1f2937\"/><rect x=\"54\" y=\"78\" width=\"12\" height=\"7\" rx=\"2\" fill=\"#6b7280\"/><text x=\"60\" y=\"112\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">+</text><circle cx=\"200\" cy=\"34\" r=\"36\" fill=\"url(#glow)\"/><circle cx=\"200\" cy=\"32\" r=\"16\" fill=\"#fff7cc\" stroke=\"#5b6178\" stroke-width=\"2\"/><path d=\"M193 34 q7 -12 14 0\" fill=\"none\" stroke=\"#e0a526\" stroke-width=\"2\"/><rect x=\"190\" y=\"44\" width=\"20\" height=\"10\" rx=\"2\" fill=\"#9ca3af\"/><circle cx=\"340\" cy=\"88\" r=\"3.5\" fill=\"#5b6178\"/><circle cx=\"340\" cy=\"116\" r=\"3.5\" fill=\"#5b6178\"/><line x1=\"340\" y1=\"116\" x2=\"330\" y2=\"90\" stroke=\"#5b6178\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><rect x=\"150\" y=\"154\" width=\"100\" height=\"12\" rx=\"3\" fill=\"#b8bcc8\" stroke=\"#8c92a8\"/><rect x=\"132\" y=\"150\" width=\"14\" height=\"20\" rx=\"3\" fill=\"#ef4444\"/><rect x=\"254\" y=\"150\" width=\"14\" height=\"20\" rx=\"3\" fill=\"#1f2937\"/><text x=\"139\" y=\"190\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">A</text><text x=\"261\" y=\"190\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">B</text><text x=\"200\" y=\"210\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Metal strip under test</text><text x=\"16\" y=\"150\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Battery</text><text x=\"230\" y=\"22\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Bulb glows</text><text x=\"352\" y=\"106\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Switch</text></svg><figcaption>Place the material between terminals A and B and close the switch. With a metal in the gap, the bulb lights up: current flows through the metal.</figcaption></figure><p>The wires that carry current in your home have a coating of <b>polyvinylchloride (PVC)</b> or a rubber-like material. Why? Because these coatings are <b>poor conductors</b> (insulators). They stop the current from leaking out and protect us from electric shocks and short circuits.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">06</span>Sonority: metals ring</div><p>What happens when a metal strikes a hard surface? It produces a ringing sound.</p><div class=\"term-card\"><div class=\"lab\">Sonorous</div><p>Metals that produce a sound on striking a hard surface are said to be sonorous.</p></div><p>This is why school bells, temple bells, wind chimes and musical instruments such as cymbals are made of metal. A block of wood or a lump of coal only gives a dull thud.</p><div class=\"sign-grid\"><div class=\"sign\"><div class=\"ic\">✨</div><h5>Lustre</h5><p>Shiny surface when freshly cut or cleaned.</p></div><div class=\"sign\"><div class=\"ic\">💪</div><h5>Hard</h5><p>Generally hard; sodium and potassium are exceptions.</p></div><div class=\"sign\"><div class=\"ic\">🔨</div><h5>Malleable</h5><p>Can be hammered into sheets. Gold and silver lead.</p></div><div class=\"sign\"><div class=\"ic\">🧵</div><h5>Ductile</h5><p>Can be drawn into wires. Gold is the most ductile.</p></div><div class=\"sign\"><div class=\"ic\">🔥</div><h5>Conduct heat</h5><p>Silver and copper are best; lead and mercury poor.</p></div><div class=\"sign\"><div class=\"ic\">⚡</div><h5>Conduct electricity</h5><p>Used for wires and electrical parts.</p></div><div class=\"sign\"><div class=\"ic\">🔔</div><h5>Sonorous</h5><p>Ring when struck.</p></div><div class=\"sign\"><div class=\"ic\">🧱</div><h5>Solid, dense</h5><p>Solid at room temperature except mercury.</p></div></div></div>"}, "nonmetals": {"icon": "🧪", "label": "Non-metals & Exceptions", "sub": "Physical properties and the rule-breakers", "kicker": "Physical properties · non-metals", "html": "<p class=\"lede\">There are very few non-metals compared to metals, but they are everywhere: carbon in every living thing, oxygen and nitrogen in the air, sulphur in onions and matches, iodine in salt. Do they share the physical properties of metals?</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">07</span>Physical properties of non-metals</div><p>Common non-metals include <b>carbon, sulphur, iodine, oxygen, hydrogen, nitrogen, phosphorus and chlorine</b>. Non-metals are either <b>solids or gases</b>, except <b>bromine, which is a liquid</b>.</p><div class=\"act\"><div class=\"lab\">Activity · Test some non-metals</div><ol><li>Collect samples of carbon (coal or graphite), sulphur and iodine.</li><li>Repeat the tests used for metals: appearance, cutting, hammering, drawing into wires and the electric circuit.</li><li>Record all your observations in a table.</li></ol><div class=\"obs\"><b>What you see:</b> Coal and sulphur are <b>dull</b>. Sulphur and coal <b>break into pieces</b> when hammered: they are <b>brittle</b>, not malleable or ductile. Sulphur and iodine do not let the bulb glow: they are <b>poor conductors</b>.</div></div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Property</th><th>Metals</th><th>Non-metals</th></tr></thead><tbody><tr><td class=\"n\">Physical state</td><td>Solids (except mercury, a liquid)</td><td>Solids or gases (bromine is a liquid)</td></tr><tr><td class=\"n\">Appearance</td><td>Lustrous (shiny)</td><td>Dull (iodine is an exception)</td></tr><tr><td class=\"n\">Hardness</td><td>Generally hard</td><td>Solids are generally soft or brittle (diamond is an exception)</td></tr><tr><td class=\"n\">Malleability and ductility</td><td>Malleable and ductile</td><td>Neither; solids are brittle</td></tr><tr><td class=\"n\">Heat and electricity</td><td>Good conductors</td><td>Poor conductors (graphite conducts electricity)</td></tr><tr><td class=\"n\">Sound</td><td>Sonorous</td><td>Not sonorous</td></tr><tr><td class=\"n\">Melting and boiling points</td><td>Generally high</td><td>Generally low</td></tr><tr><td class=\"n\">Density</td><td>Generally high</td><td>Generally low</td></tr></tbody></table></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">08</span>The rule-breakers</div><p>Comparing all the observations, we find that elements cannot be grouped by their physical properties alone, because there are many <b>exceptions</b>:</p><div class=\"sign-grid\"><div class=\"sign\"><div class=\"ic\">💧</div><h5>Mercury</h5><p>A metal, yet a liquid at room temperature. All other metals are solids.</p></div><div class=\"sign\"><div class=\"ic\">🖐️</div><h5>Gallium and caesium</h5><p>Metals with such low melting points that they melt if kept on your palm.</p></div><div class=\"sign\"><div class=\"ic\">🔪</div><h5>Sodium, potassium, lithium</h5><p>Alkali metals so soft they can be cut with a knife; low density and low melting points.</p></div><div class=\"sign\"><div class=\"ic\">🟣</div><h5>Iodine</h5><p>A non-metal, but it is lustrous (shiny).</p></div><div class=\"sign\"><div class=\"ic\">💎</div><h5>Diamond</h5><p>A form of carbon: the hardest natural substance known, with a very high melting and boiling point.</p></div><div class=\"sign\"><div class=\"ic\">✏️</div><h5>Graphite</h5><p>Another form of carbon, and a good conductor of electricity.</p></div></div><div class=\"term-card\"><div class=\"lab\">Allotropes</div><p>Carbon is a non-metal that can exist in different forms. Each form is called an allotrope. Diamond and graphite are allotropes of carbon.</p></div><div class=\"tug\"><div class=\"tug-side push-side\"><h4>Diamond</h4><div class=\"cap\">An allotrope of carbon</div><p>Hardest natural substance</p><p>Very high melting and boiling point</p><p>Does <b>not</b> conduct electricity</p><p>Used in cutting tools and jewellery</p></div><div class=\"tug-badge\">C</div><div class=\"tug-side pull-side\"><h4>Graphite</h4><div class=\"cap\">Another allotrope of carbon</div><p>Soft and slippery</p><p>Grey, slightly shiny</p><p><b>Conducts</b> electricity</p><p>Used in pencils, electrodes and lubricants</p></div></div><div class=\"callout\"><div class=\"lab\">So how do we classify?</div><p>Because physical properties have so many exceptions, elements are classified more clearly as metals and non-metals on the basis of their <b>chemical properties</b>, especially the nature of their oxides.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">09</span>Metal oxide or non-metal oxide? The litmus test</div><div class=\"act\"><div class=\"lab\">Activity · Burn magnesium and sulphur</div><ol><li>Burn a magnesium ribbon, collect the ash and dissolve it in water.</li><li>Test the solution with red and blue litmus paper.</li><li>Now burn some sulphur powder. Place a test tube over the burning sulphur to collect the fumes.</li><li>Add a little water to the test tube, shake, and test with red and blue litmus paper.</li></ol><div class=\"obs\"><b>What you see:</b> The magnesium solution turns <b>red litmus blue</b>: it is <b>basic</b>. The sulphur solution turns <b>blue litmus red</b>: it is <b>acidic</b>.</div></div><figure class=\"fig\"><svg viewBox=\"0 0 420 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><path d=\"M80 110 L80 168.0 A22.0 22.0 0 0 0 124 168.0 L124 110 Z\" fill=\"#f1f5f9\"/><path d=\"M80 50 L80 168.0 A22.0 22.0 0 0 0 124 168.0 L124 50\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"77\" y1=\"50\" x2=\"127\" y2=\"50\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"96\" y=\"26\" width=\"12\" height=\"84\" fill=\"#f28b82\"/><rect x=\"96\" y=\"110\" width=\"12\" height=\"44\" fill=\"#64b5f6\"/><path d=\"M296 110 L296 168.0 A22.0 22.0 0 0 0 340 168.0 L340 110 Z\" fill=\"#f1f5f9\"/><path d=\"M296 50 L296 168.0 A22.0 22.0 0 0 0 340 168.0 L340 50\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"293\" y1=\"50\" x2=\"343\" y2=\"50\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"312\" y=\"26\" width=\"12\" height=\"84\" fill=\"#64b5f6\"/><rect x=\"312\" y=\"110\" width=\"12\" height=\"44\" fill=\"#f28b82\"/><text x=\"102\" y=\"214\" font-size=\"12\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Magnesium oxide + water</text><text x=\"102\" y=\"230\" font-size=\"11.5\" font-weight=\"600\" fill=\"#1d4ed8\" text-anchor=\"middle\">red litmus → blue · basic</text><text x=\"318\" y=\"214\" font-size=\"12\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Sulphur dioxide + water</text><text x=\"318\" y=\"230\" font-size=\"11.5\" font-weight=\"600\" fill=\"#b42318\" text-anchor=\"middle\">blue litmus → red · acidic</text><text x=\"210\" y=\"120\" font-size=\"20\" font-weight=\"700\" fill=\"#8c92a8\" text-anchor=\"middle\">vs</text></svg><figcaption>The same litmus test separates the two families: the oxide of a metal gives a basic solution, the oxide of a non-metal gives an acidic one.</figcaption></figure><div class=\"eq\"><div class=\"eq-main\">2Mg<span class=\"st\">(s)</span> + O<sub>2</sub><span class=\"st\">(g)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2MgO<span class=\"st\">(s)</span></div><div class=\"eq-note\">Magnesium burns with a dazzling white flame to give white magnesium oxide.</div></div><div class=\"eq\"><div class=\"eq-main\">MgO<span class=\"st\">(s)</span> + H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Mg(OH)<sub>2</sub><span class=\"st\">(aq)</span></div><div class=\"eq-note\">Magnesium hydroxide is a base: it turns red litmus blue.</div></div><div class=\"eq\"><div class=\"eq-main\">S<span class=\"st\">(s)</span> + O<sub>2</sub><span class=\"st\">(g)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> SO<sub>2</sub><span class=\"st\">(g)</span></div><div class=\"eq-note\">Sulphur burns with a blue flame giving sulphur dioxide, a gas with a choking smell.</div></div><div class=\"eq\"><div class=\"eq-main\">SO<sub>2</sub><span class=\"st\">(g)</span> + H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> H<sub>2</sub>SO<sub>3</sub><span class=\"st\">(aq)</span></div><div class=\"eq-note\">Sulphurous acid: it turns blue litmus red.</div></div><div class=\"tug\"><div class=\"tug-side push-side\"><h4>Metals</h4><div class=\"cap\">Form basic oxides</div><p>Metal + oxygen → metal oxide</p><p>Metal oxide + water → base (alkali if soluble)</p><p>Turns red litmus blue</p></div><div class=\"tug-badge\">🧪</div><div class=\"tug-side pull-side\"><h4>Non-metals</h4><div class=\"cap\">Form acidic or neutral oxides</div><p>Non-metal + oxygen → non-metal oxide</p><p>Most give acids in water (SO₂, CO₂)</p><p>Some are neutral: CO, N₂O, H₂O</p></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">10</span>Check your understanding</div><div class=\"qa-list\"><details class=\"qa\"><summary>Give an example of a metal which (i) is a liquid at room temperature (ii) can be easily cut with a knife (iii) is the best conductor of heat (iv) is a poor conductor of heat.</summary><div class=\"qa-body\"><p>(i) <b>Mercury</b> (ii) <b>Sodium</b> (or potassium, lithium) (iii) <b>Silver</b> (copper is a close second) (iv) <b>Lead</b> (or mercury)</p></div></details><details class=\"qa\"><summary>Explain the meanings of malleable and ductile.</summary><div class=\"qa-body\"><p><b>Malleable</b>: a substance that can be beaten into thin sheets without breaking, such as gold, silver and aluminium.</p><p><b>Ductile</b>: a substance that can be drawn into thin wires, such as gold, copper and aluminium.</p></div></details></div></div>"}, "oxygen": {"icon": "🔥", "label": "Metals and Oxygen", "sub": "Metal oxides, amphoteric oxides", "kicker": "Chemical properties · reaction with air", "html": "<p class=\"lede\">Now that physical properties have shown their limits, chemistry takes over. The first test for any metal is the simplest: what happens when it is heated in air?</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">11</span>Burning metals in air</div><div class=\"act\"><div class=\"lab\">Activity · Heat different metals in a flame</div><div class=\"caution\">⚠️ This needs the teacher's help. Wear eye protection.</div><ol><li>Hold a sample of aluminium, copper, iron, lead, magnesium, zinc or sodium with a pair of tongs and try burning it over a flame.</li><li>Repeat with the other samples and collect the product, if any.</li><li>Let the products and the metal surfaces cool, and test whether the products dissolve in water.</li></ol><div class=\"obs\"><b>What you see:</b> Sodium reacts most vigorously; magnesium burns with a dazzling white flame; others react slowly or only form a coating.</div></div><div class=\"term-card\"><div class=\"lab\">General reaction</div><p>Almost all metals combine with oxygen to form metal oxides: Metal + Oxygen → Metal oxide.</p></div><div class=\"eq\"><div class=\"eq-main\">2Cu + O<sub>2</sub> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2CuO</div><div class=\"eq-note\">Copper, heated in air, forms black copper(II) oxide.</div></div><div class=\"eq\"><div class=\"eq-main\">4Al + 3O<sub>2</sub> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2Al<sub>2</sub>O<sub>3</sub></div><div class=\"eq-note\">Aluminium forms aluminium oxide.</div></div><p>Metal oxides are generally <b>basic</b>: they react with acids to give a salt and water, for example CuO + 2HCl → CuCl<sub>2</sub> + H<sub>2</sub>O.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">12</span>Amphoteric oxides: both acid and base</div><p>Some metal oxides, such as <b>aluminium oxide</b> and <b>zinc oxide</b>, show both acidic and basic behaviour.</p><div class=\"term-card\"><div class=\"lab\">Amphoteric oxides</div><p>Metal oxides which react with both acids as well as bases to produce salts and water are known as amphoteric oxides.</p></div><div class=\"tug\"><div class=\"tug-side push-side\"><h4>Behaves as a base</h4><div class=\"cap\">reacts with an acid</div><p>Al<sub>2</sub>O<sub>3</sub> + 6HCl → 2AlCl<sub>3</sub> + 3H<sub>2</sub>O</p><p>Gives aluminium chloride and water</p></div><div class=\"tug-badge\">⚖️</div><div class=\"tug-side pull-side\"><h4>Behaves as an acid</h4><div class=\"cap\">reacts with a base</div><p>Al<sub>2</sub>O<sub>3</sub> + 2NaOH → 2NaAlO<sub>2</sub> + H<sub>2</sub>O</p><p>Gives sodium aluminate and water</p></div></div><div class=\"eq\"><div class=\"eq-main\">Al<sub>2</sub>O<sub>3</sub> + 6HCl <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2AlCl<sub>3</sub> + 3H<sub>2</sub>O</div></div><div class=\"eq\"><div class=\"eq-main\">Al<sub>2</sub>O<sub>3</sub> + 2NaOH <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2NaAlO<sub>2</sub> + H<sub>2</sub>O</div><div class=\"eq-note\">NaAlO₂ is sodium aluminate.</div></div><div class=\"callout extra\"><div class=\"lab\">Going further: zinc oxide</div><p>Zinc oxide does the same: ZnO + 2HCl → ZnCl<sub>2</sub> + H<sub>2</sub>O (as a base) and ZnO + 2NaOH → Na<sub>2</sub>ZnO<sub>2</sub> + H<sub>2</sub>O (as an acid, forming sodium zincate). The word \"amphoteric\" comes from the Greek <i>amphoteros</i>, meaning \"both\".</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">13</span>Oxides that dissolve: alkalis</div><p>Most metal oxides are <b>insoluble</b> in water, but some dissolve to form <b>alkalis</b> (soluble bases). Sodium oxide and potassium oxide are examples:</p><div class=\"eq\"><div class=\"eq-main\">Na<sub>2</sub>O<span class=\"st\">(s)</span> + H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2NaOH<span class=\"st\">(aq)</span></div></div><div class=\"eq\"><div class=\"eq-main\">K<sub>2</sub>O<span class=\"st\">(s)</span> + H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2KOH<span class=\"st\">(aq)</span></div></div><div class=\"callout extra\"><div class=\"lab\">Remember</div><p>All alkalis are bases, but not all bases are alkalis. Only bases that dissolve in water are called alkalis.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">14</span>Not all metals react alike</div><p>Different metals show different <b>reactivities</b> towards oxygen:</p><div class=\"timeline\"><div class=\"tl-step\"><div class=\"tl-num\">1</div><h5>Potassium and sodium</h5><p>React so vigorously that they catch fire if kept in the open. To protect them and to prevent accidental fires, they are kept <b>immersed in kerosene oil</b>.</p></div><div class=\"tl-step\"><div class=\"tl-num\">2</div><h5>Magnesium, aluminium, zinc, lead</h5><p>At ordinary temperature their surfaces are covered with a <b>thin layer of oxide</b>. This protective layer prevents the metal from further oxidation.</p></div><div class=\"tl-step\"><div class=\"tl-num\">3</div><h5>Iron</h5><p>A lump of iron does not burn on heating, but <b>iron filings burn vigorously</b> when sprinkled in the flame of a burner (more surface area exposed to oxygen).</p></div><div class=\"tl-step\"><div class=\"tl-num\">4</div><h5>Copper</h5><p>Does not burn, but the hot metal gets coated with a <b>black layer of copper(II) oxide</b>.</p></div><div class=\"tl-step\"><div class=\"tl-num\">5</div><h5>Silver and gold</h5><p><b>Do not react</b> with oxygen even at high temperatures.</p></div></div><p>Sodium is clearly the most reactive of these metals, and magnesium is less reactive than sodium. But burning in oxygen does not tell us the order for zinc, iron, copper and lead. We need more tests: water, acids and salt solutions.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">15</span>Anodising: turning a weakness into strength</div><div class=\"callout extra\"><div class=\"lab\">Did you know?</div><p><b>Anodising</b> is a process of forming a thick oxide layer on aluminium. Aluminium naturally develops a thin oxide layer in air, which makes it resistant to further corrosion. During anodising, a clean aluminium article is made the <b>anode</b> and is electrolysed with <b>dilute sulphuric acid</b>. The oxygen gas evolved at the anode reacts with the aluminium to make a thicker protective oxide layer. This layer can be dyed easily, giving aluminium articles (pressure cookers, window frames, phone bodies) an attractive finish.</p></div></div>"}, "water": {"icon": "💧", "label": "Metals and Water", "sub": "Cold water, hot water, steam", "kicker": "Chemical properties · reaction with water", "html": "<p class=\"lede\">Water is a gentler test than fire, and it separates the metals more clearly. Some explode in cold water, some need hot water, some need steam, and some do not react at all.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">16</span>The water test</div><div class=\"act\"><div class=\"lab\">Activity · Drop metals into water</div><div class=\"caution\">⚠️ This needs the teacher's help.</div><ol><li>Put small pieces of each metal separately in beakers half-filled with cold water.</li><li>Note which metals react, whether any catch fire, and whether any start floating.</li><li>Put the metals that did not react in beakers of hot water.</li><li>For those that still did not react, pass steam over the heated metal and collect any gas.</li></ol><div class=\"obs\"><b>What you see:</b> Sodium and potassium react violently; calcium reacts steadily and floats; magnesium needs hot water; aluminium, zinc and iron need steam; lead, copper, silver and gold do not react.</div></div><div class=\"term-card\"><div class=\"lab\">General reactions</div><p>Metal + Water → Metal oxide + Hydrogen, and then, if the oxide is soluble: Metal oxide + Water → Metal hydroxide.</p></div><figure class=\"fig\"><svg viewBox=\"0 0 430 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><rect x=\"8\" y=\"226\" width=\"414\" height=\"9\" rx=\"4\" fill=\"#d8cbb3\"/><rect x=\"35\" y=\"218\" width=\"44\" height=\"8\" rx=\"3\" fill=\"#6b7280\"/><rect x=\"51\" y=\"168\" width=\"12\" height=\"50\" rx=\"2\" fill=\"#9ca3af\"/><path d=\"M57 134.0 C68.0 152.7 68.0 168 57 168 C46.0 168 46.0 152.7 57 134.0Z\" fill=\"#f59e0b\"/><path d=\"M57 148.0 C63.0 159.0 63.0 168 57 168 C51.0 168 51.0 159.0 57 148.0Z\" fill=\"#fde68a\"/><path d=\"M40 112 L40 139.0 A17.0 17.0 0 0 0 74 139.0 L74 112 Z\" fill=\"#dbeafe\"/><path d=\"M40 40 L40 139.0 A17.0 17.0 0 0 0 74 139.0 L74 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"37\" y1=\"40\" x2=\"77\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><g fill=\"#e5e7eb\"><rect x=\"44\" y=\"92\" width=\"26\" height=\"14\" rx=\"4\"/></g><path d=\"M57 40 L57 24 L134 24 L134 106\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><rect x=\"128\" y=\"104\" width=\"140\" height=\"24\" rx=\"12\" fill=\"#fff\" stroke=\"#5b6178\" stroke-width=\"2\"/><g fill=\"#9ca3af\" stroke=\"#6b7280\"><rect x=\"180\" y=\"113\" width=\"12\" height=\"9\" rx=\"2\"/><rect x=\"196\" y=\"112\" width=\"14\" height=\"10\" rx=\"2\"/><rect x=\"214\" y=\"113\" width=\"11\" height=\"9\" rx=\"2\"/></g><rect x=\"186\" y=\"210\" width=\"44\" height=\"8\" rx=\"3\" fill=\"#6b7280\"/><rect x=\"202\" y=\"164\" width=\"12\" height=\"46\" rx=\"2\" fill=\"#9ca3af\"/><path d=\"M208 130.0 C219.0 148.7 219.0 164 208 164 C197.0 164 197.0 148.7 208 130.0Z\" fill=\"#f59e0b\"/><path d=\"M208 144.0 C214.0 155.0 214.0 164 208 164 C202.0 164 202.0 155.0 208 144.0Z\" fill=\"#fde68a\"/><path d=\"M268 116 L320 116 L320 200 L346 200\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><rect x=\"300\" y=\"160\" width=\"122\" height=\"60\" rx=\"4\" fill=\"#dbeafe\" stroke=\"#5b6178\" stroke-width=\"2\"/><rect x=\"336\" y=\"112\" width=\"46\" height=\"98\" rx=\"4\" fill=\"#f8fafc\" stroke=\"#5b6178\" stroke-width=\"2\"/><rect x=\"338\" y=\"172\" width=\"42\" height=\"36\" fill=\"#dbeafe\"/><circle cx=\"350\" cy=\"190\" r=\"2.5\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"362\" cy=\"176\" r=\"2\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"356\" cy=\"160\" r=\"2.2\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"366\" cy=\"140\" r=\"2\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><text x=\"8\" y=\"186\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Water +</text><text x=\"8\" y=\"200\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">glass wool</text><text x=\"70\" y=\"16\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Steam</text><text x=\"160\" y=\"96\" font-size=\"11.5\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"start\">Metal sample</text><line x1=\"196\" y1=\"100\" x2=\"200\" y2=\"110\" stroke=\"#8c92a8\" stroke-width=\"1\" stroke-linecap=\"round\"/><text x=\"338\" y=\"102\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1d7f63\" text-anchor=\"start\">Hydrogen</text><text x=\"338\" y=\"90\" font-size=\"11.5\" font-weight=\"500\" fill=\"#1d7f63\" text-anchor=\"start\">collects here</text></svg><figcaption>Metals that ignore cold and hot water may still react with steam. The steam passes over the heated metal and the hydrogen produced is collected over water.</figcaption></figure></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">17</span>From violent to nothing at all</div><p><b>Potassium and sodium</b> react violently with cold water. The reaction is so violent and exothermic that the evolved hydrogen immediately catches fire.</p><div class=\"eq\"><div class=\"eq-main\">2K<span class=\"st\">(s)</span> + 2H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2KOH<span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span> + heat energy</div></div><div class=\"eq\"><div class=\"eq-main\">2Na<span class=\"st\">(s)</span> + 2H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2NaOH<span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span> + heat energy</div></div><p>The reaction of <b>calcium</b> with water is less violent. The heat evolved is not enough for the hydrogen to catch fire. Calcium starts <b>floating</b> because bubbles of hydrogen stick to its surface.</p><div class=\"eq\"><div class=\"eq-main\">Ca<span class=\"st\">(s)</span> + 2H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Ca(OH)<sub>2</sub><span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span></div></div><p><b>Magnesium</b> does not react with cold water. It reacts with <b>hot water</b> to form magnesium hydroxide and hydrogen, and it also starts floating because of the hydrogen bubbles.</p><div class=\"eq\"><div class=\"eq-main\">Mg<span class=\"st\">(s)</span> + 2H<sub>2</sub>O<span class=\"st\">(l)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Mg(OH)<sub>2</sub><span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span></div><div class=\"eq-note\">With hot water.</div></div><p><b>Aluminium, iron and zinc</b> do not react with cold or hot water, but they react with <b>steam</b> to form the metal oxide and hydrogen.</p><div class=\"eq\"><div class=\"eq-main\">2Al<span class=\"st\">(s)</span> + 3H<sub>2</sub>O<span class=\"st\">(g)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Al<sub>2</sub>O<sub>3</sub><span class=\"st\">(s)</span> + 3H<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">3Fe<span class=\"st\">(s)</span> + 4H<sub>2</sub>O<span class=\"st\">(g)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Fe<sub>3</sub>O<sub>4</sub><span class=\"st\">(s)</span> + 4H<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">Zn<span class=\"st\">(s)</span> + H<sub>2</sub>O<span class=\"st\">(g)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> ZnO<span class=\"st\">(s)</span> + H<sub>2</sub><span class=\"st\">(g)</span></div></div><p><b>Lead, copper, silver and gold</b> do not react with water at all.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">18</span>The water ladder</div><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Metal</th><th>Cold water</th><th>Hot water</th><th>Steam</th></tr></thead><tbody><tr><td class=\"n\">Potassium, sodium</td><td>✅ Violent; H₂ catches fire</td><td>—</td><td>—</td></tr><tr><td class=\"n\">Calcium</td><td>✅ Less violent; floats</td><td>—</td><td>—</td></tr><tr><td class=\"n\">Magnesium</td><td>❌</td><td>✅ Floats on H₂ bubbles</td><td>✅</td></tr><tr><td class=\"n\">Aluminium, zinc, iron</td><td>❌</td><td>❌</td><td>✅ Oxide + H₂</td></tr><tr><td class=\"n\">Lead, copper, silver, gold</td><td>❌</td><td>❌</td><td>❌</td></tr></tbody></table></div><div class=\"chain\">K > Na > Ca > Mg > Al > Zn > Fe > Pb, Cu, Ag, Au: the further down the list, the harsher the conditions a metal needs before it will react with water.</div></div>"}, "acids": {"icon": "⚗️", "label": "Metals and Acids", "sub": "Hydrogen, nitric acid, aqua regia", "kicker": "Chemical properties · reaction with acids", "html": "<p class=\"lede\">Metals react with dilute acids to give a salt and hydrogen gas. But how fast they react, and how much heat they give out, depends again on the metal.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">19</span>Racing metals in acid</div><div class=\"term-card\"><div class=\"lab\">General reaction</div><p>Metal + Dilute acid → Salt + Hydrogen</p></div><div class=\"act\"><div class=\"lab\">Activity · Compare metals in dilute hydrochloric acid</div><div class=\"caution\">⚠️ Do not use sodium or potassium: they react vigorously even with cold water.</div><ol><li>Clean samples of magnesium, aluminium, zinc, iron and copper with sandpaper.</li><li>Put each sample in a separate test tube containing dilute hydrochloric acid.</li><li>Suspend a thermometer in each tube so that its bulb dips into the acid.</li><li>Observe the rate of bubbling and the temperature in each tube.</li></ol><div class=\"obs\"><b>What you see:</b> Bubbles form fastest with <b>magnesium</b>, which also gives the highest temperature. Bubbling becomes slower with aluminium, zinc and iron. <b>Copper shows no bubbles</b> and no change in temperature.</div></div><figure class=\"fig\"><svg viewBox=\"0 20 420 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><path d=\"M22 74 L22 170.0 A20.0 20.0 0 0 0 62 170.0 L62 74 Z\" fill=\"#e8f1fb\"/><path d=\"M22 40 L22 170.0 A20.0 20.0 0 0 0 62 170.0 L62 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"19\" y1=\"40\" x2=\"65\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"32\" y=\"160\" width=\"20\" height=\"12\" rx=\"3\" fill=\"#9ca3af\" stroke=\"#6b7280\"/><circle cx=\"37.77198635599589\" cy=\"91.46453721826215\" r=\"2.6414951568637663\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"31.738470880021026\" cy=\"120.72703232730838\" r=\"2.185102267060137\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"31.39197419459296\" cy=\"118.56511572239594\" r=\"1.6599930535071759\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"40.40749640789726\" cy=\"85.30901219167104\" r=\"1.7451408213501842\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"40.18846053942033\" cy=\"142.84076147507488\" r=\"1.798083137839433\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"35.357735150568345\" cy=\"127.68492490282479\" r=\"3.116334307931209\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"43.85047076681997\" cy=\"110.14771607345929\" r=\"3.162008168948672\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"31.11798433482615\" cy=\"145.24360288769964\" r=\"2.063374858130682\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"33.4621220005785\" cy=\"88.952210093956\" r=\"2.093570918563095\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"49.587032618880755\" cy=\"93.73520487421925\" r=\"2.530560261859946\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"45.33392325422842\" cy=\"108.30221324715558\" r=\"2.4763911451352927\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"31.506935399359755\" cy=\"84.52968891743369\" r=\"1.9295339405109226\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"46.32959935636286\" cy=\"112.49701523087461\" r=\"2.1026354726028664\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"44.05348472418333\" cy=\"114.44201260417893\" r=\"2.079627194981892\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"49.065107556539786\" cy=\"133.12357696344742\" r=\"1.9905544171554448\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"43.7861690462081\" cy=\"119.91493428967031\" r=\"3.0002199929174864\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><rect x=\"66\" y=\"40\" width=\"6\" height=\"58\" rx=\"3\" fill=\"#fff\" stroke=\"#c6c9d1\"/><rect x=\"67.5\" y=\"50\" width=\"3\" height=\"46\" fill=\"#ef4444\"/><text x=\"42\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Mg</text><text x=\"42\" y=\"230\" font-size=\"11\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Very fast</text><path d=\"M102 74 L102 170.0 A20.0 20.0 0 0 0 142 170.0 L142 74 Z\" fill=\"#e8f1fb\"/><path d=\"M102 40 L102 170.0 A20.0 20.0 0 0 0 142 170.0 L142 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"99\" y1=\"40\" x2=\"145\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"112\" y=\"160\" width=\"20\" height=\"12\" rx=\"3\" fill=\"#d1d5db\" stroke=\"#6b7280\"/><circle cx=\"127.50668694654122\" cy=\"101.88327013165417\" r=\"3.1682797559881317\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"112.8335786781191\" cy=\"111.77733445567726\" r=\"2.8114254873043993\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"113.64762883185212\" cy=\"117.16119563616122\" r=\"1.6627316112759003\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"126.03718055682549\" cy=\"138.1073858321738\" r=\"2.5168415044438146\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"131.01146748394132\" cy=\"103.84481097645535\" r=\"2.7124725860378547\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"124.26487705052044\" cy=\"124.0720355254694\" r=\"2.329928530082261\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"130.159226732301\" cy=\"151.79576322820324\" r=\"2.3585573398714312\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"125.93965293139219\" cy=\"84.6108764973887\" r=\"2.722387234087078\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"125.53109250866405\" cy=\"155.4752913994642\" r=\"2.915079658575544\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"116.83029277025958\" cy=\"109.32014962595002\" r=\"2.669844345414701\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"110.54151027333413\" cy=\"115.08884175878221\" r=\"1.8688774062504714\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><rect x=\"146\" y=\"40\" width=\"6\" height=\"58\" rx=\"3\" fill=\"#fff\" stroke=\"#c6c9d1\"/><rect x=\"147.5\" y=\"60\" width=\"3\" height=\"36\" fill=\"#ef4444\"/><text x=\"122\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Al</text><text x=\"122\" y=\"230\" font-size=\"11\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Fast</text><path d=\"M182 74 L182 170.0 A20.0 20.0 0 0 0 222 170.0 L222 74 Z\" fill=\"#e8f1fb\"/><path d=\"M182 40 L182 170.0 A20.0 20.0 0 0 0 222 170.0 L222 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"179\" y1=\"40\" x2=\"225\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"192\" y=\"160\" width=\"20\" height=\"12\" rx=\"3\" fill=\"#a3a8b4\" stroke=\"#6b7280\"/><circle cx=\"192.81029906756157\" cy=\"84.48053586917959\" r=\"2.8291727815560335\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"193.10416532844843\" cy=\"98.81872736096548\" r=\"2.2255195250131634\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"210.91412737903119\" cy=\"86.12417889121053\" r=\"2.3186998415189297\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"203.1865578194569\" cy=\"147.13717080955496\" r=\"2.910847740537186\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"210.73562727276436\" cy=\"101.16000090305619\" r=\"2.264474427538718\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"198.610507967959\" cy=\"147.19865486706448\" r=\"3.132369926342386\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"193.6221017389866\" cy=\"93.39254736526814\" r=\"1.9711309869112572\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><rect x=\"226\" y=\"40\" width=\"6\" height=\"58\" rx=\"3\" fill=\"#fff\" stroke=\"#c6c9d1\"/><rect x=\"227.5\" y=\"70\" width=\"3\" height=\"26\" fill=\"#ef4444\"/><text x=\"202\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Zn</text><text x=\"202\" y=\"230\" font-size=\"11\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Moderate</text><path d=\"M262 74 L262 170.0 A20.0 20.0 0 0 0 302 170.0 L302 74 Z\" fill=\"#e8f1fb\"/><path d=\"M262 40 L262 170.0 A20.0 20.0 0 0 0 302 170.0 L302 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"259\" y1=\"40\" x2=\"305\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"272\" y=\"160\" width=\"20\" height=\"12\" rx=\"3\" fill=\"#6b7280\" stroke=\"#6b7280\"/><circle cx=\"275.60006600834066\" cy=\"116.8571675059431\" r=\"2.542597605971609\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"276.3059188631649\" cy=\"80.31111385726486\" r=\"2.270314401800525\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><circle cx=\"278.8620857494734\" cy=\"123.04193300168579\" r=\"3.1249566808401528\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"1.2\"/><rect x=\"306\" y=\"40\" width=\"6\" height=\"58\" rx=\"3\" fill=\"#fff\" stroke=\"#c6c9d1\"/><rect x=\"307.5\" y=\"80\" width=\"3\" height=\"16\" fill=\"#ef4444\"/><text x=\"282\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Fe</text><text x=\"282\" y=\"230\" font-size=\"11\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">Slow</text><path d=\"M342 74 L342 170.0 A20.0 20.0 0 0 0 382 170.0 L382 74 Z\" fill=\"#e8f1fb\"/><path d=\"M342 40 L342 170.0 A20.0 20.0 0 0 0 382 170.0 L382 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"339\" y1=\"40\" x2=\"385\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"352\" y=\"160\" width=\"20\" height=\"12\" rx=\"3\" fill=\"#b87333\" stroke=\"#6b7280\"/><rect x=\"386\" y=\"40\" width=\"6\" height=\"58\" rx=\"3\" fill=\"#fff\" stroke=\"#c6c9d1\"/><rect x=\"387.5\" y=\"92\" width=\"3\" height=\"4\" fill=\"#ef4444\"/><text x=\"362\" y=\"214\" font-size=\"13\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Cu</text><text x=\"362\" y=\"230\" font-size=\"11\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">None</text></svg><figcaption>Same acid, same temperature, five metals: the stream of hydrogen bubbles and the rise in temperature both fall in the order Mg > Al > Zn > Fe, and copper shows no reaction at all.</figcaption></figure><div class=\"eq\"><div class=\"eq-main\">Mg<span class=\"st\">(s)</span> + 2HCl<span class=\"st\">(aq)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> MgCl<sub>2</sub><span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">2Al<span class=\"st\">(s)</span> + 6HCl<span class=\"st\">(aq)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> 2AlCl<sub>3</sub><span class=\"st\">(aq)</span> + 3H<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">Zn<span class=\"st\">(s)</span> + 2HCl<span class=\"st\">(aq)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> ZnCl<sub>2</sub><span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span></div></div><div class=\"eq\"><div class=\"eq-main\">Fe<span class=\"st\">(s)</span> + 2HCl<span class=\"st\">(aq)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> FeCl<sub>2</sub><span class=\"st\">(aq)</span> + H<sub>2</sub><span class=\"st\">(g)</span></div></div><p>The reactivity decreases in the order <b>Mg > Al > Zn > Fe</b>. Copper does not react with dilute HCl, because copper is <b>less reactive than hydrogen</b> and cannot displace it from the acid.</p><div class=\"callout extra\"><div class=\"lab\">Test for hydrogen</div><p>Bring a burning splinter near the mouth of the test tube. Hydrogen burns with a <b>pop sound</b>.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">20</span>Why nitric acid is different</div><p>Hydrogen gas is <b>not</b> evolved when a metal reacts with nitric acid. This is because HNO<sub>3</sub> is a <b>strong oxidising agent</b>. It oxidises the H<sub>2</sub> produced to water and is itself reduced to one of the nitrogen oxides (N<sub>2</sub>O, NO, NO<sub>2</sub>).</p><div class=\"callout\"><div class=\"lab\">The exception</div><p>Magnesium (Mg) and manganese (Mn) react with <b>very dilute</b> HNO<sub>3</sub> to evolve hydrogen gas.</p></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">21</span>Aqua regia: the royal water</div><div class=\"term-card\"><div class=\"lab\">Aqua regia</div><p>Aqua regia (Latin for \"royal water\") is a freshly prepared mixture of concentrated hydrochloric acid and concentrated nitric acid in the ratio 3 : 1.</p></div><div class=\"place-pair\"><div class=\"place-box origin\"><div class=\"lab\">3 parts</div><div class=\"val\">Conc. HCl</div></div><div class=\"place-arrow\">+</div><div class=\"place-box origin\"><div class=\"lab\">1 part</div><div class=\"val\">Conc. HNO₃</div></div><div class=\"place-arrow\">=</div><div class=\"place-box dest\"><div class=\"lab\">Dissolves</div><div class=\"val\">Gold & platinum</div></div></div><p>Neither acid can dissolve gold on its own, yet together they can. Aqua regia is a highly corrosive, fuming liquid and one of the few reagents able to dissolve gold and platinum, the \"royal\" or noble metals.</p></div>"}, "series": {"icon": "🏆", "label": "The Reactivity Series", "sub": "Displacement and the activity ranking", "kicker": "Reactivity series", "html": "<p class=\"lede\">Oxygen, water and acids gave us partial rankings, but some metals did not react with any of them. Displacement reactions settle the matter: put one metal into a solution of another metal's salt and see who wins.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">22</span>Metals in salt solutions</div><div class=\"act\"><div class=\"lab\">Activity · Iron nail vs copper wire</div><ol><li>Take a clean copper wire and a clean iron nail.</li><li>Put the copper wire in a solution of iron sulphate and the iron nail in a solution of copper sulphate.</li><li>Record your observations after 20 minutes.</li></ol><div class=\"obs\"><b>What you see:</b> The <b>iron nail</b> gets a reddish-brown coating and the blue copper sulphate solution fades towards pale green. The <b>copper wire</b> in iron sulphate shows <b>no change</b>.</div></div><figure class=\"fig\"><svg viewBox=\"0 0 420 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><path d=\"M80 80 L80 175.0 A25.0 25.0 0 0 0 130 175.0 L130 80 Z\" fill=\"#9fd0d8\"/><path d=\"M80 40 L80 175.0 A25.0 25.0 0 0 0 130 175.0 L130 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"77\" y1=\"40\" x2=\"133\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><rect x=\"93\" y=\"26\" width=\"18\" height=\"5\" rx=\"2\" fill=\"#6b7280\"/><path d=\"M102 31 L108 31 L108 176 L105.0 184 L102 176 Z\" fill=\"#9ca3af\" stroke=\"#6b7280\" stroke-width=\".8\"/><rect x=\"102\" y=\"100\" width=\"6\" height=\"9\" fill=\"#b45309\" opacity=\".85\"/><rect x=\"102\" y=\"114\" width=\"6\" height=\"9\" fill=\"#b45309\" opacity=\".85\"/><rect x=\"102\" y=\"128\" width=\"6\" height=\"9\" fill=\"#b45309\" opacity=\".85\"/><rect x=\"102\" y=\"142\" width=\"6\" height=\"9\" fill=\"#b45309\" opacity=\".85\"/><rect x=\"102\" y=\"156\" width=\"6\" height=\"9\" fill=\"#b45309\" opacity=\".85\"/><path d=\"M290 80 L290 175.0 A25.0 25.0 0 0 0 340 175.0 L340 80 Z\" fill=\"#d9f2d0\"/><path d=\"M290 40 L290 175.0 A25.0 25.0 0 0 0 340 175.0 L340 40\" fill=\"none\" stroke=\"#5b6178\" stroke-width=\"2\"/><line x1=\"287\" y1=\"40\" x2=\"343\" y2=\"40\" stroke=\"#5b6178\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M315 24 L315 92 q8 4 0 8 q-8 4 0 8 q8 4 0 8 q-8 4 0 8 q8 4 0 8 q-8 4 0 8 q8 4 0 8 q-8 4 0 8 q8 4 0 8 q-8 4 0 8\" fill=\"none\" stroke=\"#b87333\" stroke-width=\"3\"/><text x=\"105\" y=\"222\" font-size=\"12\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Iron nail in copper sulphate</text><text x=\"105\" y=\"238\" font-size=\"11\" font-weight=\"600\" fill=\"#1d7f63\" text-anchor=\"middle\">blue fades · brown copper coats the nail</text><text x=\"315\" y=\"222\" font-size=\"12\" font-weight=\"700\" fill=\"#181c2a\" text-anchor=\"middle\">Copper wire in iron sulphate</text><text x=\"315\" y=\"238\" font-size=\"11\" font-weight=\"600\" fill=\"#5b6178\" text-anchor=\"middle\">no change at all</text></svg><figcaption>Iron pushes copper out of its salt, but copper cannot push iron out. So iron is the more reactive of the two.</figcaption></figure><div class=\"eq\"><div class=\"eq-main\">Fe<span class=\"st\">(s)</span> + CuSO<sub>4</sub><span class=\"st\">(aq)</span> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> FeSO<sub>4</sub><span class=\"st\">(aq)</span> + Cu<span class=\"st\">(s)</span></div><div class=\"eq-note\">A displacement reaction. Iron is more reactive than copper.</div></div><div class=\"term-card\"><div class=\"lab\">The displacement rule</div><p>Reactive metals can displace less reactive metals from their compounds in solution or molten form. If metal A displaces metal B from its solution, A is more reactive than B.</p></div><p>Metal A + Salt solution of B → Salt solution of A + Metal B</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">23</span>The reactivity series</div><p>Using such displacement experiments, metals have been arranged in the order of their decreasing activity. This list is called the <b>reactivity series</b> or <b>activity series</b>.</p><div id=\"ladder\"></div><div class=\"callout extra\"><div class=\"lab\">Memory trick</div><p><b>P</b>lease <b>S</b>end <b>C</b>harlie's <b>M</b>onkeys <b>A</b>nd <b>Z</b>ebras <b>I</b>n <b>L</b>arge <b>H</b>ired <b>C</b>ages <b>M</b>ade <b>S</b>trong <b>G</b>enerously → Potassium, Sodium, Calcium, Magnesium, Aluminium, Zinc, Iron, Lead, Hydrogen, Copper, Mercury, Silver, Gold.</p></div><p>Hydrogen is not a metal but is placed in the series as a reference. <b>Metals above hydrogen</b> can displace hydrogen from dilute acids. <b>Metals below hydrogen</b> (copper, mercury, silver, gold) cannot.</p></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">24</span>Displacement predictor</div><p>Pick a metal and a salt solution. The predictor uses the reactivity series to tell you whether a reaction happens, what you would see, and the balanced equation.</p><div id=\"predictor\"></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">25</span>Metal explorer</div><p>Every reaction in this topic in one place. Tap a metal to see how it behaves with air, water and acids, where it is found and how it is extracted.</p><div id=\"explorer\"></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">26</span>Check your understanding</div><div class=\"qa-list\"><details class=\"qa\"><summary>Why is sodium kept immersed in kerosene oil?</summary><div class=\"qa-body\"><p>Sodium is so reactive that it reacts vigorously with oxygen and moisture in the air and can catch fire. Kerosene does not react with sodium and keeps air and water away from it, so it is stored under kerosene for safety.</p></div></details><details class=\"qa\"><summary>Write equations for the reactions of (i) iron with steam (ii) calcium and potassium with water.</summary><div class=\"qa-body\"><p>(i) 3Fe(s) + 4H<sub>2</sub>O(g) → Fe<sub>3</sub>O<sub>4</sub>(s) + 4H<sub>2</sub>(g)</p><p>(ii) Ca(s) + 2H<sub>2</sub>O(l) → Ca(OH)<sub>2</sub>(aq) + H<sub>2</sub>(g)</p><p>2K(s) + 2H<sub>2</sub>O(l) → 2KOH(aq) + H<sub>2</sub>(g) + heat energy</p></div></details><details class=\"qa\"><summary>Metals A, B, C and D were added to four solutions. A displaced metal from iron(II) sulphate and copper(II) sulphate. B displaced metal from copper(II) sulphate only. C displaced metal from silver nitrate only. D displaced nothing. (i) Which is most reactive? (ii) What happens if B is added to copper(II) sulphate? (iii) Arrange A, B, C, D in decreasing reactivity.</summary><div class=\"qa-body\"><p>(i) <b>A</b> is the most reactive: it displaces both iron and copper.</p><p>(ii) B displaces copper: a <b>reddish-brown copper deposit</b> forms on B and the blue colour of the solution fades.</p><p>(iii) <b>A > B > C > D</b>. A beats iron; B beats copper but not iron; C beats only silver; D beats nothing (not even silver).</p></div></details><details class=\"qa\"><summary>Which gas is produced when dilute hydrochloric acid is added to a reactive metal? Write the reaction of iron with dilute sulphuric acid.</summary><div class=\"qa-body\"><p><b>Hydrogen</b> gas is produced.</p><p>Fe(s) + H<sub>2</sub>SO<sub>4</sub>(aq) → FeSO<sub>4</sub>(aq) + H<sub>2</sub>(g)</p></div></details><details class=\"qa\"><summary>What would you observe when zinc is added to a solution of iron(II) sulphate? Write the reaction.</summary><div class=\"qa-body\"><p>Zinc is more reactive than iron, so it displaces iron. The <b>pale green</b> colour of the solution fades (zinc sulphate is colourless) and a <b>dark grey deposit of iron</b> forms on the zinc.</p><p>Zn(s) + FeSO<sub>4</sub>(aq) → ZnSO<sub>4</sub>(aq) + Fe(s)</p></div></details></div></div>"}, "ionic": {"icon": "🧲", "label": "How Metals & Non-metals React", "sub": "Electron transfer and ionic bonds", "kicker": "How do metals and non-metals react?", "html": "<p class=\"lede\">Why are metals so eager to react, and why do metals and non-metals join so firmly? The answer lies in the electrons in the outermost shell of their atoms.</p><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">27</span>The magic number: a full outer shell</div><p>Noble gases (helium, neon, argon) have a <b>completely filled valence shell</b> and show little chemical activity. We therefore explain the reactivity of other elements as a tendency to <b>attain a completely filled valence shell</b>, usually an octet of eight electrons (two for helium).</p><div class=\"tbl-wrap\"><table class=\"data\"><thead><tr><th>Type</th><th>Element</th><th>Atomic number</th><th>K</th><th>L</th><th>M</th><th>N</th></tr></thead><tbody><tr><td class=\"n\">Noble gas</td><td>Helium (He)</td><td>2</td><td>2</td><td></td><td></td><td></td></tr><tr><td class=\"n\">Noble gas</td><td>Neon (Ne)</td><td>10</td><td>2</td><td>8</td><td></td><td></td></tr><tr><td class=\"n\">Noble gas</td><td>Argon (Ar)</td><td>18</td><td>2</td><td>8</td><td>8</td><td></td></tr><tr><td class=\"n\">Metal</td><td>Sodium (Na)</td><td>11</td><td>2</td><td>8</td><td><b>1</b></td><td></td></tr><tr><td class=\"n\">Metal</td><td>Magnesium (Mg)</td><td>12</td><td>2</td><td>8</td><td><b>2</b></td><td></td></tr><tr><td class=\"n\">Metal</td><td>Aluminium (Al)</td><td>13</td><td>2</td><td>8</td><td><b>3</b></td><td></td></tr><tr><td class=\"n\">Metal</td><td>Potassium (K)</td><td>19</td><td>2</td><td>8</td><td>8</td><td><b>1</b></td></tr><tr><td class=\"n\">Metal</td><td>Calcium (Ca)</td><td>20</td><td>2</td><td>8</td><td>8</td><td><b>2</b></td></tr><tr><td class=\"n\">Non-metal</td><td>Nitrogen (N)</td><td>7</td><td>2</td><td><b>5</b></td><td></td><td></td></tr><tr><td class=\"n\">Non-metal</td><td>Oxygen (O)</td><td>8</td><td>2</td><td><b>6</b></td><td></td><td></td></tr><tr><td class=\"n\">Non-metal</td><td>Fluorine (F)</td><td>9</td><td>2</td><td><b>7</b></td><td></td><td></td></tr><tr><td class=\"n\">Non-metal</td><td>Phosphorus (P)</td><td>15</td><td>2</td><td>8</td><td><b>5</b></td><td></td></tr><tr><td class=\"n\">Non-metal</td><td>Sulphur (S)</td><td>16</td><td>2</td><td>8</td><td><b>6</b></td><td></td></tr><tr><td class=\"n\">Non-metal</td><td>Chlorine (Cl)</td><td>17</td><td>2</td><td>8</td><td><b>7</b></td><td></td></tr></tbody></table></div><div class=\"tug\"><div class=\"tug-side push-side\"><h4>Metals</h4><div class=\"cap\">1, 2 or 3 outer electrons</div><p>Easier to <b>lose</b> a few electrons than gain many</p><p>Become <b>positive ions</b> (cations)</p><p>Na → Na⁺, Mg → Mg²⁺, Al → Al³⁺</p></div><div class=\"tug-badge\">e⁻</div><div class=\"tug-side pull-side\"><h4>Non-metals</h4><div class=\"cap\">4 to 7 outer electrons</div><p>Easier to <b>gain</b> a few electrons</p><p>Become <b>negative ions</b> (anions)</p><p>Cl → Cl⁻, O → O²⁻, S → S²⁻</p></div></div></div><div class=\"block\"><div class=\"block-h\"><span class=\"idx\">28</span>Sodium meets chlorine</div><p>A sodium atom has <b>one</b> electron in its outermost (M) shell. If it loses this electron, its L shell becomes the outermost shell, and that has a stable octet. The nucleus still has 11 protons but there are only 10 electrons, so there is a net positive charge: the <b>sodium cation, Na⁺</b>.</p><p>Chlorine has <b>seven</b> electrons in its outermost shell and needs one more to complete its octet. After gaining an electron, it has 17 protons and 18 electrons: the <b>chloride anion, Cl⁻</b>.</p><div class=\"eq\"><div class=\"eq-main\">Na <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Na<sup>+</sup> + e<sup>−</sup></div><div class=\"eq-note\">Sodium atom (2, 8, 1) → sodium cation (2, 8)</div></div><div class=\"eq\"><div class=\"eq-main\">Cl + e<sup>−</sup> <span class=\"arr\"><i>&nbsp;</i><b>⟶</b></span> Cl<sup>−</sup></div><div class=\"eq-note\">Chlorine atom (2, 8, 7) → chloride anion (2, 8, 8)</div></div><figure class=\"fig\"><svg viewBox=\"0 -14 640 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" font-family=\"Inter, sans-serif\"><circle cx=\"70\" cy=\"100\" r=\"28\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"70\" cy=\"100\" r=\"41\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"70\" cy=\"100\" r=\"54\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"70\" cy=\"100\" r=\"15\" fill=\"#6c5ce0\"/><text x=\"70\" y=\"104.5\" font-size=\"12.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Na</text><circle cx=\"70.0\" cy=\"72.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"70.0\" cy=\"128.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"70.0\" cy=\"59.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"99.0\" cy=\"71.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"111.0\" cy=\"100.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"99.0\" cy=\"129.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"70.0\" cy=\"141.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"41.0\" cy=\"129.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"29.0\" cy=\"100.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"41.0\" cy=\"71.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"70.0\" cy=\"46.0\" r=\"3.6\" fill=\"#e0a526\"/><text x=\"152\" y=\"106\" font-size=\"24\" font-weight=\"700\" fill=\"#8c92a8\" text-anchor=\"middle\">+</text><circle cx=\"236\" cy=\"100\" r=\"28\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"236\" cy=\"100\" r=\"41\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"236\" cy=\"100\" r=\"54\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"236\" cy=\"100\" r=\"15\" fill=\"#1d7f63\"/><text x=\"236\" y=\"104.5\" font-size=\"12.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Cl</text><circle cx=\"236.0\" cy=\"72.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"236.0\" cy=\"128.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"236.0\" cy=\"59.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"265.0\" cy=\"71.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"277.0\" cy=\"100.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"265.0\" cy=\"129.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"236.0\" cy=\"141.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"207.0\" cy=\"129.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"195.0\" cy=\"100.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"207.0\" cy=\"71.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"236.0\" cy=\"46.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"278.2\" cy=\"66.3\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"288.6\" cy=\"112.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"259.4\" cy=\"148.7\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"212.6\" cy=\"148.7\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"183.4\" cy=\"112.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"193.8\" cy=\"66.3\" r=\"3.6\" fill=\"#181c2a\"/><path d=\"M70 44 Q150 -14 230 40\" fill=\"none\" stroke=\"#e0a526\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M224 34 L232 42 L222 44 Z\" fill=\"#e0a526\"/><text x=\"150\" y=\"4\" font-size=\"11.5\" font-weight=\"600\" fill=\"#b7791f\" text-anchor=\"middle\">one electron moves</text><text x=\"335\" y=\"108\" font-size=\"28\" font-weight=\"500\" fill=\"#5b6178\" text-anchor=\"middle\">⟶</text><circle cx=\"425\" cy=\"100\" r=\"28\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"425\" cy=\"100\" r=\"41\" fill=\"none\" stroke=\"#c9cde0\" stroke-width=\"1.2\"/><circle cx=\"425\" cy=\"100\" r=\"15\" fill=\"#6c5ce0\"/><text x=\"425\" y=\"104.5\" font-size=\"12.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Na</text><circle cx=\"425.0\" cy=\"72.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"425.0\" cy=\"128.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"425.0\" cy=\"59.0\" r=\"3.6\" fill=\"#181c2a\"/><circle cx=\"454.0\" cy=\"71.0\" r=\"3.6\" fill=\"#181c2a\"/><circle
