var quizQs = [{"q": "The property of metals by which they can be beaten into thin sheets is", "opts": ["Ductility", "Malleability", "Sonority", "Lustre"], "correct": 1}, {"q": "Which is the most ductile metal?", "opts": ["Silver", "Copper", "Gold", "Aluminium"], "correct": 2}, {"q": "The best conductors of heat are", "opts": ["Lead and mercury", "Silver and copper", "Iron and zinc", "Sodium and potassium"], "correct": 1}, {"q": "Which metal is a liquid at room temperature?", "opts": ["Gallium", "Caesium", "Mercury", "Sodium"], "correct": 2}, {"q": "Which non-metal is lustrous?", "opts": ["Sulphur", "Iodine", "Phosphorus", "Nitrogen"], "correct": 1}, {"q": "Which form of carbon conducts electricity?", "opts": ["Diamond", "Graphite", "Sulphur", "Iodine"], "correct": 1}, {"q": "Which non-metal is a liquid at room temperature?", "opts": ["Bromine", "Iodine", "Chlorine", "Mercury"], "correct": 0}, {"q": "The oxide formed by burning sulphur dissolves in water to give a solution that is", "opts": ["Basic", "Neutral", "Acidic", "Amphoteric"], "correct": 2}, {"q": "Oxides that react with both acids and bases are called", "opts": ["Basic oxides", "Acidic oxides", "Neutral oxides", "Amphoteric oxides"], "correct": 3}, {"q": "Which pair are amphoteric oxides?", "opts": ["Na₂O and K₂O", "Al₂O₃ and ZnO", "CuO and MgO", "SO₂ and CO₂"], "correct": 1}, {"q": "Sodium is stored under kerosene because it", "opts": ["Is very heavy", "Reacts vigorously with air and water", "Dissolves in water", "Is a liquid"], "correct": 1}, {"q": "Which metal reacts with hot water but not with cold water?", "opts": ["Sodium", "Calcium", "Magnesium", "Copper"], "correct": 2}, {"q": "Iron reacts with steam to form", "opts": ["FeO and H₂", "Fe₂O₃ and H₂", "Fe₃O₄ and H₂", "Fe(OH)₂ and H₂"], "correct": 2}, {"q": "Calcium floats on water during its reaction because", "opts": ["It is lighter than water", "Bubbles of hydrogen stick to it", "It melts", "It forms oil"], "correct": 1}, {"q": "Hydrogen gas is usually NOT evolved when metals react with nitric acid because nitric acid is a", "opts": ["Weak acid", "Strong oxidising agent", "Reducing agent", "Base"], "correct": 1}, {"q": "Aqua regia is a freshly prepared mixture of", "opts": ["3 parts conc. HNO₃ : 1 part conc. HCl", "3 parts conc. HCl : 1 part conc. HNO₃", "3 parts conc. H₂SO₄ : 1 part conc. HCl", "3 parts water : 1 part conc. HCl"], "correct": 1}, {"q": "An iron nail placed in copper sulphate solution", "opts": ["Shows no change", "Gets a brown coating of copper", "Dissolves completely at once", "Turns silver"], "correct": 1}, {"q": "Which metal is placed just below hydrogen in the reactivity series?", "opts": ["Lead", "Copper", "Silver", "Iron"], "correct": 1}, {"q": "The electronic configuration of the sodium ion, Na⁺, is", "opts": ["2, 8, 1", "2, 8", "2, 8, 8", "2, 7"], "correct": 1}, {"q": "Ionic compounds conduct electricity", "opts": ["In the solid state", "In molten state and in water solution", "Never", "Only in kerosene"], "correct": 1}, {"q": "Ionic compounds have high melting points because", "opts": ["They are made of molecules", "Strong forces hold the ions together", "They contain water", "They are metals"], "correct": 1}, {"q": "Impurities such as soil and sand present in an ore are called", "opts": ["Flux", "Slag", "Gangue", "Anode mud"], "correct": 2}, {"q": "Heating a sulphide ore strongly in excess air is called", "opts": ["Calcination", "Roasting", "Smelting", "Refining"], "correct": 1}, {"q": "Heating a carbonate ore in limited air is called", "opts": ["Calcination", "Roasting", "Electrolysis", "Galvanising"], "correct": 0}, {"q": "The thermit reaction between Fe₂O₃ and aluminium is used for", "opts": ["Making jewellery", "Joining railway tracks", "Refining copper", "Galvanising"], "correct": 1}, {"q": "Sodium, magnesium and calcium are obtained by", "opts": ["Heating with carbon", "Electrolysis of their molten chlorides", "Heating the ore alone", "Roasting"], "correct": 1}, {"q": "In electrolytic refining of copper, the cathode is", "opts": ["Impure copper", "A thin strip of pure copper", "Graphite", "Zinc"], "correct": 1}, {"q": "Iron rusts only in the presence of", "opts": ["Air alone", "Water alone", "Both air and water", "Oil"], "correct": 2}, {"q": "Coating iron with a thin layer of zinc is called", "opts": ["Anodising", "Galvanisation", "Alloying", "Chrome plating"], "correct": 1}, {"q": "Stainless steel is iron mixed with", "opts": ["Carbon only", "Nickel and chromium", "Copper and zinc", "Lead and tin"], "correct": 1}, {"q": "22 carat gold contains", "opts": ["22 parts gold, 2 parts copper or silver", "22 % gold", "Pure gold", "2 parts gold, 22 parts silver"], "correct": 0}, {"q": "Solder, used to join electrical wires, is an alloy of", "opts": ["Copper and zinc", "Copper and tin", "Lead and tin", "Iron and carbon"], "correct": 2}];

var quizIndex = 0, quizScore = 0, quizAnswers = new Array(quizQs.length).fill(null);
var letters = ['A','B','C','D'];

function renderQuizQuestion(){
  var i = quizIndex, item = quizQs[i];
  var answered = quizAnswers[i] !== null;
  var progress = quizQs.map(function(_,idx){
    var cls = ''; if(idx < i) cls='done'; else if(idx===i) cls='current';
    return '<span class="'+cls+'"></span>';
  }).join('');
  var optsHTML = item.opts.map(function(opt, idx){
    var cls = 'qz-choice';
    if(answered){
      if(idx === item.correct) cls += ' correct';
      else if(idx === quizAnswers[i] && idx !== item.correct) cls += ' wrong';
    }
    return '<button class="'+cls+'" data-idx="'+idx+'" '+(answered?'disabled':'')+'><span class="let">'+letters[idx]+'</span>'+opt+'</button>';
  }).join('');
  var fb = answered ? (quizAnswers[i]===item.correct
    ? '<div class="qz-feedback ok">✓ Correct — well done!</div>'
    : '<div class="qz-feedback no">✗ Not quite. The correct answer is <b>'+letters[item.correct]+'. '+item.opts[item.correct]+'</b>.</div>') : '';
  content.innerHTML =
    '<div class="kicker">Test yourself</div>'+
    '<div class="quiz-head"><div class="qz-progress">'+progress+'</div><div class="qz-count">Question '+(i+1)+' of '+quizQs.length+'</div></div>'+
    '<div class="glass qz-card"><div class="qz-text">'+item.q+'</div>'+optsHTML+fb+
    '<div class="qz-btnrow"><button class="btn btn-ghost" id="qPrev" '+(i===0?'disabled':'')+'>&larr; Back</button>'+
    '<button class="btn btn-primary" id="qNext" '+(answered?'':'disabled')+'>'+(i===quizQs.length-1?'See results':'Next')+' &rarr;</button></div></div>';
  document.querySelectorAll('.qz-choice').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(quizAnswers[i] !== null) return;
      var idx = parseInt(btn.getAttribute('data-idx'));
      quizAnswers[i] = idx;
      if(idx === item.correct) quizScore++;
      renderQuizQuestion();
    });
  });
  document.getElementById('qPrev').addEventListener('click', function(){ quizIndex--; renderQuizQuestion(); });
  document.getElementById('qNext').addEventListener('click', function(){
    if(i === quizQs.length-1){ renderQuizResults(); } else { quizIndex++; renderQuizQuestion(); }
  });
}

function renderQuizResults(){
  var pct = Math.round((quizScore/quizQs.length)*100);
  var status = 'Keep practising';
  if(pct >= 90) status = 'Excellent grasp!'; else if(pct >= 70) status = 'Solid understanding'; else if(pct >= 50) status = 'Good start';
  var review = quizQs.map(function(item, idx){
    var correct = quizAnswers[idx] === item.correct;
    return '<li class="'+(correct?'ok':'bad')+'"><span class="ic">'+(correct?'✓':'✗')+'</span><span><b>'+(idx+1)+'. '+item.q+'</b><br>Correct answer: '+letters[item.correct]+'. '+item.opts[item.correct]+'</span></li>';
  }).join('');
  content.innerHTML =
    '<div class="kicker">Results</div>'+
    '<h1 class="page-title">You scored '+quizScore+' / '+quizQs.length+'</h1>'+
    '<p class="lede">Here\'s how you did on the Metals and Non-metals quiz.</p>'+
    '<div class="qz-mastery"><div class="qz-stat"><div class="num">'+pct+'%</div><div class="lab">Accuracy</div></div>'+
    '<div class="qz-stat"><div class="num">'+quizScore+'</div><div class="lab">Correct answers</div><span class="qz-badge">'+status+'</span></div></div>'+
    '<ul class="qz-review">'+review+'</ul>'+
    '<div class="chain">"How readily a metal gives up its electrons decides how it reacts, where it is found, how it is extracted, and how quickly it corrodes."</div>'+
    '<div class="qz-btnrow"><button class="btn btn-ghost" id="retakeBtn">↺ Retake quiz</button><button class="btn btn-primary" id="toRefBtn">See quick reference &rarr;</button></div>';
  document.getElementById('retakeBtn').addEventListener('click', function(){
    quizIndex=0; quizScore=0; quizAnswers = new Array(quizQs.length).fill(null); renderQuizQuestion();
  });
  document.getElementById('toRefBtn').addEventListener('click', function(){ setSection('reference'); });
}

var content = document.getElementById('content');

function buildNav(){
  var nav = document.getElementById('routeNav');
  var html = '';
  SECTION_ORDER.forEach(function(id){
    var s = SECTIONS[id];
    html += '<button class="wp" data-sec="'+id+'"><span class="wp-dot">'+s.icon+'</span><span>'+s.label+'<small>'+s.sub+'</small></span></button>';
  });
  html += '<button class="wp wp-quiz" data-sec="quiz"><span class="wp-dot">🧠</span><span>Take the Quiz<small>'+quizQs.length+' questions · instant feedback</small></span></button>';
  nav.innerHTML = html;
  nav.querySelectorAll('.wp').forEach(function(btn){
    btn.addEventListener('click', function(){ setSection(btn.getAttribute('data-sec')); });
  });
}

function setSection(id){
  document.querySelectorAll('.wp').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-sec')===id); });
  if(id === 'quiz'){
    quizIndex=0; quizScore=0; quizAnswers = new Array(quizQs.length).fill(null);
    renderQuizQuestion();
  } else {
    var s = SECTIONS[id];
    var k = SECTION_ORDER.indexOf(id), nxt = SECTION_ORDER[k+1];
    var nextBtn = nxt ? '<div class="qz-btnrow" style="margin-top:34px"><button class="btn btn-primary" id="nextSec">Next: '+SECTIONS[nxt].label+' &rarr;</button></div>'
                      : '<div class="qz-btnrow" style="margin-top:34px"><button class="btn btn-primary" id="nextSec">Take the Quiz &rarr;</button></div>';
    content.innerHTML = '<div class="kicker">'+s.kicker+'</div><h1 class="page-title">'+s.label+'</h1>'+s.html+nextBtn;
    document.getElementById('nextSec').addEventListener('click', function(){ setSection(nxt || 'quiz'); });
    if(s.onRender) s.onRender();
  }
  window.scrollTo(0,0);
  document.getElementById('shell').classList.remove('rail-open');
}

document.addEventListener('click', function(e){
  var card = e.target.closest('.flip-card');
  if(card) card.classList.toggle('flipped');
});
document.getElementById('railToggle').addEventListener('click', function(){
  document.getElementById('shell').classList.toggle('rail-open');
});
document.getElementById('shell').addEventListener('click', function(e){
  if(e.target.id === 'shell') document.getElementById('shell').classList.remove('rail-open');
});

buildNav();
setSection('overview');
</script>
