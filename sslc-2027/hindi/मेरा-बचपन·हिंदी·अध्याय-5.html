<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>मेरा बचपन — अध्ययन सहायिका</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Noto+Sans+Devanagari&family=Noto+Sans+Kannada:wght@400;500;600:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --paper-tint:#eceff9;
  --ink:#181c2a;
  --ink-soft:#5b6178;
  --ink-faint:#8c92a8;
  --line:#e2e5f2;
  --primary:#6c5ce0;
  --primary-dim:#8778e8;
  --primary-soft:#ece9fb;
  --push:#1f2937;
  --push-soft:#c6c9d1;
  --pull:#1d7f63;
  --pull-soft:#e1f3ec;
  --amber:#1f2937;
  --amber-soft:#c6c9d1;
  --glass:rgba(255,255,255,.7);
  --glass-strong:rgba(255,255,255,.9);
  --glass-line:rgba(255,255,255,.85);
  --sidebar-bg-top:#252c40;
  --sidebar-bg-bottom:#161b29;
  --sidebar-line:rgba(255,255,255,.08);
  --sidebar-text:#c6cbdd;
  --sidebar-text-dim:#7d84a0;
  --shadow: 0 26px 60px -34px rgba(30,32,70,.38), 0 3px 10px rgba(30,32,70,.07);
  --shadow-sm: 0 10px 24px -16px rgba(30,32,70,.3);
  --radius:22px;
  --radius-sm:14px;
  --font-display:'Newsreader','Noto Serif Devanagari', serif;
  --font-body:'Inter','Noto Sans Devanagari','Noto Sans Kannada', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(900px 520px at 90% -8%, rgba(108,92,224,.10), transparent 60%),
    radial-gradient(760px 460px at -6% 18%, rgba(108,92,224,.06), transparent 55%),
    radial-gradient(680px 420px at 30% 112%, rgba(29,127,99,.06), transparent 55%),
    var(--paper-tint);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;}
::selection{background:var(--primary-soft);}
:focus-visible{outline:2.5px solid var(--primary); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}

/* ================= SHELL ================= */
.shell{display:grid; grid-template-columns:264px 1fr; min-height:100vh;}
.rail{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  padding:26px 18px 26px; border-right:1px solid var(--sidebar-line);
  background:linear-gradient(190deg, var(--sidebar-bg-top), var(--sidebar-bg-bottom) 75%);
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px; border-bottom:1px solid var(--sidebar-line); margin-bottom:18px;}
.brand-mark{width:42px;height:42px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));background:#fff;border-radius:50%;}
.brand-text b{display:block; font-family:var(--font-display); font-size:16.5px; font-weight:600; color:#fff; line-height:1.15; letter-spacing:.01em;}
.brand-text span{display:block; font-size:10.5px; color:var(--sidebar-text-dim); margin-top:2px; letter-spacing:.03em; text-transform:uppercase;}

.route{position:relative; padding-left:6px;}
.route::before{content:""; position:absolute; left:19px; top:8px; bottom:8px; width:1.5px; background:var(--sidebar-line);}
.wp{
  position:relative; display:flex; align-items:flex-start; gap:12px; width:100%;
  background:transparent; border:none; text-align:left; cursor:pointer;
  padding:9px 10px; border-radius:12px; margin:1px 0; color:var(--sidebar-text);
  font-size:13.6px; font-weight:600; line-height:1.35; transition:background .15s ease, color .15s ease;
}
.wp:hover{background:rgba(255,255,255,.07); color:#fff;}
.wp .wp-dot{
  position:relative; z-index:1; flex:0 0 auto; width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,.06); border:1.5px solid var(--sidebar-line); display:flex; align-items:center; justify-content:center;
  font-size:13px; margin-top:1px;
}
.wp.active{background:var(--primary); color:#fff; box-shadow:0 10px 24px -12px rgba(108,92,224,.7);}
.wp.active .wp-dot{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.4);}
.wp small{display:block; font-weight:500; font-size:11px; opacity:.75; margin-top:1px;}
.wp-quiz{margin-top:16px; padding-top:16px; border-top:1px solid var(--sidebar-line);}
.wp-quiz .wp-dot{background:rgba(255,255,255,.06); border-color:var(--sidebar-line);}
.wp-quiz.active .wp-dot{background:rgba(255,255,255,.18);}

.mobile-bar{display:none;}

.content{padding:44px 48px 90px; min-width:0;}
.content-inner{max-width:760px; margin:0 auto; animation:rise .38s cubic-bezier(.2,.8,.2,1);}
@keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.kicker{font-family:var(--font-mono); font-size:11.5px; color:var(--primary); letter-spacing:.03em; margin-bottom:10px;}
h1.page-title{font-family:var(--font-display); font-weight:600; font-size:clamp(26px,3.6vw,36px); margin:0 0 12px; letter-spacing:-.2px; color:var(--ink);}
p.lede{color:var(--ink-soft); font-size:16px; line-height:1.68; margin:0 0 30px; max-width:640px;}

/* ================= GENERIC CARD ================= */
.glass{
  background:var(--glass); backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-line); border-radius:var(--radius); box-shadow:var(--shadow);
}
.block{margin:0 0 30px;}
.block:last-child{margin-bottom:0;}
.block-h{display:flex; align-items:baseline; gap:10px; font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--ink); margin:0 0 13px;}
.block-h .idx{font-family:var(--font-mono); font-size:11.5px; font-weight:500; color:var(--ink-faint);}
.block p{font-size:15px; line-height:1.7; color:var(--ink-soft); margin:0 0 10px;}
.block p:last-child{margin-bottom:0;}
.block p b, .block p strong{color:var(--ink); font-weight:650;}

.term-card{
  padding:20px 22px; margin:10px 0; border-radius:16px;
  background:linear-gradient(160deg, rgba(255,255,255,.85), rgba(234,237,251,.65));
  border:1px solid var(--glass-line); box-shadow:var(--shadow-sm);
}
.term-card .lab{font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--primary); margin-bottom:8px;}
.term-card p{font-family:var(--font-display); font-size:17.5px; font-weight:500; line-height:1.5; color:var(--ink); font-style:italic;}

.callout{padding:18px 20px; border-radius:16px; margin:12px 0; border:1px solid var(--amber-soft); background:var(--amber-soft);}
.callout .lab{font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
.callout p{color:var(--ink); font-size:14.5px; margin:0;}

/* ================= PLACE PAIR ================= */
.place-pair{display:flex; align-items:center; gap:14px; margin:18px 0 22px; flex-wrap:wrap;}
.place-box{flex:1; min-width:190px; padding:18px 20px; border-radius:16px; text-align:center;}
.place-box.origin{background:var(--push-soft); border:1px solid #e7e9f0;}
.place-box.dest{background:var(--pull-soft); border:1px solid #c7e6da;}
.place-box .lab{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px;}
.place-box.origin .lab{color:var(--push);}
.place-box.dest .lab{color:var(--pull);}
.place-box .val{font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink);}
.place-arrow{flex:0 0 auto; font-size:22px; color:var(--ink-faint);}

/* ================= STAT ROW ================= */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0;}
.stat-pill{padding:16px 16px; border-radius:16px; background:var(--glass); border:1px solid var(--glass-line); text-align:center;}
.stat-pill .num{font-family:var(--font-mono); font-size:22px; font-weight:600; color:var(--primary);}
.stat-pill .lab{font-size:12px; color:var(--ink-soft); margin-top:3px;}

/* ================= BAR CHART ================= */
.bars{display:flex; flex-direction:column; gap:12px; margin:16px 0;}
.bar-row{display:grid; grid-template-columns:118px 1fr 68px; align-items:center; gap:10px;}
.bar-row .name{font-size:13.5px; font-weight:600; color:var(--ink);}
.bar-track{height:12px; background:var(--paper-tint); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--primary-dim), var(--primary));}
.bar-row .val{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); text-align:right;}

/* ================= TABLE ================= */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--paper); margin:14px 0;}
table.data{width:100%; border-collapse:collapse; min-width:460px; font-size:13.5px;}
table.data th{text-align:left; background:var(--paper-tint); color:var(--ink-soft); font-size:10.8px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.data td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.5; color:var(--ink-soft);}
table.data tr:last-child td{border-bottom:none;}
table.data td.n{font-weight:650; color:var(--ink); white-space:nowrap;}

/* ================= CHIPS ================= */
.chipset{display:flex; flex-wrap:wrap; gap:7px;}
.chip{background:var(--paper-tint); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.chip.push{background:var(--push-soft); border-color:#e7e9f0; color:var(--push);}
.chip.pull{background:var(--pull-soft); border-color:#c7e6da; color:var(--pull);}

/* ================= TUG OF WAR ================= */
.tug{position:relative; display:flex; border-radius:20px; overflow:hidden; border:1px solid var(--glass-line); box-shadow:var(--shadow); margin:20px 0;}
.tug-side{flex:1; padding:24px 22px 22px; min-width:0;}
.tug-side.push-side{background:linear-gradient(165deg, #ffffff, var(--push-soft));}
.tug-side.pull-side{background:linear-gradient(165deg, #ecf8f1, var(--pull-soft));}
.tug-side h4{margin:0 0 4px; font-family:var(--font-display); font-size:18px; font-weight:600;}
.tug-side.push-side h4{color:var(--push);}
.tug-side.pull-side h4{color:var(--pull);}
.tug-side .cap{font-size:12px; color:var(--ink-soft); margin-bottom:14px;}
.tug-badge{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2;
  width:74px; height:74px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:22px; box-shadow:0 14px 30px -12px rgba(22,27,34,.55); border:4px solid var(--paper);}
@media (max-width:640px){.tug{flex-direction:column;} .tug-badge{position:static; transform:none; margin:-14px auto; }}

/* ================= LEDGER ================= */
.ledger{display:flex; flex-direction:column; gap:10px; margin:14px 0;}
.ledger-row{display:flex; gap:12px; align-items:flex-start; padding:13px 15px; border-radius:14px; background:var(--paper); border:1px solid var(--line);}
.ledger-badge{flex:0 0 auto; width:24px; height:24px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; margin-top:1px;}
.ledger-row.pos .ledger-badge{background:var(--pull-soft); color:var(--pull);}
.ledger-row.neg .ledger-badge{background:var(--push-soft); color:var(--push);}
.ledger-row p{margin:0; font-size:14px; line-height:1.55; color:var(--ink-soft);}
.ledger-row b{color:var(--ink);}
.ledger-heading{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin:22px 0 8px; color:var(--ink-faint);}
.ledger-heading:first-child{margin-top:0;}
.ledger-heading.pos{color:var(--pull);}
.ledger-heading.neg{color:var(--push);}

/* ================= TREE ================= */
.tree{margin:18px 0;}
.tree-root{display:inline-block; padding:11px 20px; border-radius:12px; background:var(--primary); color:#fff; font-family:var(--font-display); font-weight:600; font-size:15px; margin-bottom:4px;}
.tree-kids{position:relative; padding-left:26px; margin-top:6px; border-left:1.5px solid var(--line);}
.tree-kid{position:relative; margin:14px 0 14px 14px; padding:14px 16px; border-radius:14px; background:var(--paper); border:1px solid var(--line);}
.tree-kid::before{content:""; position:absolute; left:-14px; top:18px; width:14px; height:1.5px; background:var(--line);}
.tree-kid h5{margin:0 0 5px; font-size:14.5px; font-weight:700; color:var(--ink);}
.tree-kid p{margin:0; font-size:13.3px; color:var(--ink-soft); line-height:1.55;}

/* ================= FLOW (arrow chips) ================= */
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:16px 0;}
.flow-chip{padding:10px 15px; border-radius:12px; background:var(--paper); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink);}
.flow-chip.warn{background:var(--push-soft); border-color:#e7e9f0; color:var(--push);}
.flow-chip.good{background:var(--pull-soft); border-color:#c7e6da; color:var(--pull);}
.flow-arrow{color:var(--ink-faint); font-size:15px;}

/* ================= TIMELINE (true sequence) ================= */
.timeline{position:relative; margin:20px 0; padding-left:8px;}
.tl-step{position:relative; padding-left:44px; padding-bottom:26px;}
.tl-step:last-child{padding-bottom:0;}
.tl-step::before{content:""; position:absolute; left:15px; top:30px; bottom:-4px; width:1.5px; background:var(--line);}
.tl-step:last-child::before{display:none;}
.tl-num{position:absolute; left:0; top:0; width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:13px;}
.tl-step h5{margin:2px 0 6px; font-family:var(--font-display); font-size:16.5px; font-weight:600; color:var(--ink);}
.tl-step .chipset{margin-top:8px;}

/* ================= FLASHCARDS (glossary) ================= */
.flip-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin:16px 0;}
.flip-card{perspective:1200px; height:130px; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; padding:16px; display:flex; flex-direction:column; justify-content:center; border:1px solid var(--glass-line); box-shadow:var(--shadow-sm);}
.flip-front{background:linear-gradient(160deg,#fff,var(--primary-soft));}
.flip-front .t{font-family:var(--font-display); font-weight:600; font-size:16.5px; color:var(--ink);}
.flip-front .hint{margin-top:8px; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
.flip-back{background:var(--ink); color:#fff; transform:rotateY(180deg);}
.flip-back p{margin:0; font-size:12.6px; line-height:1.5; color:#dfe3ee;}

/* ================= RADIAL MIND MAP ================= */
.radial{position:relative; width:100%; max-width:540px; aspect-ratio:1/1; margin:34px auto 22px;}
.radial-ring{position:absolute; inset:16%; border:1.5px dashed var(--line); border-radius:50%;}
.radial-hub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:148px; height:148px; border-radius:50%;
  background:linear-gradient(160deg, var(--primary), #222d63); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:var(--font-display); font-size:18.5px; font-weight:600; box-shadow:0 22px 42px -18px rgba(30,41,70,.55); padding:8px; z-index:2;}
.radial-node{position:absolute; width:184px; transform:translate(-50%,-50%); z-index:1;}
.radial-node .card{background:var(--glass); backdrop-filter:blur(16px) saturate(160%); border:1px solid var(--glass-line); border-radius:16px; padding:13px 15px; box-shadow:var(--shadow-sm);}
.radial-node .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px;}
.radial-node h5{display:flex; align-items:center; margin:0 0 8px; font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--ink);}
.radial-node .chipset{gap:5px;}
.radial-node .chip{font-size:10.8px; padding:3px 9px;}
.radial-sub{font-size:9.6px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:8px 0 4px;}
.radial-sub:first-of-type{margin-top:0;}
@media (max-width:760px){
  .radial{max-width:none; height:auto; aspect-ratio:auto;}
  .radial-ring{display:none;}
  .radial-hub{position:static; transform:none; margin:0 auto 14px; width:100%; max-width:220px; border-radius:20px; height:auto; padding:16px;}
  .radial-node{position:static; width:100%; transform:none; margin-bottom:12px;}
}

/* ================= FINAL NOTE ================= */
.finale{background:linear-gradient(165deg, var(--ink), #232c3d); border-radius:20px; padding:26px 28px; margin-top:10px; color:#fff;}
.finale b{display:block; font-family:var(--font-display); font-size:18px; font-weight:600; margin-bottom:6px;}
.finale span{font-size:13.5px; color:#b7bfcf; line-height:1.6;}
.chain{font-family:var(--font-display); font-style:italic; font-size:15.5px; color:var(--ink); border-left:3px solid var(--amber); padding-left:16px; margin:14px 0;}

/* ================= QUIZ ================= */
.quiz-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
.qz-progress{display:flex; gap:5px; flex:1; min-width:160px;}
.qz-progress span{flex:1; height:4px; border-radius:4px; background:var(--line);}
.qz-progress span.done{background:var(--pull);}
.qz-progress span.current{background:var(--primary);}
.qz-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.qz-card{padding:32px 30px 28px;}
.qz-text{font-family:var(--font-display); font-weight:600; font-size:clamp(19px,2.6vw,23px); margin:0 0 20px; line-height:1.4; color:var(--ink);}
.qz-choice{display:block; width:100%; text-align:left; background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; font-size:15px; color:var(--ink); transition:all .16s ease; font-family:inherit;}
.qz-choice:hover:not(:disabled){border-color:var(--primary);}
.qz-choice:disabled{cursor:default;}
.qz-choice .let{font-family:var(--font-mono); font-weight:700; color:var(--primary); margin-right:10px;}
.qz-choice.correct{background:var(--pull-soft); border-color:var(--pull);}
.qz-choice.correct .let{color:var(--pull);}
.qz-choice.wrong{background:var(--push-soft); border-color:var(--push);}
.qz-choice.wrong .let{color:var(--push);}
.qz-feedback{margin-top:6px; padding:13px 16px; border-radius:12px; font-size:14.5px; font-weight:600;}
.qz-feedback.ok{background:var(--pull-soft); color:var(--pull);}
.qz-feedback.no{background:var(--push-soft); color:var(--push);}
.qz-btnrow{display:flex; gap:12px; flex-wrap:wrap; margin-top:22px;}
.btn{display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-weight:650; font-size:14.5px; padding:12px 22px; border-radius:12px; transition:transform .15s ease, box-shadow .15s ease;}
.btn-primary{background:linear-gradient(155deg, var(--primary-dim), var(--primary)); color:#fff; box-shadow:0 12px 24px -12px rgba(51,65,143,.65);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
.btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}
.qz-mastery{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:22px 0;}
.qz-stat{background:var(--paper-tint); border:1px solid var(--line); border-radius:14px; padding:18px;}
.qz-stat .num{font-family:var(--font-display); font-size:30px; font-weight:600; color:var(--ink);}
.qz-stat .lab{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
.qz-badge{display:inline-flex; align-items:center; gap:7px; background:var(--primary); color:#fff; font-weight:700; font-size:13px; padding:8px 16px; border-radius:999px; margin-top:4px;}
.qz-review{list-style:none; padding:0; margin:18px 0; display:flex; flex-direction:column; gap:10px;}
.qz-review li{font-size:14px; color:var(--ink); display:flex; gap:9px; align-items:flex-start; line-height:1.5;}
.qz-review li .ic{flex:0 0 auto; font-weight:700;}
.qz-review li.ok .ic{color:var(--pull);}
.qz-review li.bad .ic{color:var(--push);}
.qz-review li b{color:var(--ink);}
.qz-intro-icon{font-size:38px; margin-bottom:12px;}

@media (max-width:960px){
  .shell{grid-template-columns:1fr;}
  .rail{position:fixed; inset:0 20% 0 0; transform:translateX(-100%); transition:transform .25s ease; z-index:40; box-shadow:0 0 60px rgba(0,0,0,.25);}
  .shell.rail-open .rail{transform:translateX(0);}
  .shell.rail-open::after{content:""; position:fixed; inset:0; background:rgba(20,24,34,.35); z-index:30;}
  .mobile-bar{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--glass-strong); backdrop-filter:blur(20px); position:sticky; top:0; z-index:20;}
  .mobile-bar button{background:var(--paper); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; font-size:16px; cursor:pointer;}
  .mobile-bar b{font-family:var(--font-display); font-size:15.5px;}
  .content{padding:26px 18px 70px;}
}
@media (max-width:640px){
  .qz-card{padding:24px 20px 22px;}
}

/* ================= DEVANAGARI ADJUSTMENTS ================= */
:root{color-scheme:light;}
.kicker,.lab,.hint,.radial-sub,.ledger-heading,table.data th,.brand-text span,.qz-count{letter-spacing:0 !important; text-transform:none !important;}
.block p{line-height:1.85;}
p.lede{line-height:1.8;}
.term-card p{font-style:normal; line-height:1.65;}
.chain{font-style:normal; line-height:1.75;}
.tree-kid p,.ledger-row p,table.data td{line-height:1.7;}
.flip-card{height:140px;}
.flip-back p{font-size:14px;}
.radial-node .card h5:last-child{margin-bottom:0;}
.radial-node{width:150px;}
.stat-pill .num{font-size:20px;}
.place-box .val{font-size:17px; line-height:1.5;}
.tl-step p{margin:0 0 6px;}
.flow-chip{line-height:1.45;}
.kicker{font-size:13px;}
.term-card .lab,.callout .lab,.place-box .lab{font-size:12.5px;}
.brand-text span{font-size:11.5px; line-height:1.4;}
.wp small{font-size:12px; line-height:1.45;}
.block-h .idx{font-size:13px;}
.stat-pill .lab{font-size:13.5px; line-height:1.6;}
.chip{font-size:13.5px;}
.ledger-heading{font-size:13px;}
table.data th{font-size:12.5px;}
.flip-front .hint{font-size:12px;}
.qz-count{font-size:13px;}
.callout p{font-size:15px; line-height:1.75;}
@media (min-width:641px){.tug-side.pull-side{padding-left:50px;} .tug-side.push-side{padding-right:50px;}}
</style>
</head>

<script>
/* =========================================================

function kn(n){ return String(n); }

var BN = 0;
function bh(title){
  BN++;
  return '<div class="block"><div class="block-h"><span class="idx">'+kn(BN<10?'0'+BN:BN)+'</span>'+title+'</div>';
}
function chips(arr, cls){
  cls = cls || '';
  return '<div class="chipset">' + arr.map(function(c){ return '<span class="chip '+cls+'">'+c+'</span>'; }).join('') + '</div>';
}
function ledgerRows(items, kind, mark){
  return items.map(function(it){
    var m = it.m || mark || (kind==='pos'?'+':'−');
    return '<div class="ledger-row '+kind+'"><div class="ledger-badge">'+m+'</div>'+
      '<p><b>'+it.t+'</b> — '+it.d+'</p></div>';
  }).join('');
}
function flipGrid(terms){
  return '<div class="flip-grid">' + terms.map(function(t){
    return '<div class="flip-card" tabindex="0" role="button"><div class="flip-inner">'+
      '<div class="flip-face flip-front"><div class="t">'+t.term+'</div><div class="hint">अर्थ देखने के लिए दबाएँ</div></div>'+
      '<div class="flip-face flip-back"><p>'+t.def+'</p></div>'+
      '</div></div>';
  }).join('') + '</div>';
}
function pill(title, text){
  return '<div class="stat-pill" style="text-align:left;padding:16px 18px;"><div class="lab" style="font-weight:700;color:var(--ink);">'+title+'</div><div class="lab" style="margin-top:4px;">'+text+'</div></div>';
}
function flow(items){
  return '<div class="flow">' + items.map(function(it, i){
    var cls = typeof it === 'string' ? '' : it.c;
    var txt = typeof it === 'string' ? it : it.t;
    return (i ? '<span class="flow-arrow">→</span>' : '') + '<span class="flow-chip '+cls+'">'+txt+'</span>';
  }).join('') + '</div>';
}
function radialMap(hub, nodes){
  var html = '<div class="radial"><div class="radial-ring"></div><div class="radial-hub">'+hub+'</div>';
  var n = nodes.length;
  nodes.forEach(function(nd, i){
    var a = (2*Math.PI*i)/n;
    var x = Math.round(Math.sin(a)*190), y = Math.round(-Math.cos(a)*190);
    html += '<div class="radial-node" style="left:calc(50% + '+x+'px); top:calc(50% + '+y+'px);">'+
      '<div class="card"><h5><span class="dot" style="background:'+nd.color+'"></span>'+nd.label+'</h5>'+(nd.body||'')+'</div></div>';
  });
  return html + '</div>';
}
function verse(label, lines){
  return '<div class="term-card"><div class="lab">'+label+'</div><p>'+lines.join('<br>')+'</p></div>';
}
function qa(q, a){ return '<tr><td class="n" style="white-space:normal">'+q+'</td><td>'+a+'</td></tr>'; }
function ctx(t, d){ return '<div class="tree-kid"><h5>'+t+'</h5><p>'+d+'</p></div>'; }

function longAns(q,a){ return '<div class="term-card"><div class="lab">'+q+'</div><p style="font-size:15px;">'+a+'</p></div>'; }

      '<p>पिता और रामेश्वरम् मंदिर के पुजारी पक्षी लक्ष्मण शास्त्री की गहरी मित्रता से कलाम ने धार्मिक सहिष्णुता सीखी। उनके मित्र रामानंद शास्त्री, अरविंदन और शिवप्रकाश हिंदू परिवारों से थे, फिर भी कभी भेदभाव नहीं हुआ। जलालुद्दीन ने उन्हें दुनिया के ज्ञान से परिचित कराया और शम्सुद्दीन के अखबारों से बाहरी दुनिया की खबरें मिलीं।</p>'+
      '<div class="finale"><b>साधारण बचपन, असाधारण संस्कार।</b><span>सादगी, अनुशासन, धार्मिक सहिष्णुता, मित्रता और ज्ञान की जिज्ञासा — यही कलाम के महान व्यक्तित्व की नींव बने।</span></div>'+
    '</div>'
};

var SECTION_ORDER = ['intro','vyakhya','sandesh','shabd','lekhak','abhyas','bhasha','aage','reference'];

var quizQs = [
  {q:'“मेरा बचपन” किसकी आत्मकथात्मक रचना है?', opts:['महात्मा गांधी','डॉ. ए.पी.जे. अब्दुल कलाम','डॉ. राजेंद्र प्रसाद','प्रेमचंद'], correct:1},
  {q:'अब्दुल कलाम का जन्म कहाँ हुआ था?', opts:['मदुरै','रामेश्वरम्','चेन्नई','धनुषकोडि'], correct:1},
  {q:'कलाम के पिता का नाम क्या था?', opts:['जैनुलाबदीन','शम्सुद्दीन','जलालुद्दीन','माणिकम'], correct:0},
  {q:'कलाम की माँ भोजन किस पर परोसती थीं?', opts:['थाली में','केले के पत्ते पर','कटोरे में','पत्तल पर'], correct:1},
  {q:'रामेश्वरम् मंदिर के प्रमुख पुजारी कौन थे?', opts:['रामानंद शास्त्री','पक्षी लक्ष्मण शास्त्री','शिवप्रकाश','अरविंदन'], correct:1},
  {q:'कलाम के पिता नमाज़ कितने बजे पढ़ते थे?', opts:['सुबह चार बजे','सुबह छह बजे','दोपहर बारह बजे','शाम छह बजे'], correct:0},
  {q:'पिता की नावें तीर्थयात्रियों को कहाँ तक ले जाती थीं?', opts:['पाम्बन तक','धनुषकोडि तक','श्रीलंका तक','मद्रास तक'], correct:1},
  {q:'तूफ़ान में कौन-सा पुल टूट गया था?', opts:['हावड़ा पुल','पाम्बन पुल','सेतुक्करई पुल','धनुषकोडि पुल'], correct:1},
  {q:'अहमद जलालुद्दीन कलाम को किस नाम से पुकारते थे?', opts:['आज़ाद','अब्दुल','कलाम','मुन्ना'], correct:0},
  {q:'जलालुद्दीन का विवाह किससे हुआ?', opts:['कलाम की चचेरी बहन से','कलाम की बड़ी बहन ज़ोहरा से','माणिकम की बेटी से','किसी से नहीं'], correct:1},
  {q:'कलाम के बचपन में दुर्लभ वस्तु क्या थी?', opts:['खिलौने','पुस्तकें','कपड़े','नावें'], correct:1},
  {q:'निजी पुस्तकालय किसका था?', opts:['शम्सुद्दीन','एस.टी.आर. माणिकम','जलालुद्दीन','लक्ष्मण शास्त्री'], correct:1},
  {q:'शम्सुद्दीन क्या काम करते थे?', opts:['नाव बनाते थे','अखबारों का वितरण करते थे','पुजारी थे','अध्यापक थे'], correct:1},
  {q:'निम्न में कौन कलाम का पक्का दोस्त नहीं था?', opts:['रामानंद शास्त्री','अरविंदन','शिवप्रकाश','शम्सुद्दीन'], correct:3},
  {q:'“पौ फटना” का अर्थ है:', opts:['रात होना','प्रभात होना','बारिश होना','थक जाना'], correct:1},
  {q:'“भेजना” का प्रेरणार्थक रूप है:', opts:['भेजाना','भिजवाना','भेजता','भेजकर'], correct:1}
];

var quizIndex = 0, quizScore = 0, quizAnswers = new Array(quizQs.length).fill(null);
var letters = ['क','ख','ग','घ'];

function renderQuizQuestion(){
  var i = quizIndex, item = quizQs[i];
  var answered = quizAnswers[i] !== null;
  var progress = quizQs.map(function(_,idx){
    var cls = ''; if(idx < i) cls='done'; else if(idx===i) cls='current';
    return '<span class="'+cls+'"></span>';
  }).join('');
  var optsHTML = item.opts.map(function(opt, idx){
    var cls = 'qz-choice';
    if(answered){
      if(idx === item.correct) cls += ' correct';
      else if(idx === quizAnswers[i] && idx !== item.correct) cls += ' wrong';
    }
    return '<button class="'+cls+'" data-idx="'+idx+'" '+(answered?'disabled':'')+'><span class="let">'+letters[idx]+'</span>'+opt+'</button>';
  }).join('');
  var fb = answered ? (quizAnswers[i]===item.correct
    ? '<div class="qz-feedback ok">✓ सही उत्तर — शाबाश!</div>'
    : '<div class="qz-feedback no">✗ गलत। सही उत्तर: <b>'+letters[item.correct]+'. '+item.opts[item.correct]+'</b></div>') : '';
  var html =
    '<div class="kicker">अपनी परख कीजिए</div>'+
    '<div class="quiz-head"><div class="qz-progress">'+progress+'</div><div class="qz-count">प्रश्न '+kn(i+1)+' / '+kn(quizQs.length)+'</div></div>'+
    '<div class="glass qz-card">'+
      '<div class="qz-text">'+item.q+'</div>'+
      optsHTML+fb+
      '<div class="qz-btnrow">'+
        '<button class="btn btn-ghost" id="qPrev" '+(i===0?'disabled':'')+'>&larr; पिछला</button>'+
        '<button class="btn btn-primary" id="qNext" '+(answered?'':'disabled')+'>'+(i===quizQs.length-1?'परिणाम देखें':'अगला')+' &rarr;</button>'+
      '</div>'+
    '</div>';
  content.innerHTML = html;
  document.querySelectorAll('.qz-choice').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(quizAnswers[i] !== null) return;
      var idx = parseInt(btn.getAttribute('data-idx'));
      quizAnswers[i] = idx;
      if(idx === item.correct) quizScore++;
      renderQuizQuestion();
    });
  });
  document.getElementById('qPrev').addEventListener('click', function(){ quizIndex--; renderQuizQuestion(); });
  document.getElementById('qNext').addEventListener('click', function(){
    if(i === quizQs.length-1){ renderQuizResults(); } else { quizIndex++; renderQuizQuestion(); }
  });
}

function renderQuizResults(){
  var pct = Math.round((quizScore/quizQs.length)*100);
  var status = 'और अभ्यास कीजिए';
  if(pct >= 90) status = 'उत्कृष्ट!';
  else if(pct >= 70) status = 'अच्छी समझ';
  else if(pct >= 50) status = 'अच्छी शुरुआत';
  var review = quizQs.map(function(item, idx){
    var correct = quizAnswers[idx] === item.correct;
    return '<li class="'+(correct?'ok':'bad')+'"><span class="ic">'+(correct?'✓':'✗')+'</span><span><b>'+kn(idx+1)+'. '+item.q+'</b><br>सही उत्तर: '+letters[item.correct]+'. '+item.opts[item.correct]+'</span></li>';
  }).join('');
  var html =
    '<div class="kicker">परिणाम</div>'+
    '<h1 class="page-title">आपके अंक '+kn(quizScore)+' / '+kn(quizQs.length)+'</h1>'+
    '<p class="lede">“मेरा बचपन” प्रश्नोत्तरी में आपका प्रदर्शन यह रहा।</p>'+
    '<div class="qz-mastery"><div class="qz-stat"><div class="num">'+kn(pct)+'%</div><div class="lab">सटीकता</div></div>'+
    '<div class="qz-stat"><div class="num">'+kn(quizScore)+'</div><div class="lab">सही उत्तर</div><span class="qz-badge">'+status+'</span></div></div>'+
    '<ul class="qz-review">'+review+'</ul>'+
    '<div class="chain">साधारण बचपन, असाधारण संस्कार।</div>'+
    '<div class="qz-btnrow"><button class="btn btn-ghost" id="retakeBtn">↺ फिर से प्रयास करें</button><button class="btn btn-primary" id="toRefBtn">परीक्षा की तैयारी देखें &rarr;</button></div>';
  content.innerHTML = html;
  document.getElementById('retakeBtn').addEventListener('click', function(){
    quizIndex=0; quizScore=0; quizAnswers = new Array(quizQs.length).fill(null); renderQuizQuestion();
  });
  document.getElementById('toRefBtn').addEventListener('click', function(){ setSection('reference'); });
}

function renderQuizIntro(){
  quizIndex=0; quizScore=0; quizAnswers = new Array(quizQs.length).fill(null);
  renderQuizQuestion();
}

/* ---------------- NAV / RENDER ---------------- */
var content = document.getElementById('content');
var currentSection = 'intro';

function buildNav(){
  var nav = document.getElementById('routeNav');
  var html = '';
  SECTION_ORDER.forEach(function(id){
    var s = SECTIONS[id];
    html += '<button class="wp" data-sec="'+id+'"><span class="wp-dot">'+s.icon+'</span><span>'+s.label+'<small>'+s.sub+'</small></span></button>';
  });
  html += '<button class="wp wp-quiz" data-sec="quiz"><span class="wp-dot">🧠</span><span>प्रश्नोत्तरी<small>'+kn(quizQs.length)+' प्रश्न, तुरंत उत्तर</small></span></button>';
  nav.innerHTML = html;
  nav.querySelectorAll('.wp').forEach(function(btn){
    btn.addEventListener('click', function(){ setSection(btn.getAttribute('data-sec')); });
  });
}

function setSection(id){
  currentSection = id;
  document.querySelectorAll('.wp').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-sec')===id); });
  if(id === 'quiz'){
    renderQuizIntro();
  } else {
    var s = SECTIONS[id];
    BN = 0;
    content.innerHTML =
      '<div class="kicker">'+s.kicker+'</div>'+
      '<h1 class="page-title">'+s.label+'</h1>'+
      s.html;
    content.querySelectorAll('.block-h .idx').forEach(function(el,k){ el.textContent = (k+1<10?'0':'')+(k+1); });
  }
  window.scrollTo(0,0);
  document.getElementById('shell').classList.remove('rail-open');
}

document.addEventListener('click', function(e){
  var card = e.target.closest('.flip-card');
  if(card) card.classList.toggle('flipped');
});
document.addEventListener('keydown', function(e){
  if((e.key==='Enter' || e.key===' ') && e.target.classList && e.target.classList.contains('flip-card')){
    e.preventDefault(); e.target.classList.toggle('flipped');
  }
});
document.getElementById('railToggle').addEventListener('click', function(){
  document.getElementById('shell').classList.toggle('rail-open');
});
document.getElementById('shell').addEventListener('click', function(e){
  if(e.target.id === 'shell') document.getElementById('shell').classList.remove('rail-open');
});

buildNav();
setSection('intro');

</script>
</body>
</html>
