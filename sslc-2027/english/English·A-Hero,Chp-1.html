<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>English: A Hero by R. K. Narayan, Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --paper-tint:#eceff9; --ink:#181c2a; --ink-soft:#5b6178; --ink-faint:#8c92a8; --line:#e2e5f2;
  --primary:#6c5ce0; --primary-dim:#8778e8; --primary-soft:#ece9fb;
  --push:#1f2937; --push-soft:#c6c9d1; --pull:#1d7f63; --pull-soft:#e1f3ec; --amber:#1f2937; --amber-soft:#c6c9d1;
  --glass:rgba(255,255,255,.7); --glass-strong:rgba(255,255,255,.9); --glass-line:rgba(255,255,255,.85);
  --sidebar-bg-top:#252c40; --sidebar-bg-bottom:#161b29; --sidebar-line:rgba(255,255,255,.08); --sidebar-text:#c6cbdd; --sidebar-text-dim:#7d84a0;
  --shadow:0 26px 60px -34px rgba(30,32,70,.38),0 3px 10px rgba(30,32,70,.07); --shadow-sm:0 10px 24px -16px rgba(30,32,70,.3);
  --radius:22px; --font-display:'Newsreader',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font-body);color:var(--ink);
  background:radial-gradient(900px 520px at 90% -8%,rgba(108,92,224,.10),transparent 60%),radial-gradient(760px 460px at -6% 18%,rgba(108,92,224,.06),transparent 55%),radial-gradient(680px 420px at 30% 112%,rgba(29,127,99,.06),transparent 55%),var(--paper-tint);
  -webkit-font-smoothing:antialiased;min-height:100vh;}
button{font-family:inherit;}
::selection{background:var(--primary-soft);}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:26px 18px;border-right:1px solid var(--sidebar-line);background:linear-gradient(190deg,var(--sidebar-bg-top),var(--sidebar-bg-bottom) 75%);}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;border-bottom:1px solid var(--sidebar-line);margin-bottom:18px;}
.brand-mark{width:42px;height:42px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));background:#fff;border-radius:50%;}
.brand-fallback{width:42px;height:42px;flex:0 0 auto;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:16px;}
.brand-text b{display:block;font-family:var(--font-display);font-size:16.5px;font-weight:600;color:#fff;line-height:1.15;letter-spacing:.01em;}
.brand-text span{display:block;font-size:10.5px;color:var(--sidebar-text-dim);margin-top:2px;letter-spacing:.03em;text-transform:uppercase;}
.route{position:relative;padding-left:6px;}
.route::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:1.5px;background:var(--sidebar-line);}
.wp{position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;background:transparent;border:none;text-align:left;cursor:pointer;padding:9px 10px;border-radius:12px;margin:1px 0;color:var(--sidebar-text);font-size:13.6px;font-weight:600;line-height:1.35;transition:background .15s,color .15s;}
.wp:hover{background:rgba(255,255,255,.07);color:#fff;}
.wp .wp-dot{position:relative;z-index:1;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);border:1.5px solid var(--sidebar-line);display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px;}
.wp.active{background:var(--primary);color:#fff;box-shadow:0 10px 24px -12px rgba(108,92,224,.7);}
.wp.active .wp-dot{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);}
.wp small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:1px;}
.wp-quiz{margin-top:16px;padding-top:16px;border-top:1px solid var(--sidebar-line);border-radius:0 0 12px 12px;}
.mobile-bar{display:none;}
.content{padding:44px 48px 90px;min-width:0;}
.content-inner{max-width:760px;margin:0 auto;animation:rise .38s cubic-bezier(.2,.8,.2,1);}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.kicker{font-family:var(--font-mono);font-size:11.5px;color:var(--primary);letter-spacing:.03em;margin-bottom:10px;}
h1.page-title{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.6vw,36px);margin:0 0 12px;letter-spacing:-.2px;}
p.lede{color:var(--ink-soft);font-size:16px;line-height:1.68;margin:0 0 30px;max-width:640px;}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-line);border-radius:var(--radius);box-shadow:var(--shadow);}
.block{margin:0 0 30px;}
.block-h{display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 13px;}
.block-h .idx{font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--ink-faint);}
.block p{font-size:15px;line-height:1.7;color:var(--ink-soft);margin:0 0 10px;}
.block p b{color:var(--ink);font-weight:650;}
.term-card{padding:20px 22px;margin:10px 0;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(234,237,251,.65));border:1px solid var(--glass-line);box-shadow:var(--shadow-sm);}
.term-card .lab{font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--primary);margin-bottom:8px;}
.term-card p{font-family:var(--font-display);font-size:17.5px;font-weight:500;line-height:1.5;color:var(--ink);font-style:italic;margin:0;}
.callout{padding:18px 20px;border-radius:16px;margin:12px 0;border:1px solid var(--amber-soft);background:var(--amber-soft);}
.callout .lab{font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.callout p{color:var(--ink) !important;font-size:14.5px !important;margin:0 !important;}
.callout.extra{background:var(--primary-soft);border-color:#d9d3f7;}
.callout.extra .lab{color:var(--primary);}
.callout.extra p{color:var(--ink-soft) !important;}
.place-pair{display:flex;align-items:center;gap:14px;margin:18px 0 22px;flex-wrap:wrap;}
.place-box{flex:1;min-width:150px;padding:18px 20px;border-radius:16px;text-align:center;}
.place-box.origin{background:var(--push-soft);border:1px solid #e7e9f0;}
.place-box.dest{background:var(--pull-soft);border:1px solid #c7e6da;}
.place-box .lab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.place-box.origin .lab{color:var(--push);} .place-box.dest .lab{color:var(--pull);}
.place-box .val{font-family:var(--font-display);font-size:19px;font-weight:600;}
.place-arrow{flex:0 0 auto;font-size:18px;color:var(--ink-faint);}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0;}
.stat-pill{padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-line);text-align:center;}
.stat-pill .num{font-family:var(--font-mono);font-size:21px;font-weight:600;color:var(--primary);}
.stat-pill .lab{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.bars{display:flex;flex-direction:column;gap:12px;margin:16px 0;}
.bar-row{display:grid;grid-template-columns:118px 1fr 78px;align-items:center;gap:10px;}
.bar-row .name{font-size:13.5px;font-weight:600;}
.bar-track{height:12px;background:var(--paper-tint);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-dim),var(--primary));}
.bar-row .val{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);text-align:right;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--paper);margin:14px 0;}
table.data{width:100%;border-collapse:collapse;min-width:460px;font-size:13.5px;}
table.data th{text-align:left;background:var(--paper-tint);color:var(--ink-soft);font-size:10.8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.data td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;color:var(--ink-soft);}
table.data tr:last-child td{border-bottom:none;}
table.data td.n{font-weight:650;color:var(--ink);white-space:nowrap;}
.chipset{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--paper-tint);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.chip.push{background:var(--push-soft);border-color:#e7e9f0;color:var(--push);}
.chip.pull{background:var(--pull-soft);border-color:#c7e6da;color:var(--pull);}
.tug{position:relative;display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--glass-line);box-shadow:var(--shadow);margin:20px 0;}
.tug-side{flex:1;padding:24px 22px 22px;min-width:0;}
.tug-side.push-side{background:linear-gradient(165deg,#fff,var(--push-soft));}
.tug-side.pull-side{background:linear-gradient(165deg,#ecf8f1,var(--pull-soft));}
.tug-side h4{margin:0 0 4px;font-family:var(--font-display);font-size:18px;font-weight:600;}
.tug-side.push-side h4{color:var(--push);} .tug-side.pull-side h4{color:var(--pull);}
.tug-side .cap{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.tug-side p{font-size:14px !important;line-height:1.6 !important;margin:0 0 8px !important;color:var(--ink-soft);}
.tug-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;box-shadow:0 14px 30px -12px rgba(22,27,34,.55);border:4px solid var(--paper);}
@media (max-width:640px){.tug{flex-direction:column;}.tug-badge{position:static;transform:none;margin:-14px auto;}}
.ledger{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
.ledger-row{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:var(--paper);border:1px solid var(--line);}
.ledger-badge{flex:0 0 auto;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin-top:1px;}
.ledger-row.pos .ledger-badge{background:var(--pull-soft);color:var(--pull);}
.ledger-row.neg .ledger-badge{background:var(--push-soft);color:var(--push);}
.ledger-row p{margin:0 !important;font-size:14px !important;line-height:1.55 !important;color:var(--ink-soft);}
.ledger-row b{color:var(--ink);}
.tree{margin:18px 0;}
.tree-root{display:inline-block;padding:11px 20px;border-radius:12px;background:var(--primary);color:#fff;font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:4px;}
.tree-kids{position:relative;padding-left:26px;margin-top:6px;border-left:1.5px solid var(--line);}
.tree-kid{position:relative;margin:14px 0 14px 14px;padding:14px 16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);}
.tree-kid::before{content:"";position:absolute;left:-14px;top:18px;width:14px;height:1.5px;background:var(--line);}
.tree-kid h5{margin:0 0 5px;font-size:14.5px;font-weight:700;}
.tree-kid p{margin:0 !important;font-size:13.3px !important;color:var(--ink-soft);line-height:1.55 !important;}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0;}
.flow-chip{padding:10px 15px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);}
.flow-chip.warn{background:var(--push-soft);border-color:#e7e9f0;color:var(--push);}
.flow-chip.good{background:var(--pull-soft);border-color:#c7e6da;color:var(--pull);}
.flow-arrow{color:var(--ink-faint);font-size:15px;}
.timeline{position:relative;margin:20px 0;padding-left:8px;}
.tl-step{position:relative;padding-left:44px;padding-bottom:22px;}
.tl-step:last-child{padding-bottom:0;}
.tl-step::before{content:"";position:absolute;left:15px;top:30px;bottom:-4px;width:1.5px;background:var(--line);}
.tl-step:last-child::before{display:none;}
.tl-num{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;}
.tl-step h5{margin:2px 0 6px;font-family:var(--font-display);font-size:16.5px;font-weight:600;}
.tl-step p{font-size:14.6px !important;line-height:1.65 !important;color:var(--ink-soft);margin:0 !important;}
.flip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:16px 0;}
.flip-card{perspective:1200px;height:150px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--glass-line);box-shadow:var(--shadow-sm);}
.flip-front{background:linear-gradient(160deg,#fff,var(--primary-soft));}
.flip-front .t{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink);}
.flip-front .hint{margin-top:8px;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.flip-back{background:var(--ink);color:#fff;transform:rotateY(180deg);}
.flip-back p{margin:0;font-size:12.6px;line-height:1.5;color:#dfe3ee;}
.radial{position:relative;width:100%;max-width:540px;aspect-ratio:1/1;margin:34px auto 22px;}
.radial-ring{position:absolute;inset:16%;border:1.5px dashed var(--line);border-radius:50%;}
.radial-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:148px;height:148px;border-radius:50%;background:linear-gradient(160deg,var(--primary),#222d63);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--font-display);font-size:18.5px;font-weight:600;box-shadow:0 22px 42px -18px rgba(30,41,70,.55);padding:8px;z-index:2;}
.radial-node{position:absolute;width:184px;transform:translate(-50%,-50%);z-index:1;}
.radial-node .card{background:var(--glass);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glass-line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow-sm);}
.radial-node .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;}
.radial-node h5{display:flex;align-items:center;margin:0 0 8px;font-family:var(--font-display);font-size:14px;font-weight:600;}
.radial-node .chipset{gap:5px;}
.radial-node .chip{font-size:10.8px;padding:3px 9px;}
@media (max-width:760px){
  .radial{max-width:none;height:auto;aspect-ratio:auto;}
  .radial-ring{display:none;}
  .radial-hub{position:static;transform:none;margin:0 auto 14px;width:100%;max-width:220px;border-radius:20px;height:auto;padding:16px;}
  .radial-node{position:static;width:100%;transform:none;margin-bottom:12px;}
}
.finale{background:linear-gradient(165deg,var(--ink),#232c3d);border-radius:20px;padding:26px 28px;margin-top:10px;color:#fff;}
.finale b{display:block;font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:6px;}
.finale span{font-size:13.5px;color:#b7bfcf;line-height:1.6;}
.chain{font-family:var(--font-display);font-style:italic;font-size:15.5px;color:var(--ink);border-left:3px solid var(--amber);padding-left:16px;margin:14px 0;}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.qz-progress{display:flex;gap:3px;flex:1;min-width:160px;}
.qz-progress span{flex:1;height:4px;border-radius:4px;background:var(--line);}
.qz-progress span.done{background:var(--pull);} .qz-progress span.current{background:var(--primary);}
.qz-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}
.qz-card{padding:32px 30px 28px;}
.qz-text{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,2.6vw,23px);margin:0 0 20px;line-height:1.4;}
.qz-choice{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;color:var(--ink);transition:all .16s;font-family:inherit;}
.qz-choice:hover:not(:disabled){border-color:var(--primary);}
.qz-choice:disabled{cursor:default;}
.qz-choice .let{font-family:var(--font-mono);font-weight:700;color:var(--primary);margin-right:10px;}
.qz-choice.correct{background:var(--pull-soft);border-color:var(--pull);} .qz-choice.correct .let{color:var(--pull);}
.qz-choice.wrong{background:var(--push-soft);border-color:var(--push);} .qz-choice.wrong .let{color:var(--push);}
.qz-feedback{margin-top:6px;padding:13px 16px;border-radius:12px;font-size:14.5px;font-weight:600;}
.qz-feedback.ok{background:var(--pull-soft);color:var(--pull);} .qz-feedback.no{background:var(--push-soft);color:var(--push);}
.qz-btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-weight:650;font-size:14.5px;padding:12px 22px;border-radius:12px;transition:transform .15s;}
.btn-primary{background:linear-gradient(155deg,var(--primary-dim),var(--primary));color:#fff;box-shadow:0 12px 24px -12px rgba(51,65,143,.65);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
.qz-mastery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:22px 0;}
.qz-stat{background:var(--paper-tint);border:1px solid var(--line);border-radius:14px;padding:18px;}
.qz-stat .num{font-family:var(--font-display);font-size:30px;font-weight:600;}
.qz-stat .lab{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.qz-badge{display:inline-flex;background:var(--primary);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;margin-top:6px;}
.qz-review{list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:10px;}
.qz-review li{font-size:14px;display:flex;gap:9px;align-items:flex-start;line-height:1.5;}
.qz-review li .ic{flex:0 0 auto;font-weight:700;}
.qz-review li.ok .ic{color:var(--pull);} .qz-review li.bad .ic{color:var(--push);}
.qa-list{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
.qa{border-radius:14px;background:var(--paper);border:1px solid var(--line);overflow:hidden;}
.qa summary{cursor:pointer;list-style:none;padding:14px 16px 14px 44px;position:relative;font-size:14.5px;font-weight:650;line-height:1.45;}
.qa summary::-webkit-details-marker{display:none;}
.qa summary::before{content:"+";position:absolute;left:14px;top:13px;width:22px;height:22px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;}
.qa[open] summary::before{content:"−";}
.qa[open] summary{border-bottom:1px solid var(--line);}
.qa-body{padding:14px 16px 16px;background:var(--paper-tint);}
.qa-body p{margin:0 0 10px !important;font-size:14.2px !important;line-height:1.65 !important;color:var(--ink-soft);}
.qa-body p:last-child{margin-bottom:0 !important;}
@media (max-width:960px){
  .shell{grid-template-columns:1fr;}
  .rail{position:fixed;inset:0 20% 0 0;transform:translateX(-100%);transition:transform .25s;z-index:40;box-shadow:0 0 60px rgba(0,0,0,.25);}
  .shell.rail-open .rail{transform:translateX(0);}
  .shell.rail-open::after{content:"";position:fixed;inset:0;background:rgba(20,24,34,.35);z-index:30;}
  .mobile-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--glass-strong);backdrop-filter:blur(20px);position:sticky;top:0;z-index:20;}

html:`
<p class="lede">"A Hero" by R. K. Narayan is a light, humorous story about Swami, an ordinary schoolboy who is afraid of sleeping alone at night. His father insists that courage matters more than strength or age. By a funny twist of fate, the frightened boy ends up catching a burglar and becomes the hero of the whole town.</p>

<div class="block"><div class="block-h"><span class="idx">01</span>What the story is about</div>
<p>Swami is not a brave boy. He fears the dark, believes in ghosts and devils, and feels safe only when he sleeps beside his <b>granny</b>. His father wants to change this and orders him to sleep <b>alone in the office room</b>.</p>
<p>That night, terrified and half-asleep, Swami grabs and bites what he thinks is a devil. It turns out to be a <b>burglar</b>. Overnight, the timid boy becomes a celebrated hero, though in his heart he only wants to go back to his granny.</p>
<div class="flow"><span class="flow-chip">Newspaper report</span><span class="flow-arrow">→</span><span class="flow-chip warn">Father's challenge</span><span class="flow-arrow">→</span><span class="flow-chip warn">Night of fear</span><span class="flow-arrow">→</span><span class="flow-chip good">Burglar caught</span><span class="flow-arrow">→</span><span class="flow-chip good">Swami the hero</span></div></div>

<div class="block"><div class="block-h"><span class="idx">02</span>About the author</div>
<div class="term-card"><div class="lab">R. K. Narayan (1906 to 2001)</div><p>Rasipuram Krishnaswami Iyer Narayanaswami was one of the best-known Indian writers in English, loved for his simple language, gentle humour and warm picture of everyday Indian life.</p></div>
<p>Most of Narayan's stories are set in <b>Malgudi</b>, an imaginary small town in South India. His characters are ordinary people, schoolboys, shopkeepers, clerks and families, whose small problems he describes with sympathy and humour.</p>
<div class="callout extra"><div class="lab">Going further</div><p>Swami first appeared in Narayan's very first novel, <b>Swami and Friends</b> (1935). Narayan received the Sahitya Akademi Award for his novel <b>The Guide</b>, and was honoured with the Padma Bhushan and later the Padma Vibhushan. Many of his Malgudi stories were made into the popular television series <b>Malgudi Days</b>.</p></div></div>

<div class="block"><div class="block-h"><span class="idx">03</span>The people in the story</div>
${chips(["Swami","Father","Mother","Granny","The cook","The servant","The burglar","The police inspector","Headmaster and teacher","Classmates"])}
</div>`};

SECTIONS.newspaper={icon:'📰',label:'The Newspaper Story',sub:'A boy and a tiger',kicker:'Part 1',
html:`
<p class="lede">The story begins one evening at home. Swami's father reads out a newspaper report, and a small family argument about courage begins.</p>

<div class="block"><div class="block-h"><span class="idx">04</span>The report</div>
<p>The report is about a <b>young village boy</b> who came face to face with a <b>tiger</b>. The boy bravely escaped by <b>climbing a tree</b>, and he stayed there for <b>half a day</b> until some people came and killed the tiger.</p>
<p>Swami's father reads this out as an example of courage. But Swami is not impressed in the way his father hopes.</p></div>

<div class="block"><div class="block-h"><span class="idx">05</span>Two views of courage</div>
<div class="tug"><div class="tug-side push-side"><h4>Swami's view</h4><div class="cap">Strength and age decide bravery</div><p>Swami does not believe a young boy could face a tiger. He thinks the boy must actually have been a <b>strong, grown-up</b> person.</p></div><div class="tug-badge">🐯</div><div class="tug-side pull-side"><h4>Father's view</h4><div class="cap">Courage decides bravery</div><p>His father says strength and age are not the most important things. <b>Courage</b> is what matters, and even a physically weak person can do something great if he has it.</p></div></div>
<div class="term-card"><div class="lab">Key idea</div><p>Being brave does not depend only on having a strong body. A person can be physically weak but mentally courageous.</p></div>
<div class="callout"><div class="lab">Why this matters</div><p>This small argument sets up the whole story. Later, Swami, a small and frightened boy, proves his father right without meaning to.</p></div></div>`};

SECTIONS.challenge={icon:'🎯',label:"Father's Challenge",sub:'Sleep alone tonight',kicker:'Part 2',
html:`
<p class="lede">Swami's father decides to test his son. What begins as a light challenge quickly becomes a firm command that Swami cannot escape.</p>

<div class="block"><div class="block-h"><span class="idx">06</span>How the challenge grows</div>
<div class="timeline">
<div class="tl-step"><div class="tl-num">1</div><h5>The challenge</h5><p>The father asks Swami to prove that he has courage by <b>sleeping alone in the office room</b>.</p></div>
<div class="tl-step"><div class="tl-num">2</div><h5>Swami panics</h5><p>Swami is frightened because he has always slept <b>beside his granny</b>. The idea of a whole night alone fills him with dread.</p></div>
<div class="tl-step"><div class="tl-num">3</div><h5>An attempt to escape</h5><p>He tries to change the subject by chattering about his <b>cricket club</b>, bats and balls, hoping his father will forget the challenge.</p></div>
<div class="tl-step"><div class="tl-num">4</div><h5>The command</h5><p>His father does not let him escape. He says Swami must sleep alone <b>that very night</b>, since he is old enough and should not keep sleeping beside his grandmother like a baby.</p></div>
</div>
<div class="callout"><div class="lab">Notice</div><p>The father is completely serious. The playful tone of the challenge disappears, and Swami realises he has no choice.</p></div></div>`};

SECTIONS.officeroom={icon:'🚪',label:'The Office Room',sub:'Excuses and refusals',kicker:'Part 3',
html:`
<p class="lede">Swami is led to the office room for the night. He tries every excuse he can think of, but his father answers each one firmly.</p>

<div class="block"><div class="block-h"><span class="idx">07</span>Going to the room</div>
<p>His father takes Swami's <b>bed</b> and goes with him to the office room himself, making sure there is no way out of the plan.</p></div>

<div class="block"><div class="block-h"><span class="idx">08</span>Swami's excuses and his father's replies</div>
<div class="tbl-wrap"><table class="data"><thead><tr><th>Swami asks</th><th>Father's response</th></tr></thead><tbody>
<tr><td class="n">Can I sleep in the hall instead?</td><td>No. He must sleep in the office room.</td></tr>
<tr><td class="n">There may be scorpions behind the law books.</td><td>There are no scorpions. This is just an excuse to avoid the room.</td></tr>
<tr><td class="n">Please leave a lamp on.</td><td>Refused. Swami must learn not to be afraid of darkness.</td></tr>
<tr><td class="n">(Unspoken wish to go back to granny)</td><td>He may keep the door open, but must not return to granny during the night.</td></tr>
</tbody></table></div>
<div class="callout extra"><div class="lab">Going further</div><p>The mention of <b>law books</b> suggests that Swami's father is a lawyer, and the office room is where he works. To a small boy at night, a quiet room full of heavy books and dark corners can feel especially frightening.</p></div></div>`};

SECTIONS.night={icon:'🌙',label:'A Night of Fear',sub:'Ghost stories and strange sounds',kicker:'Part 4',
html:`
<p class="lede">Once his father leaves, Swami is completely alone. His imagination takes over, and the quiet room seems full of danger.</p>

<div class="block"><div class="block-h"><span class="idx">09</span>Memories that frighten him</div>
<p>Swami remembers every scary story he has ever heard, stories about <b>ghosts and devils</b>, tales told by his friend <b>Mani</b>, and stories of people supposedly attacked by ghosts.</p></div>

<div class="block"><div class="block-h"><span class="idx">10</span>Sounds in the dark</div>
<p>The room is quiet, yet Swami hears many small sounds. Because he is already frightened, each one seems dangerous.</p>
${chips(["Ticking of the clock","Rustling of the trees","Snoring sounds","Noises made by insects"])}
<div class="term-card"><div class="lab">Key idea</div><p>Fear grows in the imagination. Ordinary sounds become threats when the mind is already afraid.</p></div>
<p>He becomes so afraid that he <b>covers himself completely with the blanket</b>, hoping it will protect him.</p></div>`};

SECTIONS.bench={icon:'🛏️',label:'Under the Bench',sub:'Hiding and the nightmare',kicker:'Part 5',
html:`
<p class="lede">Looking for somewhere that feels safer, Swami moves his bed and finally falls asleep, only to be chased by a tiger in his dreams.</p>

<div class="block"><div class="block-h"><span class="idx">11</span>A new hiding place</div>
<p>Swami decides that the space <b>under the bench</b> is safer than the open floor. He spreads his bed there, <b>curls himself up</b>, and eventually falls asleep.</p></div>

<div class="block"><div class="block-h"><span class="idx">12</span>The nightmare</div>
<div class="timeline">
<div class="tl-step"><div class="tl-num">1</div><h5>A tiger appears</h5><p>In his dream, a <b>tiger</b> is chasing him, a reminder of the newspaper story from earlier in the evening.</p></div>
<div class="tl-step"><div class="tl-num">2</div><h5>He cannot run</h5><p>He tries to run, but his feet will not move.</p></div>
<div class="tl-step"><div class="tl-num">3</div><h5>The tiger comes closer</h5><p>Swami hears the sound of its <b>claws</b> as it draws near.</p></div>
<div class="tl-step"><div class="tl-num">4</div><h5>He wakes up</h5><p>He struggles hard to wake and finally opens his eyes.</p></div>
</div>
<div class="callout extra"><div class="lab">Going further</div><p>The tiger in the dream links back to the newspaper report. The worries of the day often return in dreams, and Narayan uses this to show how deeply the talk of tigers and courage has affected Swami.</p></div></div>`};

SECTIONS.burglar={icon:'🦷',label:'The Burglar',sub:'The turning point',kicker:'Part 6',
html:`
<p class="lede">On waking, Swami senses something moving in the dark. What happens next is the turning point of the story.</p>

<div class="block"><div class="block-h"><span class="idx">13</span>Something in the dark</div>
<p>Out of habit, Swami reaches out for his <b>granny</b>, but touches only the <b>wooden leg of the bench</b>. This reminds him that he is alone. Then he hears something moving.</p>
<p>He is terrified and believes a <b>devil</b> has come to attack him. As the object comes closer, Swami becomes desperate and decides to fight.</p></div>

<div class="block"><div class="block-h"><span class="idx">14</span>What happened, step by step</div>
<div class="flow"><span class="flow-chip warn">Something moves</span><span class="flow-arrow">→</span><span class="flow-chip warn">"It's a devil!"</span><span class="flow-arrow">→</span><span class="flow-chip">Swami grabs it tightly</span><span class="flow-arrow">→</span><span class="flow-chip">Bites it hard</span><span class="flow-arrow">→</span><span class="flow-chip good">It's a burglar!</span></div>
<p>Swami comes out from under the bench, <b>holds the object tightly</b> and <b>bites it with his teeth</b>. At once he hears a loud cry: "Aiyo! Something has bitten me."</p></div>

<div class="block"><div class="block-h"><span class="idx">15</span>The big surprise</div>
<p>His <b>father</b>, the <b>cook</b> and a <b>servant</b> rush in with a light. They discover that the person Swami has bitten is a <b>burglar</b> who had broken into the house to steal. His <b>ankle is bleeding</b> from Swami's bite.</p>
<div class="tug"><div class="tug-side push-side"><h4>What Swami thought</h4><div class="cap">In his imagination</div><p>He was fighting a ghost or devil that had come to attack him.</p></div><div class="tug-badge">⚡</div><div class="tug-side pull-side"><h4>What really happened</h4><div class="cap">In reality</div><p>He had caught a dangerous house-breaker in the act.</p></div></div>
<div class="callout extra"><div class="lab">Going further</div><p>"Aiyo" is a common exclamation in South India used to express sudden pain, shock or distress. Its use adds local colour and humour to this dramatic moment.</p></div></div>`};

SECTIONS.hero={icon:'🏅',label:'Swami the Hero',sub:'Praise from everyone',kicker:'Part 7',
html:`
<p class="lede">By the next morning, the frightened boy of the night before is being celebrated as a brave hero.</p>

<div class="block"><div class="block-h"><span class="idx">16</span>Who praised Swami</div>
<div class="ledger">${ledgerRows([
{t:"Everyone at home",d:"Congratulated him the next morning."},
{t:"Classmates",d:"Began to look at him with respect."},
{t:"Teacher",d:"Praised him for his bravery."},
{t:"Headmaster",d:"Called him a true scout."},
{t:"Police",d:"Were grateful because he helped catch a notorious burglar."},
{t:"Police inspector",d:"Asked whether he would like to join the police when he grew up."}
],"pos")}</div>
<div class="callout extra"><div class="lab">Going further</div><p>The Scout movement, started by Robert Baden-Powell in 1907, trains young people to be alert, brave and useful. Its motto is "Be Prepared". Calling Swami a <b>true scout</b> was high praise, which is funny because Swami was anything but prepared that night.</p></div></div>

<div class="block"><div class="block-h"><span class="idx">17</span>Swami's real dreams</div>
<p>Swami politely says yes to the inspector, but secretly he has no wish to become a policeman. He has already decided he would rather become:</p>
${chips(["An engine driver","A railway guard","A bus conductor"],"pull")}
<div class="callout"><div class="lab">Notice the humour</div><p>While adults see a future police officer, Swami is still thinking like an ordinary child, dreaming of trains and buses.</p></div></div>`};

SECTIONS.after={icon:'👵',label:'The Ending',sub:'Back beside granny',kicker:'Part 8',
html:`
<p class="lede">The story ends with a gentle, funny twist that shows Swami has not really changed at all.</p>

<div class="block"><div class="block-h"><span class="idx">18</span>That night</div>
<div class="timeline">
<div class="tl-step"><div class="tl-num">1</div><h5>Father asks</h5><p>Swami's father asks where Swami is sleeping.</p></div>
<div class="tl-step"><div class="tl-num">2</div><h5>Mother answers</h5><p>His mother replies that Swami is sleeping in his <b>usual place, beside granny</b>.</p></div>
<div class="tl-step"><div class="tl-num">3</div><h5>Father understands</h5><p>He realises Swami had not grown comfortable sleeping alone. He had gone back to granny at the first chance.</p></div>
<div class="tl-step"><div class="tl-num">4</div><h5>Mother is angry</h5><p>His mother is angry with his father and does not want him to frighten Swami again.</p></div>
<div class="tl-step"><div class="tl-num">5</div><h5>Swami is relieved</h5><p>Listening secretly from under the blanket, Swami feels very relieved that his father has finally stopped forcing him to sleep alone.</p></div>
</div>
<div class="term-card"><div class="lab">The irony</div><p>The whole town calls Swami a hero, yet the hero himself only wants the comfort of sleeping beside his granny.</p></div></div>`};

SECTIONS.characters={icon:'👥',label:'Characters',sub:'Swami and his family',kicker:'Characters',
html:`
<p class="lede">Narayan draws each member of the family in a few strokes, and their different attitudes create both the conflict and the humour of the story.</p>

<div class="block"><div class="block-h"><span class="idx">19</span>Character sketches</div>
<div class="tree"><div class="tree-root">A Hero</div><div class="tree-kids">
<div class="tree-kid"><h5>Swami</h5><p>A young, innocent and nervous boy. He fears darkness, ghosts and sleeping alone, and tries excuses to avoid the office room. Yet when he believes something is attacking him, he fights back and, without knowing it, catches a burglar.</p></div>
<div class="tree-kid"><h5>Swami's Father</h5><p>Strict and authoritative. He firmly believes children should learn to be courageous and independent. He does not accept Swami's excuses and refuses to let him keep a lamp on.</p></div>
<div class="tree-kid"><h5>Mother</h5><p>Caring and protective. She disagrees with the father's strict methods and becomes angry when he frightens Swami.</p></div>
<div class="tree-kid"><h5>Granny</h5><p>Loving and gentle. Swami normally sleeps beside her and feels completely safe with her. She represents comfort and security.</p></div>
<div class="tree-kid"><h5>The Burglar</h5><p>A notorious house-breaker who enters the house to steal and is caught when Swami bites his ankle.</p></div>
</div></div></div>

<div class="block"><div class="block-h"><span class="idx">20</span>Swami: before and after the night</div>
<div class="tug"><div class="tug-side push-side"><h4>Before</h4><div class="cap">The frightened boy</div><p>Afraid of the dark, makes excuses, hides under the blanket and then under the bench.</p></div><div class="tug-badge">🌗</div><div class="tug-side pull-side"><h4>After</h4><div class="cap">The accidental hero</div><p>Praised by all, but still happiest sleeping beside granny.</p></div></div></div>`};

SECTIONS.themes={icon:'💡',label:'Themes and Message',sub:'Central idea, title and lesson',kicker:'Themes',
html:`
<p class="lede">Beneath its humour, the story says something true about fear and bravery.</p>

<div class="block"><div class="block-h"><span class="idx">21</span>Central idea</div>
<div class="term-card"><div class="lab">Central idea</div><p>Courage can appear when a person is faced with danger. One does not have to be fearless to be courageous.</p></div>
<p>Swami thinks he is too weak to fight anything dangerous, while his father believes courage matters more than strength. <b>Ironically</b>, Swami proves his father's point without intending to. He was frightened all night, but when he believed he was being attacked, he fought back.</p></div>

<div class="block"><div class="block-h"><span class="idx">22</span>Important themes</div>
<div class="tree"><div class="tree-root">Themes</div><div class="tree-kids">
<div class="tree-kid"><h5>Courage</h5><p>The whole story revolves around what makes someone brave. Swami is afraid, yet he still fights the burglar.</p></div>
<div class="tree-kid"><h5>Fear</h5><p>Swami fears darkness, ghosts, devils and sleeping alone. His imagination makes ordinary sounds seem frightening.</p></div>
<div class="tree-kid"><h5>Childhood innocence</h5><p>Swami does not understand what is really happening. He thinks the burglar is a ghost or devil and attacks him.</p></div>
<div class="tree-kid"><h5>Family relationships</h5><p>Each family member cares for Swami differently: his father tries to make him independent, while his mother and granny give comfort and protection.</p></div>
</div></div></div>

<div class="block"><div class="block-h"><span class="idx">23</span>Why the title "A Hero" suits the story</div>
<p>Swami <b>unexpectedly becomes a hero</b> by catching a notorious burglar with a bite. His classmates, teacher, headmaster and the police all praise him.</p>
<p>At the same time the title is <b>humorous</b>. Swami does not see himself as a hero at all. He was frightened throughout, acted out of panic, and wants only to sleep beside his granny again. This mix makes the story both funny and meaningful.</p></div>

<div class="block"><div class="block-h"><span class="idx">24</span>Humour and irony</div>
<div class="ledger">${ledgerRows([
{t:"The challenge backfires",d:"The father wanted Swami to sleep alone; Swami ends up back beside granny."},
{t:"Accidental bravery",d:"Swami bites the burglar believing he is a devil, not to catch a thief."},
{t:"A scout who wasn't prepared",d:"The headmaster calls him a true scout, though he was hiding under a bench."},
{t:"Polite yes, secret no",d:"He agrees to join the police but plans to be an engine driver or bus conductor."}
],"pos")}</div></div>

<div class="block"><div class="block-h"><span class="idx">25</span>The lesson</div>
<div class="finale"><b>Being courageous does not mean never feeling afraid.</b><span>Courage means acting when something frightening happens. Swami was afraid, but he still fought what he believed was attacking him, and that unexpected act made him a hero.</span></div></div>`};

SECTIONS.exercises={icon:'✍️',label:'Questions and Answers',sub:'Practice with model answers',kicker:'Practice',
html:`
<p class="lede">Try answering each question yourself before opening the model answer.</p>

<div class="block"><div class="block-h"><span class="idx">I</span>Fill in the blanks (tap a card to reveal)</div>
${flipGrid([
{term:"1. The newspaper report was about a boy who faced a ______.",def:"Tiger"},
{term:"2. Swami usually slept beside his ______.",def:"Granny"},
{term:"3. Swami was asked to sleep alone in the ______ room.",def:"Office"},
{term:"4. Swami claimed there were ______ behind the law books.",def:"Scorpions"},
{term:"5. Swami finally hid and slept under the ______.",def:"Bench"},
{term:"6. The headmaster called Swami a true ______.",def:"Scout"}
])}</div>

<div class="block"><div class="block-h"><span class="idx">II</span>Answer the following</div>
<div class="qa-list">
<details class="qa"><summary>7. What was the newspaper report about, and how did Swami react to it?</summary><div class="qa-body"><p>The report described a young village boy who faced a tiger, climbed a tree and stayed there for half a day until people came and killed the tiger. Swami did not believe a young boy could do this and felt he must have been a strong, grown-up person.</p></div></details>
<details class="qa"><summary>8. What was the father's opinion about courage?</summary><div class="qa-body"><p>The father believed that strength and age were not important. What mattered was courage. Even a physically weak person could achieve something great if he had courage.</p></div></details>
<details class="qa"><summary>9. How did Swami try to avoid sleeping in the office room?</summary><div class="qa-body"><p>He first tried to change the subject by talking about his cricket club, bats and balls. Later he asked to sleep in the hall, claimed there might be scorpions behind the law books, and asked for a lamp to be left on. His father rejected every excuse.</p></div></details>
<details class="qa"><summary>10. Why did Swami feel frightened in the office room?</summary><div class="qa-body"><p>He was alone in the dark for the first time. He remembered stories of ghosts and devils, including those told by his friend Mani. Small sounds like the ticking clock, rustling trees, snoring and insects seemed dangerous to him because he was already afraid.</p></div></details>
<details class="qa"><summary>11. How did Swami catch the burglar?</summary><div class="qa-body"><p>After a nightmare about a tiger, Swami woke and heard something moving. Believing it was a devil, he came out from under the bench, held the object tightly and bit it. The burglar cried out, and Swami's father, the cook and a servant rushed in with a light and found the burglar with a bleeding ankle.</p></div></details>
<details class="qa"><summary>12. How was Swami honoured after the incident?</summary><div class="qa-body"><p>Everyone congratulated him. His classmates respected him, his teacher praised him, and the headmaster called him a true scout. The police were grateful for his help in catching a notorious burglar, and the inspector asked if he would like to join the police.</p></div></details>
<details class="qa"><summary>13. Where did Swami sleep the next night? Why was he relieved?</summary><div class="qa-body"><p>He slept in his usual place beside his granny. He overheard his mother being angry with his father for frightening him, and was relieved that his father would no longer force him to sleep alone.</p></div></details>
<details class="qa"><summary>14. Is Swami really a hero? Give reasons.</summary><div class="qa-body"><p>In one way, yes: he did catch a dangerous burglar, which the police themselves could not do. In another way, he is an accidental hero. He acted out of panic, thinking he was fighting a devil. Still, the story suggests that true courage is not the absence of fear but acting in spite of it, and Swami did act when he felt threatened.</p></div></details>
<details class="qa"><summary>15. Compare the attitudes of Swami's father and mother.</summary><div class="qa-body"><p>The father is strict and wants Swami to become independent and brave, so he forces him to sleep alone. The mother is caring and protective, disapproves of this method and gets angry when he frightens Swami. Both love him, but in different ways.</p></div></details>
</div></div>

<div class="block"><div class="block-h"><span class="idx">III</span>Think and discuss</div>
<div class="callout"><div class="lab">Discussion 1</div><p>Was Swami's father right to force him to sleep alone? What would you have done in his place?</p></div>
<div class="callout"><div class="lab">Discussion 2</div><p>Recall a time you felt afraid but still did something brave. How did you feel afterwards?</p></div>
<div class="callout"><div class="lab">Discussion 3</div><p>Imagine you are Swami. Write a diary entry about the night you caught the burglar.</p></div></div>`};

<div class="block"><div class="block-h"><span class="idx">27</span>Glossary (tap a card to reveal)</div>
${flipGrid([
{term:"Courage",def:"The ability to act in spite of fear."},
{term:"Burglar",def:"A person who breaks into a building to steal."},

{term:"Irony",def:"When the result is the opposite of what is expected."},

])}</div>

<div class="block"><div class="block-h"><span class="idx">28</span>Story map</div>
${radialMap("A Hero",[
{label:"Report",color:"#6c5ce0",body:chips(["Boy","Tiger"])},
{label:"Challenge",color:"#1d7f63",body:chips(["Sleep alone"])},
{label:"Office room",color:"#1f2937",body:chips(["Scorpions","No lamp"])},
{label:"Fear",color:"#b4442f",body:chips(["Ghosts","Sounds"])},
{label:"Bench",color:"#8778e8",body:chips(["Nightmare"])},

{label:"Hero",color:"#1f2937",body:chips(["Scout","Police"])},
{label:"Ending",color:"#1d7f63",body:chips(["Granny"])}
])}</div>

<div class="block"><div class="block-h"><span class="idx">29</span>In one sentence</div>
<div class="finale"><b>A frightened boy, an accidental hero.</b><span>"A Hero" is the humorous story of how a young boy named Swami, afraid of sleeping alone, accidentally becomes a hero by catching a burglar.</span></div></div>`};

var SECTION_ORDER=['overview','newspaper','challenge','officeroom','night','bench','burglar','hero','after','characters','themes','exercises','reference'];

var quizQs=[
{q:"Who wrote the story 'A Hero'?",opts:["Ruskin Bond","R. K. Narayan","Premchand","Rabindranath Tagore"],correct:1},
{q:"What animal did the boy in the newspaper report face?",opts:["A lion","A snake","A tiger","An elephant"],correct:2},
{q:"How did the village boy escape?",opts:["He ran home","He climbed a tree","He hid in a hut","He fought with a stick"],correct:1},
{q:"How long did the boy stay in the tree?",opts:["An hour","Half a day","Two days","The whole night"],correct:1},
{q:"According to Swami's father, what matters most?",opts:["Strength","Age","Courage","Height"],correct:2},
{q:"Where did Swami usually sleep?",opts:["Beside his mother","Beside his granny","In the hall","In the office room"],correct:1},
{q:"What did Swami talk about to change the subject?",opts:["His exams","His cricket club","His friend Mani","The newspaper"],correct:1},
{q:"What excuse did Swami give about the office room?",opts:["It was too cold","There were rats","There might be scorpions behind the law books","It was too small"],correct:2},
{q:"What did the father refuse to allow?",opts:["An open door","A lamp to be left on","A blanket","A pillow"],correct:1},
{q:"Which friend's stories did Swami remember?",opts:["Rajam","Mani","Somu","Sankar"],correct:1},
{q:"Where did Swami finally sleep in the office room?",opts:["On the table","Under the bench","Near the window","Behind the door"],correct:1},
{q:"What chased Swami in his nightmare?",opts:["A ghost","A dog","A tiger","A burglar"],correct:2},
{q:"What did Swami touch when he reached out for granny?",opts:["The wall","The wooden leg of the bench","A law book","The blanket"],correct:1},
{q:"What did Swami think the moving object was?",opts:["A cat","His father","A devil","The cook"],correct:2},
{q:"How did Swami attack the burglar?",opts:["He hit him","He shouted","He bit him","He threw a book"],correct:2},
{q:"Where was the burglar injured?",opts:["His hand","His ankle","His arm","His face"],correct:1},
{q:"What did the headmaster call Swami?",opts:["A true soldier","A true scout","A little policeman","A lion"],correct:1},
{q:"What did the police inspector ask Swami?",opts:["To give a speech","If he would join the police when he grew up","To meet the burglar","To visit the station daily"],correct:1},
{q:"Which is NOT one of Swami's career wishes?",opts:["Engine driver","Railway guard","Bus conductor","Policeman"],correct:3},
{q:"Where did Swami sleep the next night?",opts:["In the office room","Beside his granny","In the hall","With his father"],correct:1},
{q:"The main message of the story is that",opts:["Only strong people are brave","Courage means acting in spite of fear","Children must never be afraid","Burglars are easy to catch"],correct:1}
];


var quizIndex=0,quizScore=0,quizAnswers=new Array(quizQs.length).fill(null);
var letters=['A','B','C','D'];
var content=document.getElementById('content');

function renderQuizQuestion(){
  var i=quizIndex,item=quizQs[i],answered=quizAnswers[i]!==null;
  var progress=quizQs.map(function(_,idx){var c='';if(idx<i)c='done';else if(idx===i)c='current';return '<span class="'+c+'"></span>';}).join('');
  var opts=item.opts.map(function(o,idx){var c='qz-choice';if(answered){if(idx===item.correct)c+=' correct';else if(idx===quizAnswers[i])c+=' wrong';}return '<button class="'+c+'" data-idx="'+idx+'" '+(answered?'disabled':'')+'><span class="let">'+letters[idx]+'</span>'+o+'</button>';}).join('');
  var fb=answered?(quizAnswers[i]===item.correct?'<div class="qz-feedback ok">✓ Correct, well done!</div>':'<div class="qz-feedback no">✗ Not quite. The correct answer is <b>'+letters[item.correct]+'. '+item.opts[item.correct]+'</b>.</div>'):'';
  content.innerHTML='<div class="kicker">Test yourself</div><div class="quiz-head"><div class="qz-progress">'+progress+'</div><div class="qz-count">Question '+(i+1)+' of '+quizQs.length+'</div></div><div class="glass qz-card"><div class="qz-text">'+item.q+'</div>'+opts+fb+'<div class="qz-btnrow"><button class="btn btn-ghost" id="qPrev" '+(i===0?'disabled':'')+'>← Back</button><button class="btn btn-primary" id="qNext" '+(answered?'':'disabled')+'>'+(i===quizQs.length-1?'See results':'Next')+' →</button></div></div>';
  document.querySelectorAll('.qz-choice').forEach(function(b){b.addEventListener('click',function(){if(quizAnswers[i]!==null)return;var idx=parseInt(b.getAttribute('data-idx'));quizAnswers[i]=idx;if(idx===item.correct)quizScore++;renderQuizQuestion();});});
  document.getElementById('qPrev').addEventListener('click',function(){quizIndex--;renderQuizQuestion();});
  document.getElementById('qNext').addEventListener('click',function(){if(i===quizQs.length-1)renderQuizResults();else{quizIndex++;renderQuizQuestion();}});
}
function renderQuizResults(){
  var pct=Math.round(quizScore/quizQs.length*100),st='Keep practising';
  if(pct>=90)st='Excellent grasp!';else if(pct>=70)st='Solid understanding';else if(pct>=50)st='Good start';
  var review=quizQs.map(function(it,idx){var ok=quizAnswers[idx]===it.correct;return '<li class="'+(ok?'ok':'bad')+'"><span class="ic">'+(ok?'✓':'✗')+'</span><span><b>'+(idx+1)+'. '+it.q+'</b><br>Correct answer: '+letters[it.correct]+'. '+it.opts[it.correct]+'</span></li>';}).join('');
  content.innerHTML='<div class="kicker">Results</div><h1 class="page-title">You scored '+quizScore+' / '+quizQs.length+'</h1><p class="lede">Here is how you did on the A Hero quiz.</p><div class="qz-mastery"><div class="qz-stat"><div class="num">'+pct+'%</div><div class="lab">Accuracy</div></div><div class="qz-stat"><div class="num">'+quizScore+'</div><div class="lab">Correct answers</div><span class="qz-badge">'+st+'</span></div></div><ul class="qz-review">'+review+'</ul><div class="qz-btnrow"><button class="btn btn-ghost" id="retakeBtn">↺ Retake quiz</button><button class="btn btn-primary" id="toRefBtn">See quick reference →</button></div>';
  document.getElementById('retakeBtn').addEventListener('click',function(){quizIndex=0;quizScore=0;quizAnswers=new Array(quizQs.length).fill(null);renderQuizQuestion();});
  document.getElementById('toRefBtn').addEventListener('click',function(){setSection('reference');});
}

function buildNav(){
  var nav=document.getElementById('routeNav'),h='';
  SECTION_ORDER.forEach(function(id){var s=SECTIONS[id];h+='<button class="wp" data-sec="'+id+'"><span class="wp-dot">'+s.icon+'</span><span>'+s.label+'<small>'+s.sub+'</small></span></button>';});
  h+='<button class="wp wp-quiz" data-sec="quiz"><span class="wp-dot">🧠</span><span>Take the Quiz<small>'+quizQs.length+' questions · instant feedback</small></span></button>';
  nav.innerHTML=h;
  nav.querySelectorAll('.wp').forEach(function(b){b.addEventListener('click',function(){setSection(b.getAttribute('data-sec'));});});
}
function setSection(id){
  document.querySelectorAll('.wp').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-sec')===id);});
  if(id==='quiz'){quizIndex=0;quizScore=0;quizAnswers=new Array(quizQs.length).fill(null);renderQuizQuestion();}
  else{var s=SECTIONS[id];content.innerHTML='<div class="kicker">A Hero · '+s.kicker+'</div><h1 class="page-title">'+s.label+'</h1>'+s.html;}
  window.scrollTo(0,0);
  document.getElementById('shell').classList.remove('rail-open');
}
document.addEventListener('click',function(e){var c=e.target.closest('.flip-card');if(c)c.classList.toggle('flipped');});
document.getElementById('railToggle').addEventListener('click',function(){document.getElementById('shell').classList.toggle('rail-open');});
document.getElementById('shell').addEventListener('click',function(e){if(e.target.id==='shell')document.getElementById('shell').classList.remove('rail-open');});
buildNav();
setSection('overview');
</script>
